<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030309"><title>GOD PREDITOR · HISTORY LIVE</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 37%,#211047 0,#080914 47%,#030309 75%);color:#fff;font-family:system-ui,-apple-system,Arial;min-height:100vh;text-align:center;padding:20px 12px 42px}.wrap{max-width:680px;margin:auto}h1{font-size:24px;letter-spacing:2px;margin:10px 0 5px;color:#e7d7ff;text-shadow:0 0 18px #8e3dff}#status{font-size:11px;color:#b4aacd;margin-bottom:20px}.rounds{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.round{border:1px solid #3c2c61;background:#121025b8;border-radius:12px;padding:10px 2px}.round strong{display:block;font-size:17px;color:#b3ffcf}.round.big strong{color:#ffcb74}.round.mega strong{color:#f49cff}.round small{display:block;font-size:10px;color:#a7a0c2;margin-top:5px}.orb{width:min(84vw,355px);height:min(84vw,355px);margin:30px auto 18px;position:relative;display:grid;place-items:center}.orb:before,.orb:after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0%,#b45cff 15%,transparent 30%,#5be7ff 52%,transparent 68%,#a343ff 88%,transparent);animation:spin 7s linear infinite;filter:drop-shadow(0 0 15px #792aff)}.orb:after{inset:15px;animation:spin 5s linear infinite reverse;opacity:.55;filter:blur(8px)}.inside{position:relative;z-index:2;width:calc(100% - 48px);height:calc(100% - 48px);border-radius:50%;background:radial-gradient(circle,#201339,#0b0a1c 72%);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 30px #50227b;border:1px solid #6c3d9c}.inside .tiny{font-size:11px;color:#c2a5ee;letter-spacing:1.5px}.inside .time{font-size:43px;font-weight:800;font-variant-numeric:tabular-nums;margin:10px 0;color:#fff}.inside .target{font-size:23px;font-weight:800;color:#c48aff}.inside .end{font-size:13px;color:#bcb3d3;margin-top:8px}.signal{font-size:16px;line-height:1.65;color:#e9defd;margin-top:15px}.signal b{color:#c18aff}.note{font-size:11px;color:#88819c;margin-top:18px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:370px){.round strong{font-size:14px}.round small{font-size:9px}.inside .time{font-size:35px}}</style></head><body><main class="wrap"><h1>GOD PREDITOR</h1><div id="status">Подключение к Supabase…</div><section id="rounds" class="rounds"></section><div class="orb"><div class="inside"><div class="tiny">ОКНО НАБЛЮДЕНИЯ · КИЕВ</div><div id="clock" class="time">--:--:--</div><div id="target" class="target">ОЖИДАНИЕ</div><div id="end" class="end">История загружается</div></div></div><div id="signal" class="signal">Ожидаем свежие коэффициенты…</div><div class="note">Временное окно — статистическая эвристика, не гарантия результата.</div></main><script src="../../luckyjet-supabase.js"></script><script>(()=>{'use strict';const $=id=>document.getElementById(id),kyiv=t=>new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Kyiv',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(t)),med=a=>{if(!a.length)return NaN;const s=[...a].sort((x,y)=>x-y),k=s.length>>1;return s.length%2?s[k]:(s[k-1]+s[k])/2},clamp=(x,a,b)=>Math.max(a,Math.min(b,x));let history=[],lastLoad=0,online=false;function clean(rows){const seen=new Set();return rows.map(r=>({id:String(r.id||r.timestamp),coefficient:Number(r.coefficient),timestamp:Number(r.timestamp)||Date.parse(r.round_timestamp||r.time)})).filter(r=>Number.isFinite(r.coefficient)&&r.coefficient>=1&&Number.isFinite(r.timestamp)&&r.timestamp>0&&!seen.has(r.id)&&(seen.add(r.id),true)).sort((a,b)=>b.timestamp-a.timestamp)}function display(){const arr=history.slice(0,20);$('rounds').replaceChildren(...arr.map(r=>{const d=document.createElement('div');d.className='round'+(r.coefficient>=100?' mega':r.coefficient>=10?' big':'');const b=document.createElement('strong');b.textContent=r.coefficient.toFixed(2)+'×';const s=document.createElement('small');s.textContent=kyiv(r.timestamp);d.append(b,s);return d}));const now=Date.now();$('clock').textContent=kyiv(now);if(!online||!history.length||now-history[0].timestamp>180000||history.length<20){$('target').textContent='НЕТ LIVE';$('end').textContent='Нужна свежая история';$('signal').textContent='Ожидание актуальных раундов Supabase';return}const chronological=[...history].reverse();const xs=chronological.map(r=>r.coefficient);const ema=(n)=>{let v=xs[0],a=2/(n+1);for(const x of xs.slice(1))v+=a*(x-v);return v};const e20=ema(20),e50=ema(50),m=med(xs.slice(-50)),mad=med(xs.slice(-50).map(x=>Math.abs(x-m)));const recent=xs.slice(-80),big20=recent.filter(x=>x>=20).length,low=xs.slice(-15).filter(x=>x<2).length;const thresholds=[100,50,20,10];let candidate=null;for(const t of thresholds){const ev=chronological.filter(r=>r.coefficient>=t),gaps=ev.slice(1).map((r,i)=>r.timestamp-ev[i].timestamp).filter(v=>v>0);if(gaps.length<4)continue;const cycle=med(gaps),dev=med(gaps.map(v=>Math.abs(v-cycle)));if(!Number.isFinite(cycle)||cycle<10000)continue;const last=ev.at(-1).timestamp,elapsed=now-last;const left=cycle-elapsed;const future=left>0?left:clamp(cycle*.2,30000,120000);const windowMs=clamp(Math.max(dev*2,cycle*.25),60000,180000);const score=(t===100?4:t===50?3:t===20?2:1)+(left>=-windowMs&&left<=180000?3:0)+(big20>=4?1:0);if(!candidate||score>candidate.score)candidate={t,at:now+future,until:now+future+windowMs,cycle,dev,score}}if(!candidate){const target=clamp((e20+e50)/2,1.1,2.4);$('target').textContent='ЦЕЛЬ '+target.toFixed(2)+'×';$('end').textContent='Окно не установлено';$('signal').textContent='Недостаточно событий ≥10× для оценки временного цикла';return}const c=candidate;$('target').textContent='ЦЕЛЬ '+c.t+'×';$('end').textContent='До '+kyiv(c.until);$('signal').innerHTML='Расчётное время: <b>'+kyiv(c.at)+' — '+kyiv(c.until)+'</b><div style="font-size:12px;color:#a99cbf">EMA20 '+e20.toFixed(2)+'× · EMA50 '+e50.toFixed(2)+'× · Median '+m.toFixed(2)+'× · MAD '+mad.toFixed(2)+' · низких '+low+'/15</div>'}async function load(){const api=window.LuckyJetSupabase;if(!api){$('status').textContent='Модуль Supabase не загружен';return}try{const result=await api.history(1000,0,true);history=clean(result.rows||[]);online=true;lastLoad=Date.now();$('status').textContent='● SUPABASE LIVE · '+history.length+' раундов в анализе';display()}catch(e){online=false;$('status').textContent='● SUPABASE OFFLINE · '+String(e.message||e);display()}}window.addEventListener('luckyjetSupabaseRound',e=>{const r=clean([e.detail]);if(r.length){history=clean([...r,...history]).slice(0,1000);online=true;display()}});setInterval(()=>{$('clock').textContent=kyiv(Date.now());if(Date.now()-lastLoad>12000)load();else display()},1000);load()})();</script><script src="live-coefficients.js?v=20261014-supabase-1"></script>
</body></html>
