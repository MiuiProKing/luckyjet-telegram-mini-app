<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LuckyJet — AllPredictor LIVE</title><style>
:root{--bg:#061a40;--card:#111b34;--line:#29446d;--txt:#fff;--muted:#9fb2cf;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--blue:#3b82f6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding:20px}.app{max-width:680px;margin:auto;display:grid;gap:14px}.top{display:flex;align-items:center;justify-content:space-between}.top h1{font-size:22px;margin:0}.btn{border:1px solid #ef4444;background:#000;color:#fff;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.btn:active{transform:scale(.98)}.btn.small{padding:9px 12px;border-color:var(--line)}.row{display:flex;gap:10px;flex-wrap:wrap}.card{background:rgba(17,27,52,.92);border:1px solid var(--line);border-radius:14px;padding:14px}.badge{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-weight:800}.dot{width:9px;height:9px;border-radius:50%;background:#64748b}.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.circle{width:190px;height:190px;margin:8px auto;border-radius:50%;display:grid;place-items:center;background:#17243e;border:3px solid #ef4444;box-shadow:0 0 30px #0006}.coef{font-size:28px;font-weight:900;color:#22c55e}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cell{text-align:center;background:#0c1428;border:1px solid var(--line);border-radius:12px;padding:10px}.lab{font-size:11px;color:var(--muted)}.val{font-size:17px;font-weight:900;margin-top:4px}.live{display:flex;gap:7px;overflow:auto}.chip{flex:0 0 auto;background:#0c1428;border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-weight:900}.muted{color:var(--muted);font-size:12px}.status{text-align:center;min-height:20px;font-size:13px}.oktxt{color:var(--ok)}.badtxt{color:var(--bad)}.warntxt{color:var(--warn)}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;padding:30px 15px;z-index:10}.modal.open{display:flex}.panel{width:min(620px,100%);background:#111b34;border:1px solid var(--line);border-radius:16px;padding:16px}.panel h2{margin:0 0 14px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:#081225;color:#fff;padding:0 11px;font-size:15px}.history{display:grid;gap:8px;max-height:60vh;overflow:auto}.hist{padding:10px;border:1px solid var(--line);border-radius:10px;background:#0c1428}.source{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(max-width:520px){body{padding:14px}.grid{grid-template-columns:1fr 1fr}.grid .cell:last-child{grid-column:1/-1}.top h1{font-size:18px}}
</style><script src="app-config.js?v=20260724-32"></script><script src="i18n-runtime.js?v=20260724-32"></script><script src="language-onboarding.js?v=20260724-32"></script><script src="license-client.js?v=20260724-32"></script><script src="access.js?v=20260724-32"></script><script src="analytics-client.js?v=20260724-32"></script><script src="app-center.js?v=20260724-32"></script></head><body><main class="app">
<div class="top"><button class="btn small" id="settingsBtn">⚙️</button><h1>LUCKYJET <span style="color:#60a5fa">LIVE</span></h1><button class="btn small" id="historyBtn">🕘</button></div>
<div class="card"><div class="badge"><span class="dot" id="marketDot"></span><span id="marketText">Рынок —</span></div><div style="float:right" class="muted" id="apiState">ПОДКЛЮЧЕНИЕ…</div></div>
<div class="card"><div class="muted" style="margin-bottom:8px">ПОСЛЕДНИЕ КОЭФФИЦИЕНТЫ</div><div class="live" id="coeffs"><span class="muted">Нет данных</span></div><div class="muted source" id="source">Источник: /api/v1/luckyjet/market</div></div>
<div class="circle"><div class="coef" id="prediction">0.00X</div></div>
<div class="grid"><div class="cell"><div class="lab">ВХОД</div><div class="val" id="betTime">--:--:--</div></div><div class="cell"><div class="lab">РАУНД</div><div class="val"><span id="round">0</span>/3</div></div><div class="cell"><div class="lab">УВЕРЕННОСТЬ</div><div class="val" id="confidence">—</div></div></div>
<div class="grid"><div class="cell"><div class="lab">✅ УСПЕХ</div><div class="val" id="wins">0</div></div><div class="cell"><div class="lab">❌ НЕУДАЧА</div><div class="val" id="losses">0</div></div><div class="cell"><div class="lab">ВСЕГО</div><div class="val" id="total">0</div></div></div>
<div class="row" style="justify-content:center"><button class="btn" id="manualBtn">ПОЛУЧИТЬ ПРОГНОЗ</button><button class="btn" id="autoBtn">АВТО: ВЫКЛ</button></div><div class="status" id="status"></div>
</main>
<div class="modal" id="settings"><div class="panel"><h2>Настройки</h2><div class="field"><label>AllPredictor API key (ap_...)</label><input id="apiKey" placeholder="ap_..."></div><div class="row"><div class="field" style="flex:1"><label>Минимум X</label><input id="minX" type="number" step="0.01" value="2.00"></div><div class="field" style="flex:1"><label>Максимум X</label><input id="maxX" type="number" step="0.01" value="8.00"></div></div><div class="row"><button class="btn small" id="saveBtn">СОХРАНИТЬ</button><button class="btn small" id="testBtn">ПРОВЕРИТЬ API</button><button class="btn small" id="closeSettings">ЗАКРЫТЬ</button></div><div class="status" id="testStatus"></div><p class="muted">Ключ хранится только в localStorage этого браузера и не записан в GitHub.</p></div></div>
<div class="modal" id="history"><div class="panel"><h2>История</h2><div class="history" id="historyList"></div><div class="row" style="margin-top:12px"><button class="btn small" id="clearHistory">ОЧИСТИТЬ</button><button class="btn small" id="closeHistory">ЗАКРЫТЬ</button></div></div></div>
<script>
'use strict';
const BASE='https://allpredictor.com/api/v1';const K='lj_ap_key',S='lj_stats',H='lj_hist',R='lj_range';
const $=id=>document.getElementById(id);const safeGet=(k,d)=>{try{return localStorage.getItem(k)??d}catch{return d}},safeSet=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
let key=safeGet(K,''),stats=JSON.parse(safeGet(S,'{"w":0,"l":0}')),hist=JSON.parse(safeGet(H,'[]')),range=JSON.parse(safeGet(R,'{"min":2,"max":8}'));let market='warn',last=[],pending=null,auto=false,polling=false;
function headers(){return{'X-API-Key':key,'Accept':'application/json'}}function setStatus(t,c=''){ $('status').className='status '+c;$('status').textContent=t}function fmt(d){return[d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':')}function num(v){const n=Number(v);return Number.isFinite(n)?n:null}
async function jfetch(url,timeout=9000){const c=new AbortController(),tm=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(url,{headers:headers(),signal:c.signal,cache:'no-store'});const text=await r.text();let d;try{d=JSON.parse(text)}catch{d={raw:text}}if(!r.ok){const e=new Error((d&&d.message)||('HTTP '+r.status));e.status=r.status;throw e}return d}finally{clearTimeout(tm)}}
function walk(o,out=[],depth=0){if(depth>5||o==null)return out;if(Array.isArray(o)){if(o.length&&o.every(x=>num(x)!=null))out.push(o.map(Number));o.forEach(x=>walk(x,out,depth+1));return out}if(typeof o==='object')Object.entries(o).forEach(([k,v])=>{if(/coef|coefficient|history|result|crash/i.test(k)){if(Array.isArray(v)){const a=v.map(x=>typeof x==='object'?num(x.coef??x.coefficient??x.value??x.multiplier):num(x)).filter(x=>x!=null);if(a.length)out.push(a)}}walk(v,out,depth+1)});return out}
function parseMarket(d){const level=String(d.level??d.market_level??d.market?.level??d.data?.level??'warn').toLowerCase();const score=num(d.market_score??d.score??d.market?.score??d.data?.market_score);const arrays=walk(d).sort((a,b)=>b.length-a.length);return{level:['safe','warn','danger'].includes(level)?level:'warn',score,coefs:(arrays[0]||[]).map(Number).filter(x=>x>=1).slice(0,30)}}
function parsePred(d){const root=d.data&&typeof d.data==='object'?{...d,...d.data}:d;return{ok:root.success!==false,target:num(root.predicted_coef??root.prediction??root.coef??root.target),confidence:num(root.confidence??root.confidence_percent??root.probability),signal:root.signal??root.action??'',bet:root.bet_time??root.timing??null}}
function uiStats(){$('wins').textContent=stats.w||0;$('losses').textContent=stats.l||0;$('total').textContent=(stats.w||0)+(stats.l||0)}function saveStats(){safeSet(S,JSON.stringify(stats));uiStats()}
function uiMarket(m){market=m.level;$('marketText').textContent=m.level==='safe'?'Рынок благоприятный':m.level==='danger'?'Рынок опасный':'Рынок умеренный';$('marketDot').className='dot '+(m.level==='safe'?'ok':m.level==='danger'?'bad':'warn')}
function uiCoefs(a){const c=$('coeffs');c.innerHTML='';if(!a.length){c.innerHTML='<span class="muted">В /market нет коэффициентов</span>';return}a.slice(0,20).forEach(x=>{const e=document.createElement('span');e.className='chip';e.textContent=Number(x).toFixed(2)+'x';c.appendChild(e)})}
function newResults(prev,cur){if(!prev.length||!cur.length)return[];const p=prev.map(x=>Number(x).toFixed(2)),c=cur.map(x=>Number(x).toFixed(2));for(let add=1;add<=Math.min(5,c.length);add++){if(c.slice(add,add+Math.min(p.length,c.length-add)).join('|')===p.slice(0,Math.min(p.length,c.length-add)).join('|'))return cur.slice(0,add)}return c[0]!==p[0]?[cur[0]]:[]}
function finish(coef){if(!pending)return;pending.round++;pending.out.push(coef);$('round').textContent=pending.round;if(coef>=pending.target){stats.w=(stats.w||0)+1;hist.unshift({target:pending.target,ok:true,out:pending.out,time:Date.now()});safeSet(H,JSON.stringify(hist));saveStats();setStatus('✅ ЗАШЁЛ на '+pending.round+' раунде','oktxt');pending=null;if(auto)setTimeout(getPrediction,3000)}else if(pending.round>=3){stats.l=(stats.l||0)+1;hist.unshift({target:pending.target,ok:false,out:pending.out,time:Date.now()});safeSet(H,JSON.stringify(hist));saveStats();setStatus('❌ НЕ ЗАШЁЛ за 3 раунда','badtxt');pending=null;if(auto)setTimeout(getPrediction,3000)}}
async function poll(){if(polling||!key)return;polling=true;try{const d=await jfetch(BASE+'/luckyjet/market');const m=parseMarket(d);uiMarket(m);uiCoefs(m.coefs);$('apiState').textContent='MARKET OK';$('apiState').className='muted oktxt';$('source').textContent=m.coefs.length?'LIVE: /api/v1/luckyjet/market • коэффициенты получены':'MARKET OK • массив коэффициентов не найден';if(m.coefs.length){newResults(last,m.coefs).forEach(finish);last=m.coefs.slice()}}catch(e){$('apiState').textContent=e.status?'HTTP '+e.status:'CORS/OFFLINE';$('apiState').className='muted badtxt';$('source').textContent='Ошибка /market: '+e.message}finally{polling=false}}
async function getPrediction(){if(!key){setStatus('Открой настройки и введи API key ap_...','badtxt');$('settings').classList.add('open');return}if(pending)return;setStatus('Получаю рынок и прогноз AllPredictor…','warntxt');await poll();if(market==='danger'){setStatus('⛔ Рынок опасный — прогноз отменён','badtxt');return}try{const d=await jfetch(BASE+'/luckyjet/predict');const p=parsePred(d);if(!p.ok||p.target==null)throw new Error('В /predict нет predicted_coef');if(p.target<Number(range.min)||p.target>Number(range.max)){ $('prediction').textContent=p.target.toFixed(2)+'X';$('confidence').textContent=p.confidence!=null?Math.round(p.confidence)+'%':'—';setStatus('Прогноз вне диапазона '+range.min+'–'+range.max+'x','badtxt');return}$('prediction').textContent=p.target.toFixed(2)+'X';$('confidence').textContent=p.confidence!=null?Math.round(p.confidence)+'%':'—';$('betTime').textContent=fmt(new Date());$('round').textContent='0';pending={target:p.target,round:0,out:[]};setStatus('🎯 Прогноз AllPredictor '+p.target.toFixed(2)+'x'+(p.signal?' • '+String(p.signal).toUpperCase():''),'oktxt')}catch(e){setStatus('Ошибка /predict: '+e.message,'badtxt')}}
async function test(){const o=[];$('testStatus').textContent='Проверка…';try{const m=parseMarket(await jfetch(BASE+'/luckyjet/market'));o.push('MARKET OK'+(m.coefs.length?' • кефов '+m.coefs.length:' • без кефов'))}catch(e){o.push('MARKET '+(e.status?'HTTP '+e.status:e.message))}try{const p=parsePred(await jfetch(BASE+'/luckyjet/predict'));o.push(p.target!=null?'PREDICT OK • '+p.target.toFixed(2)+'x':'PREDICT: нет predicted_coef')}catch(e){o.push('PREDICT '+(e.status?'HTTP '+e.status:e.message))}$('testStatus').textContent=o.join(' | ')}
function renderHist(){const e=$('historyList');e.innerHTML='';if(!hist.length){e.innerHTML='<div class="muted">История пустая</div>';return}hist.forEach(x=>{const d=document.createElement('div');d.className='hist';d.textContent=(x.ok?'✅ ':'❌ ')+Number(x.target).toFixed(2)+'x • '+(x.out||[]).map(v=>Number(v).toFixed(2)+'x').join(' / ')+' • '+new Date(x.time).toLocaleString();e.appendChild(d)})}
$('settingsBtn').onclick=()=>{$('apiKey').value=key;$('minX').value=range.min;$('maxX').value=range.max;$('settings').classList.add('open')};$('closeSettings').onclick=()=>$('settings').classList.remove('open');$('historyBtn').onclick=()=>{renderHist();$('history').classList.add('open')};$('closeHistory').onclick=()=>$('history').classList.remove('open');$('manualBtn').onclick=getPrediction;$('autoBtn').onclick=()=>{auto=!auto;$('autoBtn').textContent='АВТО: '+(auto?'ВКЛ':'ВЫКЛ');if(auto&&!pending)getPrediction()};$('saveBtn').onclick=()=>{const k=$('apiKey').value.trim(),mn=Number($('minX').value),mx=Number($('maxX').value);if(!k.startsWith('ap_')){$('testStatus').textContent='Ключ должен начинаться с ap_';return}if(!Number.isFinite(mn)||!Number.isFinite(mx)||mx<=mn){$('testStatus').textContent='Неверный диапазон';return}key=k;range={min:mn,max:mx};safeSet(K,key);safeSet(R,JSON.stringify(range));$('testStatus').textContent='Сохранено';last=[];poll()};$('testBtn').onclick=test;$('clearHistory').onclick=()=>{hist=[];safeSet(H,'[]');renderHist()};uiStats();if(key){poll();setInterval(poll,4000)}else{$('apiState').textContent='НЕТ API KEY';$('apiState').className='muted warntxt'}
</script></body></html>
