<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LuckyJet — AllPredictor DIRECT</title>
<style>
:root{--bg:#061a40;--card:#0d1830;--line:#31517f;--txt:#fff;--mut:#9cb1cf;--ok:#19c37d;--bad:#ff4747;--warn:#f5a623}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding:16px}.app{max-width:680px;margin:auto;display:grid;gap:14px}.top{display:flex;align-items:center;justify-content:space-between}.top h1{font-size:20px;margin:0}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.btn{background:#000;border:1px solid var(--bad);color:#fff;border-radius:10px;padding:12px 16px;font-weight:900;min-height:46px}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.badge{display:flex;align-items:center;gap:8px;font-weight:800}.dot{width:9px;height:9px;border-radius:50%;background:#64748b}.safe{background:var(--ok)}.warn{background:var(--warn)}.danger{background:var(--bad)}.circle{width:200px;height:200px;margin:8px auto;border-radius:50%;display:grid;place-items:center;background:#1a2944;border:4px solid var(--bad)}.coef{font-size:34px;font-weight:950;color:#22d66f}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cell{text-align:center;background:#081225;border:1px solid var(--line);border-radius:13px;padding:11px}.lab{font-size:11px;color:var(--mut)}.val{font-size:18px;font-weight:900;margin-top:5px}.live{display:flex;gap:7px;overflow:auto;padding-top:8px}.chip{flex:0 0 auto;background:#081225;border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-weight:900}.status{text-align:center;min-height:22px}.oktxt{color:var(--ok)}.badtxt{color:var(--bad)}.mut{color:var(--mut);font-size:12px}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;padding:28px 14px;z-index:20}.modal.open{display:flex}.panel{width:min(620px,100%);background:#111b34;border:1px solid var(--line);border-radius:16px;padding:16px}.field input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:#081225;color:#fff;padding:0 11px;font-size:15px}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.grid .cell:last-child{grid-column:1/-1}}
</style>
<script src="app-config.js?v=20260823-1"></script><script src="i18n-runtime.js?v=20260823-1"></script><script src="language-onboarding.js?v=20260823-1"></script><script src="license-client.js?v=20260823-1"></script><script src="access.js?v=20260823-1"></script><script src="analytics-client.js?v=20260823-1"></script><script src="app-center.js?v=20260823-1"></script></head>
<body>
<main class="app">
<div class="top"><button class="btn" id="settingsBtn">⚙️</button><h1>LUCKYJET <span style="color:#60a5fa">DIRECT</span></h1><button class="btn" id="historyBtn">🕘</button></div>
<div class="card"><div class="badge"><span class="dot" id="dot"></span><span id="marketText">Рынок —</span></div><div id="apiState" class="mut" style="margin-top:8px">Ожидание API</div></div>
<div class="card"><b>ПОСЛЕДНИЕ КОЭФФИЦИЕНТЫ</b><div class="live" id="coeffs"><span class="mut">Нет данных</span></div><div class="mut" id="source" style="margin-top:8px">Прямой запрос: allpredictor.com/api/v1/luckyjet/market</div></div>
<div class="circle"><div class="coef" id="prediction">0.00X</div></div>
<div class="grid"><div class="cell"><div class="lab">ВХОД</div><div class="val" id="betTime">--:--</div></div><div class="cell"><div class="lab">РАУНД</div><div class="val" id="round">0/3</div></div><div class="cell"><div class="lab">УВЕРЕННОСТЬ</div><div class="val" id="confidence">—</div></div></div>
<div class="grid"><div class="cell"><div class="lab">✅ УСПЕХ</div><div class="val" id="wins">0</div></div><div class="cell"><div class="lab">❌ НЕУДАЧА</div><div class="val" id="losses">0</div></div><div class="cell"><div class="lab">ВСЕГО</div><div class="val" id="total">0</div></div></div>
<div class="row"><button class="btn" id="manualBtn">ПОЛУЧИТЬ ПРОГНОЗ</button><button class="btn" id="autoBtn">АВТО: ВЫКЛ</button></div>
<div class="status" id="status"></div>
</main>
<div class="modal" id="settings"><div class="panel"><h2>Настройки</h2><div class="field"><input id="apiKey" placeholder="ap_..."></div><div class="row" style="margin-top:12px"><button class="btn" id="saveBtn">СОХРАНИТЬ</button><button class="btn" id="testBtn">ПРОВЕРИТЬ API</button><button class="btn" id="closeSettings">ЗАКРЫТЬ</button></div><div class="status" id="testStatus"></div><p class="mut">Ключ хранится только в localStorage браузера.</p></div></div>
<div class="modal" id="history"><div class="panel"><h2>История</h2><div id="historyList" class="mut">Пока пусто</div><div class="row" style="margin-top:12px"><button class="btn" id="clearHistory">ОЧИСТИТЬ</button><button class="btn" id="closeHistory">ЗАКРЫТЬ</button></div></div></div>
<script>
'use strict';
const BASE='https://allpredictor.com/api/v1',K='lj_ap_key',H='lj_hist',S='lj_stats';
const $=id=>document.getElementById(id);const get=(k,d)=>{try{return localStorage.getItem(k)??d}catch{return d}},set=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
let key=get(K,''),hist=JSON.parse(get(H,'[]')),stats=JSON.parse(get(S,'{"w":0,"l":0}')),auto=false,timer=null,last=[];
function headers(){return{'X-API-Key':key,'Accept':'application/json'}}
function num(v){const n=Number(v);return Number.isFinite(n)?n:null}
function fmt(){return new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function setStatus(t,c=''){status.className='status '+c;status.textContent=t}
async function request(path){const c=new AbortController(),tm=setTimeout(()=>c.abort(),9000);try{const r=await fetch(BASE+path,{method:'GET',headers:headers(),mode:'cors',credentials:'omit',cache:'no-store',signal:c.signal});const text=await r.text();let d;try{d=JSON.parse(text)}catch{d={raw:text}}if(!r.ok){const e=new Error(d.message||d.error||('HTTP '+r.status));e.status=r.status;throw e}return d}catch(e){if(e.name==='TypeError')throw new Error('CORS/Load failed');throw e}finally{clearTimeout(tm)}}
function coeffsFrom(o){const out=[],seen=new Set();function w(v,k=''){if(v==null||out.length>=30)return;if(Array.isArray(v)){v.forEach(x=>w(x,k));return}if(typeof v==='object'){Object.entries(v).forEach(([a,b])=>w(b,a));return}const n=Number(v),kk=String(k).toLowerCase();if(Number.isFinite(n)&&n>=1&&n<10000&&(kk.includes('coef')||kk.includes('multiplier')||kk.includes('odd'))){const q=+n.toFixed(2);if(!seen.has(q)){seen.add(q);out.push(q)}}}w(o);return out}
function marketInfo(d){const x=d.data&&typeof d.data==='object'?d.data:d;let level=String(x.level||x.market_level||x.status||'warn').toLowerCase();if(!['safe','warn','danger'].includes(level))level='warn';return{level,coefs:coeffsFrom(d)}}
function predInfo(d){const x=d.data&&typeof d.data==='object'?{...d,...d.data}:d;return{target:num(x.predicted_coef??x.prediction??x.coef??x.target),confidence:num(x.confidence??x.confidence_percent??x.market_score),signal:x.signal||x.action||''}}
function renderStats(){wins.textContent=stats.w||0;losses.textContent=stats.l||0;total.textContent=(stats.w||0)+(stats.l||0)}
function renderMarket(m){dot.className='dot '+m.level;marketText.textContent=m.level==='safe'?'Рынок благоприятный':m.level==='danger'?'Рынок опасный':'Рынок умеренный';coeffs.innerHTML='';if(m.coefs.length)m.coefs.slice(0,20).forEach(x=>{const s=document.createElement('span');s.className='chip';s.textContent=x.toFixed(2)+'x';coeffs.appendChild(s)});else coeffs.innerHTML='<span class="mut">В /market коэффициенты не найдены</span>'}
async function poll(){if(!key)return;try{const d=await request('/luckyjet/market');const m=marketInfo(d);renderMarket(m);apiState.textContent='MARKET OK';apiState.className='mut oktxt';last=m.coefs.slice()}catch(e){apiState.textContent=e.message;apiState.className='mut badtxt'}}
async function predict(){if(!key){setStatus('Открой ⚙️ и сохрани ap_ ключ','badtxt');return}manualBtn.disabled=true;setStatus('Получаю прогноз…');try{const md=await request('/luckyjet/market');const m=marketInfo(md);renderMarket(m);if(m.level==='danger'){setStatus('⛔ Рынок опасный — прогноз отменён','badtxt');return}const d=await request('/luckyjet/predict');const p=predInfo(d);if(p.target==null)throw new Error('В /predict нет predicted_coef');prediction.textContent=p.target.toFixed(2)+'X';confidence.textContent=p.confidence==null?'—':Math.round(p.confidence)+'%';betTime.textContent=fmt();setStatus('🎯 '+p.target.toFixed(2)+'x'+(p.signal?' • '+String(p.signal).toUpperCase():''),'oktxt');hist.unshift({coef:p.target,time:Date.now(),conf:p.confidence});hist=hist.slice(0,100);set(H,JSON.stringify(hist));renderHist()}catch(e){setStatus('Ошибка /predict: '+e.message,'badtxt')}finally{manualBtn.disabled=false}}
async function testApi(){testStatus.textContent='Проверяю…';const out=[];try{const m=marketInfo(await request('/luckyjet/market'));out.push('MARKET OK'+(m.coefs.length?' • кефов '+m.coefs.length:''))}catch(e){out.push('MARKET: '+e.message)}try{const p=predInfo(await request('/luckyjet/predict'));out.push(p.target==null?'PREDICT: нет predicted_coef':'PREDICT OK • '+p.target.toFixed(2)+'x')}catch(e){out.push('PREDICT: '+e.message)}testStatus.textContent=out.join(' | ')}
function renderHist(){historyList.innerHTML=hist.length?hist.slice(0,30).map(x=>`<div style="padding:7px 0;border-bottom:1px solid #31517f">${Number(x.coef).toFixed(2)}x • ${new Date(x.time).toLocaleString('ru-RU')} • ${x.conf==null?'—':Math.round(x.conf)+'%'}</div>`).join(''):'Пока пусто'}
settingsBtn.onclick=()=>{apiKey.value=key;settings.classList.add('open')};closeSettings.onclick=()=>settings.classList.remove('open');historyBtn.onclick=()=>{renderHist();history.classList.add('open')};closeHistory.onclick=()=>history.classList.remove('open');saveBtn.onclick=()=>{const v=apiKey.value.trim();if(!v.startsWith('ap_')){testStatus.textContent='Ключ должен начинаться с ap_';return}key=v;set(K,v);testStatus.textContent='Сохранено';poll()};testBtn.onclick=testApi;manualBtn.onclick=predict;autoBtn.onclick=()=>{auto=!auto;autoBtn.textContent='АВТО: '+(auto?'ВКЛ':'ВЫКЛ');clearInterval(timer);if(auto){predict();timer=setInterval(predict,15000)}};clearHistory.onclick=()=>{hist=[];set(H,'[]');renderHist()};renderStats();renderHist();if(key){poll();setInterval(poll,5000)}else setStatus('Открой ⚙️ и вставь ap_ ключ');
</script>
</body></html>
