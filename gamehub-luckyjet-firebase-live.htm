<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LuckyJet PRO — Firebase LIVE</title>
<style>
html,body{margin:0;min-height:100%;background:#0b0610;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center}.box{max-width:420px}.spin{width:40px;height:40px;border:4px solid #3b2350;border-top-color:#9b4dff;border-radius:50%;margin:0 auto 18px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}#msg{color:#ddd;font-size:16px}
</style>
</head>
<body>
<div class="wrap"><div class="box"><div class="spin"></div><div id="msg">Загрузка LuckyJet PRO…</div></div></div>
<script>
(async()=>{
 const msg=document.getElementById('msg');
 try{
  const urls=['gamehub-firebase-live-safe/part0.b64','gamehub-firebase-live-safe/part1.b64','gamehub-firebase-live-safe/part2.b64'];
  const parts=[];
  for(const u of urls){
   const r=await fetch(u+'?v=20260818-2146',{cache:'no-store'});
   if(!r.ok) throw new Error('HTTP '+r.status+' '+u);
   parts.push((await r.text()).trim());
  }
  const b64=parts.join('');
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  if(typeof DecompressionStream==='undefined') throw new Error('Браузер не поддерживает распаковку страницы');
  const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open();document.write(html);document.close();
 }catch(e){console.error(e);msg.innerHTML='Не удалось загрузить страницу.<br><small>'+String(e.message||e)+'</small>'}
})();
</script>
</body>
</html>
