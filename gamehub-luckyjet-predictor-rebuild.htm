<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08050d">
<title>LuckyJet Predictor — GameHub Rebuild</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08050d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#130b1b;border:1px solid #2c1d38;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px #0008}.head{padding:20px;background:linear-gradient(135deg,#3b1456,#15154e)}h1{margin:3px 0 6px;font-size:26px}.sub,.small{color:#aaa;font-size:13px}.body{padding:17px}.status,.panel,.signal{border:1px solid #30213f;background:#0d0912;border-radius:16px;padding:14px;margin-bottom:13px}.ok{border-color:#23593f}.bad{border-color:#6f2937}.row{display:flex;gap:12px;justify-content:space-between;align-items:center}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;background:#e7b82e}.ok .dot{background:#36d27f}.bad .dot{background:#ff5269}.big{font-size:30px;font-weight:900}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.chip{padding:7px 10px;border-radius:11px;background:#25152f;font-weight:800}.x2{background:#2f1b4c}.x5{background:#46311c}.x10{background:#4d1824;color:#ffd3dc}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:14px;padding:13px;font-weight:800;color:#fff;background:#6d28d9}.btn.alt{background:#24172f;border:1px solid #3c294b}.btn.red{background:#3c151b;border:1px solid #702731}.signal{text-align:center;min-height:140px}.sigmain{font-size:30px;font-weight:900;margin:8px 0}.meta{color:#bbb;font-size:14px;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0d0912;border:1px solid #30213f;border-radius:14px;padding:11px;text-align:center}.stat b{display:block;font-size:21px;margin-top:4px}.note{color:#777;font-size:11px;text-align:center;margin-top:12px}@media(max-width:520px){.grid{grid-template-columns:1fr}.row.mobile{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><div class="wrap"><div class="card"><div class="head"><div class="sub">GameHub rebuild</div><h1>🚀 LuckyJet Predictor PRO</h1><div class="sub">Автосбор 5 коэффициентов · прогноз · проверка до 3 раундов</div></div><div class="body"><div id="apiBox" class="status"><span class="dot"></span><b>API:</b> <span id="apiText">подключение…</span></div><div class="signal"><div class="small">ТЕКУЩИЙ ПРОГНОЗ</div><div id="pred" class="sigmain">СБОР ДАННЫХ…</div><div id="predMeta" class="meta">Нужно 5 новых завершённых коэффициентов.</div></div><div class="stats"><div class="stat">✅ Успех<b id="w">0</b></div><div class="stat">❌ Ошибка<b id="l">0</b></div><div class="stat">⏳ Проверок<b id="t">0</b></div></div><div class="panel"><div class="small">Собранные коэффициенты</div><div id="chips" class="chips"></div></div><div class="grid"><button class="btn alt" onclick="resetSession()">Сбросить session-id</button><button class="btn red" onclick="resetStats()">Сбросить статистику</button></div><div class="note">Статистический расчёт не гарантирует будущий результат.</div></div></div></div>
<script>
const API_STATE="https://crash-gateway-grm-cr.100hp.app/state";const CUSTOMER_ID="077dee8d-c923-4c02-9bee-757573662e69";function sessionId(){let s=localStorage.getItem("LJ_SESSION_ID")||"";if(!s){s=(prompt("Введите LuckyJet session-id:")||"").trim();if(s)localStorage.setItem("LJ_SESSION_ID",s)}return s}function setStatus(text,ok){const b=document.getElementById("apiBox");b.className="status "+(ok?"ok":"bad");document.getElementById("apiText").textContent=text}async function getState(){const sid=sessionId();if(!sid)throw new Error("session-id не указан");const r=await fetch(API_STATE,{headers:{"customer-id":CUSTOMER_ID,"session-id":sid,"accept":"application/json"},cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}function normalizeCoef(v){v=Number(v);if(!Number.isFinite(v)||v<=0)return null;if(v===1)v=1.01;return Math.round(v*100)/100}
let batch=[],lastCoef=null,pending=null,wins=+(localStorage.LJP_W||0),losses=+(localStorage.LJP_L||0);function stats(){w.textContent=wins;l.textContent=losses;t.textContent=wins+losses}function render(){chips.innerHTML=batch.map(x=>`<span class="chip ${x>=10?'x10':x>=2?'x2':''}">${x.toFixed(2)}X</span>`).join("")}function calc(a){const s=[...a].sort((x,y)=>x-y),trimmed=s.length>=5?s.slice(1,-1):s,mean=trimmed.reduce((x,y)=>x+y,0)/trimmed.length;let ema=trimmed[0];for(let i=1;i<trimmed.length;i++)ema=trimmed[i]*.25+ema*.75;const variance=trimmed.reduce((z,x)=>z+(x-mean)**2,0)/trimmed.length,vol=Math.sqrt(variance);let raw=ema*.6+mean*.3+trimmed.at(-1)*.1;raw*=1+Math.max(.05,1-Math.min(1,vol/3))*.08;const margin=raw<2?.15:raw<3?.25:.35,target=Math.max(1.2,Math.min(8,raw*(1-margin))),confidence=Math.max(20,Math.min(92,Math.round((1-Math.min(1,vol/3))*100)));return{target:Math.round(target*100)/100,confidence}}function newPrediction(){const p=calc(batch);pred.textContent=`🎯 ${p.target.toFixed(2)}X`;predMeta.textContent=`Уверенность ${p.confidence}% · проверка в следующих 3 раундах`;pending={target:p.target,left:3};batch=[];render()}function check(c){if(!pending)return;if(c>=pending.target){wins++;localStorage.LJP_W=wins;pending=null;predMeta.textContent=`✅ ЗАШЛО · выпало ${c.toFixed(2)}X`;stats();return}pending.left--;if(pending.left<=0){losses++;localStorage.LJP_L=losses;pending=null;predMeta.textContent=`❌ НЕ ЗАШЛО за 3 раунда`;stats()}}async function tick(){try{const d=await getState(),arr=Array.isArray(d.stopCoefficients)?d.stopCoefficients:[],c=arr.length?normalizeCoef(arr[0]):null;if(c&&c!==lastCoef){lastCoef=c;check(c);batch.push(c);render();if(batch.length>=5&&!pending)newPrediction()}setStatus("подключено · /state",true)}catch(e){setStatus(e.message,false)}setTimeout(tick,1500)}window.resetSession=()=>{localStorage.removeItem("LJ_SESSION_ID");location.reload()};window.resetStats=()=>{wins=losses=0;localStorage.removeItem("LJP_W");localStorage.removeItem("LJP_L");stats()};stats();tick();
</script></body></html>
