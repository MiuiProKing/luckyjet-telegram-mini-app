<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08050d"><title>LuckyJet Montante — GameHub Rebuild</title><style>*{box-sizing:border-box}body{margin:0;background:#08050d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#130b1b;border:1px solid #2c1d38;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px #0008}.head{padding:20px;background:linear-gradient(135deg,#3b1456,#15154e)}h1{margin:3px 0 6px;font-size:26px}.sub,.small{color:#aaa;font-size:13px}.body{padding:17px}.status,.panel,.signal{border:1px solid #30213f;background:#0d0912;border-radius:16px;padding:14px;margin-bottom:13px}.ok{border-color:#23593f}.bad{border-color:#6f2937}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;background:#e7b82e}.ok .dot{background:#36d27f}.bad .dot{background:#ff5269}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.chip{padding:7px 10px;border-radius:11px;background:#25152f;font-weight:800}.x2{background:#2f1b4c}.signal{text-align:center;min-height:140px}.sigmain{font-size:30px;font-weight:900;margin:8px 0}.meta{color:#bbb;font-size:14px;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0d0912;border:1px solid #30213f;border-radius:14px;padding:11px;text-align:center}.stat b{display:block;font-size:21px;margin-top:4px}.btn{width:100%;border:0;border-radius:14px;padding:13px;font-weight:800;color:#fff;background:#24172f;border:1px solid #3c294b}.note{color:#777;font-size:11px;text-align:center;margin-top:12px}</style></head><body><div class="wrap"><div class="card"><div class="head"><div class="sub">GameHub rebuild</div><h1>⚡ LuckyJet Montante</h1><div class="sub">Фокус на небольших целях 1.20X–1.50X</div></div><div class="body"><div id="apiBox" class="status"><span class="dot"></span><b>API:</b> <span id="apiText">подключение…</span></div><div class="signal"><div class="small">СИГНАЛ MONTANTE</div><div id="sig" class="sigmain">АНАЛИЗ…</div><div id="meta" class="meta">Собираю последние раунды.</div></div><div class="panel"><div class="small">Последние коэффициенты</div><div id="chips" class="chips"></div></div><div class="stats"><div class="stat">✅ Зашло<b id="w">0</b></div><div class="stat">❌ Нет<b id="l">0</b></div><div class="stat">📊 Всего<b id="t">0</b></div></div><button class="btn" onclick="resetSession()">Сбросить session-id</button><div class="note">Низкая цель снижает порог, но не делает результат гарантированным.</div></div></div></div><script>const API_STATE="https://crash-gateway-grm-cr.100hp.app/state",CUSTOMER_ID="077dee8d-c923-4c02-9bee-757573662e69";function sessionId(){let s=localStorage.getItem("LJ_SESSION_ID")||"";if(!s){s=(prompt("Введите LuckyJet session-id:")||"").trim();if(s)localStorage.setItem("LJ_SESSION_ID",s)}return s}function setStatus(text,ok){const b=document.getElementById("apiBox");b.className="status "+(ok?"ok":"bad");document.getElementById("apiText").textContent=text}async function getState(){const sid=sessionId();if(!sid)throw new Error("session-id не указан");const r=await fetch(API_STATE,{headers:{"customer-id":CUSTOMER_ID,"session-id":sid,"accept":"application/json"},cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}function normalizeCoef(v){v=Number(v);if(!Number.isFinite(v)||v<=0)return null;if(v===1)v=1.01;return Math.round(v*100)/100}let hist=[],lastCoef=null,pending=null,wins=+(localStorage.LJM_W||0),losses=+(localStorage.LJM_L||0);function stats(){w.textContent=wins;l.textContent=losses;t.textContent=wins+losses}function render(){chips.innerHTML=hist.slice(0,12).map(x=>`<span class="chip ${x>=2?'x2':''}">${x.toFixed(2)}X</span>`).join("")}function decide(){if(hist.length<6){sig.textContent="СБОР…";meta.textContent=`${hist.length}/6`;return}const a=hist.slice(0,6),low=a.filter(x=>x<1.5).length,avg=a.reduce((s,x)=>s+Math.min(x,4),0)/6;let score=45+low*7+(avg<1.8?10:0)-(a.filter(x=>x>=5).length*10);score=Math.max(20,Math.min(90,Math.round(score)));if(score<58){sig.textContent="⏸ ПРОПУСК";meta.textContent=`Оценка ${score}/100`;return}const target=score>=75?1.50:1.30;sig.textContent=`⚡ ЦЕЛЬ ${target.toFixed(2)}X`;meta.textContent=`Оценка ${score}/100 · следующий новый раунд`;pending={target}}function check(c){if(!pending)return;if(c>=pending.target)wins++;else losses++;localStorage.LJM_W=wins;localStorage.LJM_L=losses;pending=null;stats()}async function tick(){try{const d=await getState(),arr=Array.isArray(d.stopCoefficients)?d.stopCoefficients:[],c=arr.length?normalizeCoef(arr[0]):null;if(c&&c!==lastCoef){lastCoef=c;check(c);hist.unshift(c);hist=hist.slice(0,30);render();decide()}setStatus("подключено · /state",true)}catch(e){setStatus(e.message,false)}setTimeout(tick,1500)}window.resetSession=()=>{localStorage.removeItem("LJ_SESSION_ID");location.reload()};stats();tick();</script></body></html>
