<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GameHub - Бот LuckyJet</title>
<style>html,body{margin:0;background:#141414;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%}.load{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}.box{max-width:420px}.spin{width:38px;height:38px;border:4px solid #44205d;border-top-color:#8a00e1;border-radius:50%;margin:0 auto 18px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}#msg{font-size:16px;color:#ddd}</style>
<script src="app-config.js?v=20260724-32"></script><script src="i18n-runtime.js?v=20260724-32"></script><script src="language-onboarding.js?v=20260724-32"></script><script src="license-client.js?v=20260724-32"></script><script src="access.js?v=20260724-32"></script><script src="analytics-client.js?v=20260724-32"></script><script src="app-center.js?v=20260724-32"></script></head>
<body>
<div class="load"><div class="box"><div class="spin"></div><div id="msg">Загрузка GameHub LuckyJet…</div></div></div>
<script>
(async()=>{
 const msg=document.getElementById('msg');
 try{
  const urls=['.gamehub-live/part0.b64','.gamehub-live/part1.b64'];
  const parts=await Promise.all(urls.map(async u=>{const r=await fetch(u+'?v=2f823586',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status+' '+u);return (await r.text()).trim()}));
  const b64=parts.join('');
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  if(typeof DecompressionStream==='undefined')throw new Error('Браузер не поддерживает распаковку страницы');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
 }catch(e){console.error(e);msg.innerHTML='Не удалось загрузить страницу.<br><small>'+String(e.message||e)+'</small>'}
})();
</script>
</body>
</html>
