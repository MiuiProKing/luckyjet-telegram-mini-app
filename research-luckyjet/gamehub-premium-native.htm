<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Predicteur Pro Premium</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 30%,#1e293b,#0f172a 68%);color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial}.wrap{max-width:860px;margin:auto;padding:16px}.hero{padding:18px;border:1px solid #334155;border-radius:18px;background:linear-gradient(135deg,rgba(59,130,246,.24),rgba(14,165,233,.08));box-shadow:0 18px 45px rgba(0,0,0,.25)}.sub{color:#93c5fd;font-size:13px}.api{display:inline-block;margin-top:8px;background:#10233f;border:1px solid #2563eb;padding:7px 10px;border-radius:999px;font-size:13px}.signal{margin-top:14px;text-align:center;background:#111c2f;border:1px solid #334155;border-radius:18px;padding:24px}.big{font-size:38px;font-weight:900;color:#60a5fa;margin:9px 0}.meta{color:#cbd5e1}.panel{margin-top:14px;background:#162235;border:1px solid #334155;border-radius:16px;padding:14px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#1e3a5f;border:1px solid #315a88;color:#dbeafe;padding:7px 9px;border-radius:999px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.stat{background:#172033;border-radius:13px;padding:12px;text-align:center;border:1px solid #2a3b55}.stat b{display:block;font-size:24px}.verify{min-height:40px;color:#e2e8f0}.btn{width:100%;padding:12px;margin-top:12px;border-radius:12px;border:1px solid #3b82f6;background:#172c4e;color:#fff;font-weight:800}</style></head><body data-engine="gamehub-premium"><div class="wrap"><header class="hero"><div class="sub">GameHub · Version Premium</div><h1 style="margin:5px 0">🤖 Predicteur Pro</h1><div>Профессиональный Premium-режим</div><div id="api" class="api">LIVE проверка…</div><div id="engine" style="display:none"></div></header><section class="signal"><div style="font-size:12px;letter-spacing:.15em;color:#93c5fd">PREMIUM SIGNAL</div><div id="sig" class="big">СБОР ДАННЫХ…</div><div id="meta" class="meta">Анализ истории</div></section><div class="stats"><div class="stat">✅ WIN<b id="wins">0</b></div><div class="stat">❌ LOSS<b id="losses">0</b></div><div class="stat">📊 TOTAL<b id="total">0</b></div></div><div class="panel"><b>Последние коэффициенты</b><div id="chips" class="chips" style="margin-top:10px"></div></div><div class="panel"><b>Проверка Premium</b><div id="verify" class="verify" style="margin-top:8px">Ещё нет результата.</div></div><button id="reset" class="btn">Сбросить session-id</button></div><script src="live-core.js"></script></body></html>
