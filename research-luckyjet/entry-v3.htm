<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LuckyJet Entry V3</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#fff}button,input{font:inherit}button{cursor:pointer}body.magic{background:linear-gradient(to top,#4f0070,#2a003f)}body.astra{background:#050912}.app{min-height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}.app:before{content:"";position:absolute;top:-4vh;left:50%;transform:translateX(-50%);width:150vw;height:52vh;background:linear-gradient(180deg,#4a0e67,#2a003f);border-radius:0 0 100% 100%/0 0 120px 120px;box-shadow:0 10px 30px #0005}.head{z-index:2;padding:18px 14px;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:26px;font-weight:900;line-height:.95}.brand small{display:block;font-size:10px;letter-spacing:1.5px;color:#ff79d9;margin-top:8px}.status{padding:10px 12px;border:1px solid #ffffff28;background:#0003;border-radius:999px;font-size:11px;font-weight:800;max-width:48vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px 14px 14px}.circle{width:205px;height:205px;border-radius:50%;display:grid;place-items:center;position:relative;background:#3a112f;border:5px solid #1e0c18;box-shadow:0 0 45px #ec489933,0 15px 30px #0008}.circle:before{content:"";position:absolute;inset:10px;border-radius:50%;border:3px solid transparent;border-top-color:#f15bb5;border-bottom-color:#f15bb5;animation:spin 3s linear infinite}.circle:after{content:"";position:absolute;inset:13px;border-radius:50%;border:2px solid #f15bb544}@keyframes spin{to{transform:rotate(360deg)}}#value{font-size:49px;font-weight:900;z-index:2}.meta{min-height:40px;text-align:center;font-size:12px;opacity:.82;max-width:370px;margin:11px auto 5px;line-height:1.4}.modes{width:min(370px,94vw);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mode{padding:11px 4px;border-radius:13px;border:1px solid #ffffff25;background:#0003;color:#fff;font-weight:900}.mode.active{border-color:#ff9ee8;background:#ffffff16}.go{width:min(370px,94vw);margin-top:10px;padding:15px;border:0;border-radius:14px;background:linear-gradient(90deg,#d92fc7,#ae47ff);color:#fff;font-size:19px;font-weight:900;box-shadow:0 9px 20px #0006}.go:disabled{opacity:.5}.entry{width:min(370px,94vw);margin:10px auto 0;border-radius:15px;padding:12px;border:1px solid #ffffff24;background:#0505107d;text-align:center}.entry.wait{border-color:#ffc85777;background:#5b3b071f}.entry.enter{border-color:#39ff8877;background:#0a542428;box-shadow:0 0 25px #22ff7740}.entry.enter .et{color:#62ff9d;animation:pulse 1s ease-in-out infinite}.entry.entered{border-color:#52b9ff77;background:#082f552c}.entry.win{border-color:#4dff8d99;background:#0a5c2c38}.entry.loss{border-color:#ff657999;background:#631b2638}.entry.expired{border-color:#ffb84d88;background:#5c35072e}@keyframes pulse{50%{transform:scale(1.035);text-shadow:0 0 16px #55ff99}}.et{font-size:20px;font-weight:1000}.es{font-size:12px;line-height:1.4;margin-top:6px;color:#ddd}.ea{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.ea.show{display:grid}.ea button{padding:11px;border-radius:11px;border:1px solid #ffffff24;background:#ffffff0c;color:#fff;font-weight:900}.ea .in{background:linear-gradient(90deg,#12ad57,#27d978);border:0}.ea .skip{background:#79203188}.note{font-size:10px;color:#bbb;margin-top:7px;line-height:1.35}.foot{z-index:2;height:68px;border-top:1px solid #ffffff16;background:#0003;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.clock{font-size:30px;font-weight:900}.icons{display:flex;gap:9px}.ico{width:44px;height:44px;border-radius:14px;border:1px solid #ffffff25;background:#ffffff09;color:#fff}.history{position:fixed;z-index:30;right:12px;bottom:78px;width:min(355px,calc(100vw - 24px));background:#210c2fee;border:1px solid #ffffff22;border-radius:18px;padding:14px;display:none}.history.show{display:block}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.chip{padding:6px 8px;border-radius:8px;background:#ffffff11;font-size:12px;font-weight:800}.chip.x10{border:1px solid #ffb84d77}.astra-stars,.astra-bg{position:fixed;inset:0;z-index:-2}.astra-stars{background:radial-gradient(circle at 20% 20%,#fff 0 1px,transparent 1.5px) 0 0/95px 95px,radial-gradient(circle at 70% 65%,#fff8 0 1px,transparent 1.4px) 0 0/130px 130px}.astra-bg{z-index:-1;background:radial-gradient(circle at 50% 75%,#15263e 0,#08111f 42%,#050912 80%)}.astra-head{position:sticky;top:0;z-index:10;padding:16px 5%;display:flex;align-items:center;justify-content:space-between;background:#070b14dd;border-bottom:1px solid #00eaff44}.astra-logo{font-size:24px;font-weight:900;background:linear-gradient(90deg,#09e9ff,#7a5cff,#a500ff);-webkit-background-clip:text;color:transparent}.astra-head button{padding:9px 11px;border:1px solid #00eaff66;border-radius:10px;background:#0005;color:#fff;font-weight:800}.astra-live{max-width:680px;margin:12px auto;padding:10px 14px;border:1px solid #00eaff55;border-radius:12px;background:#06111ecc;font-size:12px}.astra-hero{min-height:45vh;display:grid;place-items:center;text-align:center;padding:50px 18px}.astra-hero h1{font-size:clamp(40px,8vw,74px);line-height:1.08;margin:0;background:linear-gradient(90deg,#0eefff,#367cff,#9a00ff);-webkit-background-clip:text;color:transparent}.astra-hero p{max-width:720px;margin:20px auto;color:#ddd;font-size:18px;line-height:1.5}.astra-hero button{padding:14px 34px;border:0;border-radius:999px;background:linear-gradient(90deg,#17dbf4,#8c18ff);color:#fff;font-weight:900}.astra-pred{max-width:680px;margin:0 auto 60px;padding:18px}.astra-card{background:#07121ddd;border:1px solid #00eaff55;border-radius:22px;padding:18px}.astra-card .circle{margin:18px auto;background:#07121d;border:4px solid transparent;background:linear-gradient(#07121d,#07121d) padding-box,linear-gradient(45deg,#00eaff,#8a23ff,#ff9d00) border-box}.astra-card .mode{border-color:#00eaff55}.astra-card .go{width:100%;background:linear-gradient(90deg,#00dff7,#881cff)}.astra-card .entry{width:100%}.mask{position:fixed;z-index:1000;inset:0;background:#000c;display:grid;place-items:center;padding:18px}.box{width:min(430px,100%);background:#111827;border:1px solid #ffffff33;border-radius:18px;padding:18px}.box p{font-size:13px;color:#ccc}.box input{width:100%;padding:13px;border-radius:10px;border:1px solid #ffffff33;background:#0005;color:#fff}.acts{display:flex;gap:8px;margin-top:12px}.acts button{flex:1;padding:12px;border-radius:10px;border:1px solid #ffffff22;background:#ffffff0b;color:#fff;font-weight:800}.acts button:last-child{background:linear-gradient(90deg,#00dff7,#881cff)}@media(max-height:760px){.circle{width:175px;height:175px}#value{font-size:42px}.entry{padding:9px}.et{font-size:18px}}</style></head><body><div id="root"></div><script>const API='https://crash-gateway-grm-cr.100hp.app/history',CID='077dee8d-c923-4c02-9bee-757573662e69',SID='LJ_SESSION_ID',PK='LJ_ENTRY_PLAN_V3';let cache=[];const mean=(a,d=0)=>a.length?a.reduce((s,x)=>s+x,0)/a.length:d,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));function sd(a){if(a.length<2)return 0;const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))}function med(a,d=0){if(!a.length)return d;const s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2}function sid(){return(localStorage.getItem(SID)||'').trim()}function setSid(v){v=(v||'').trim();v?localStorage.setItem(SID,v):localStorage.removeItem(SID)}function norm(x){if(!x||typeof x!=='object')return null;let c=Number(x.topCoefficient);if(!Number.isFinite(c)||c<=0){const a=Array.isArray(x.finalValues)?x.finalValues.map(Number).filter(v=>Number.isFinite(v)&&v>0):[];if(a.length)c=a[a.length-1]}if(!Number.isFinite(c)||c<=0)return null;if(c===1)c=1.01;return{id:String(x.id||x.roundId||x.round_id||x.hash||`${c}:${x.createdAt||x.time||''}`),c:Math.round(c*100)/100}}async function fetchRows(){const s=sid();if(!s)throw Error('SESSION_REQUIRED');const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),10000);try{const r=await fetch(API,{headers:{'customer-id':CID,'session-id':s,accept:'application/json'},cache:'no-store',signal:ctl.signal});if(!r.ok)throw Error('HTTP_'+r.status);const d=await r.json();if(!Array.isArray(d))throw Error('BAD_FORMAT');const o=[],seen=new Set();for(const x of d){const z=norm(x);if(!z||seen.has(z.id))continue;seen.add(z.id);o.push(z);if(o.length>=300)break}if(!o.length)throw Error('EMPTY_HISTORY');cache=o;return o}catch(e){if(e.name==='AbortError')throw Error('TIMEOUT');if(e instanceof TypeError)throw Error('NETWORK_OR_CORS');throw e}finally{clearTimeout(tm)}}function predict(rows,mode){const a=rows.map(r=>r.c);if(a.length<20)return{ready:false,score:0,target:0,wait:0,why:`Сбор ${a.length}/20`};const clip=a.slice(0,30).map(x=>Math.min(x,20)),avg=mean(clip,1),vol=sd(clip)/Math.max(avg,1),p=[];a.forEach((x,i)=>{if(x>=10)p.push(i)});const g=[];for(let i=1;i<p.length;i++)g.push(p[i]-p[i-1]);const gap=p.length?p[0]:a.length,mg=med(g,12),low=a.slice(0,10).filter(x=>x<2).length;if(mode==='premium'){let score=42+Math.min(30,(gap/Math.max(mg,1))*18)+low*2+(1-clamp(vol,0,1))*14;if(gap<=2)score-=22;score=Math.round(clamp(score,10,94));const vals=a.filter(x=>x>=10).sort((x,y)=>x-y),target=vals.length?clamp(vals[Math.floor((vals.length-1)*.2)],10,15):10;return{ready:score>=62,score,target:+target.toFixed(2),wait:score>=78?1:2,why:`gap10 ${gap}/${mg.toFixed(1)} · vol ${vol.toFixed(2)}`}}if(mode==='montante'){const vals=a.filter(x=>x>=1.2&&x<=1.5).slice(0,40),score=Math.round(clamp(50+low*4+(1-clamp(vol,0,1))*12,20,92)),target=clamp(mean(vals,1.33),1.2,1.5);return{ready:score>=56,score,target:+target.toFixed(2),wait:1,why:`low10 ${low} · n ${vals.length}`}}const r=mean(a.slice(0,10).map(x=>Math.min(x,12)),1),o=mean(a.slice(10,20).map(x=>Math.min(x,12)),1),mom=(r-o)/Math.max(o,1),raw=avg*.68+(a[0]||1)*.32,target=clamp(raw*(raw<2?.82:raw<3?.74:.64)*(1+clamp(mom,-.3,.3)*.08),1.35,4.5),score=Math.round(clamp(56+(1-clamp(vol/1.5,0,1))*22+clamp(mom*8,-4,4),20,94));return{ready:score>=57,score,target:+target.toFixed(2),wait:score>=72?1:2,why:`vol ${vol.toFixed(2)} · momentum ${mom>=0?'+':''}${mom.toFixed(2)}`}}function load(){try{return JSON.parse(localStorage.getItem(PK)||'null')}catch{return null}}function save(p){p?localStorage.setItem(PK,JSON.stringify(p)):localStorage.removeItem(PK)}function err(c){if(c==='SESSION_REQUIRED')return'Нажми Session и вставь session-id';if(c==='NETWORK_OR_CORS')return'Браузер заблокировал LIVE. Открой GitHub Pages';if(c==='TIMEOUT')return'LIVE API не ответил за 10 секунд';if(c.startsWith('HTTP_'))return'LIVE API ошибка '+c.slice(5);return c}function session(cb){document.getElementById('modal')?.remove();const d=document.createElement('div');d.id='modal';d.innerHTML=`<div class="mask"><div class="box"><h3>LuckyJet Session</h3><p>Вставь актуальный session-id.</p><input id="s" value="${sid().replace(/"/g,'&quot;')}"><div class="acts"><button id="c">Отмена</button><button id="ok">Сохранить</button></div></div></div>`;document.body.appendChild(d);c.onclick=()=>d.remove();ok.onclick=()=>{setSid(s.value);d.remove();cb&&cb()}}</script><script>const qs=new URLSearchParams(location.search),skin=(qs.get('skin')||'magicpro').toLowerCase();let mode='standard',rows=[],plan=load(),last=null,busy=false,$=id=>document.getElementById(id);function modes(){return`<div class="modes"><button class="mode active" data-mode="standard">STANDARD</button><button class="mode" data-mode="premium">10X+</button><button class="mode" data-mode="montante">MONTANTE</button></div>`}function eb(){return`<div id="entry" class="entry"><div id="et" class="et">Сначала получи сигнал</div><div id="es" class="es">Покажу сколько раундов ждать и когда входить.</div><div id="ea" class="ea"><button id="in" class="in">✅ Я ВОШЁЛ</button><button id="skip" class="skip">ПРОПУСТИТЬ</button></div><div class="note">Если приём ставок уже закрыт — не входи.</div></div>`}function render(){if(skin==='astra'){document.body.className='astra';root.innerHTML=`<div class="astra-stars"></div><div class="astra-bg"></div><header class="astra-head"><div class="astra-logo">Predictor Lucky Jet</div><button id="sidBtn">Session</button></header><div id="status" class="astra-live">📡 LIVE подключение…</div><section class="astra-hero"><div><h1>VIP ПРОГНОЗЫ<br>ДЛЯ LUCKY JET</h1><p>Теперь с точным отсчётом новых ID раундов до входа.</p><button onclick="pred.scrollIntoView({behavior:'smooth'})">ОТКРЫТЬ PREDICTOR</button></div></section><section id="pred" class="astra-pred"><div class="astra-card"><div class="circle"><div id="value">?.??X</div></div><div id="meta" class="meta">Выбери режим и получи сигнал.</div>${modes()}<button id="go" class="go">ПОЛУЧИТЬ СИГНАЛ</button>${eb()}<div id="chips" class="chips"></div></div></section>`}else{document.body.className='magic';const cl=skin==='classic';root.innerHTML=`<div class="app"><header class="head"><div class="brand">${cl?'Rocket Queen':'Lucky Jet'}<br>Predictor<small>${cl?'CLASSIC LIVE':'PRO LIVE'}</small></div><div id="status" class="status">📡 LIVE подключение…</div></header><main class="main"><div class="circle"><div id="value">?.??x</div></div><div id="meta" class="meta">Выбери режим и получи сигнал.</div>${modes()}<button id="go" class="go">ПОЛУЧИТЬ СИГНАЛ</button>${eb()}</main><footer class="foot"><div id="clock" class="clock">--:--</div><div class="icons"><button id="hist" class="ico">☰</button><button id="sidBtn" class="ico">S</button></div></footer></div><div id="history" class="history"><b>Последние коэффициенты</b><div id="chips" class="chips"></div></div>`}wire();ui();tick()}function wire(){document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode});go.onclick=signal;sidBtn.onclick=()=>session(()=>refresh(true));hist?.addEventListener('click',()=>history.classList.toggle('show'));in.onclick=entered;skip.onclick=()=>{if(plan){plan.state='expired';plan.msg='Сигнал пропущен';save(plan);ui()}}}function tick(){if(clock){const d=new Date();clock.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}}setInterval(tick,1000);function chips(){if(!document.getElementById('chips'))return;document.getElementById('chips').innerHTML=cache.slice(0,20).map(r=>`<span class="chip ${r.c>=10?'x10':''}">${r.c.toFixed(2)}X</span>`).join('')}async function refresh(force=false){try{rows=await fetchRows();status.textContent=`✅ LIVE /history · ${rows.length}`;chips();if(!last)last=rows[0]?.id;else if(rows[0]?.id!==last){const fresh=[];for(const r of rows){if(r.id===last)break;fresh.push(r)}if(fresh.length>1&&plan&&['waiting','entry','entered'].includes(plan.state)){plan.state='expired';plan.msg=`Пропущено ${fresh.length} раунда`;save(plan);ui()}else for(const r of [...fresh].reverse())newRound(r);last=rows[0].id}if(force&&!plan)meta.textContent='LIVE подключён. Получи сигнал.'}catch(e){status.textContent='❌ '+err(e.message);if(e.message==='SESSION_REQUIRED'&&force)session(()=>refresh(true))}}async function signal(){if(busy)return;busy=true;go.disabled=true;try{rows=await fetchRows();const r=predict(rows,mode);if(!r.ready){plan=null;save(null);value.textContent='PAUSE';meta.textContent=`ПРОПУСК · score ${r.score}/100 · ${r.why}`;ui();return}plan={mode,target:r.target,score:r.score,state:'waiting',left:r.wait,total:r.wait,anchor:rows[0].id};save(plan);value.textContent=r.target.toFixed(2)+(skin==='astra'?'X':'x');meta.textContent=`ЦЕЛЬ ${r.target.toFixed(2)}X · score ${r.score}/100 · ${r.why}`;ui()}catch(e){value.textContent='ERR';meta.textContent=err(e.message)}finally{busy=false;go.disabled=false}}function newRound(r){if(!plan)return;if(plan.state==='waiting'){plan.left--;if(plan.left<=0){plan.state='entry';plan.msg=`Контрольный раунд ${r.c.toFixed(2)}X завершён. Вход в СЛЕДУЮЩИЙ.`}else plan.msg=`Прошёл ${r.c.toFixed(2)}X. Осталось ждать ${plan.left}.`;save(plan);ui();return}if(plan.state==='entry'){plan.state='expired';plan.msg=`Окно входа прошло: следующий раунд уже завершился ${r.c.toFixed(2)}X`;save(plan);ui();return}if(plan.state==='entered'){plan.state='done';plan.actual=r.c;plan.success=r.c>=plan.target;save(plan);value.textContent=r.c.toFixed(2)+(skin==='astra'?'X':'x');meta.textContent=plan.success?`✅ Цель ${plan.target.toFixed(2)}X достигнута`:`❌ ${r.c.toFixed(2)}X ниже цели ${plan.target.toFixed(2)}X`;ui()}}function entered(){if(!plan||plan.state!=='entry')return;plan.state='entered';plan.msg='Вход подтверждён. Ждём завершение этого раунда.';save(plan);ui()}function ui(){const e=document.getElementById('entry');if(!e)return;e.className='entry';ea.classList.remove('show');if(!plan){et.textContent='Сначала получи сигнал';es.textContent='Покажу сколько раундов ждать и когда входить.';return}if(plan.state==='waiting'){e.classList.add('wait');et.textContent=`🟡 ЖДАТЬ ${plan.left} РАУНД${plan.left===1?'':'А'}`;es.textContent=`Цель ${plan.target.toFixed(2)}X. Сейчас НЕ входить. Считаются только новые ID.`;return}if(plan.state==='entry'){e.classList.add('enter');et.textContent='🟢 ВХОД СЕЙЧАС';es.textContent=`Вход в СЛЕДУЮЩИЙ новый раунд. Цель ${plan.target.toFixed(2)}X. Если ставки уже закрыты — ПРОПУСТИТЬ.`;ea.classList.add('show');return}if(plan.state==='entered'){e.classList.add('entered');et.textContent='🔵 ВХОД ПОДТВЕРЖДЁН';es.textContent=`Ждём завершение текущего раунда. Цель ${plan.target.toFixed(2)}X.`;return}if(plan.state==='done'){e.classList.add(plan.success?'win':'loss');et.textContent=plan.success?'✅ ЦЕЛЬ ДОСТИГНУТА':'❌ ЦЕЛЬ НЕ ДОСТИГНУТА';es.textContent=`Цель ${plan.target.toFixed(2)}X · результат ${Number(plan.actual).toFixed(2)}X. Получи новый прогноз.`;return}e.classList.add('expired');et.textContent='⚠️ СИГНАЛ ПРОПУЩЕН';es.textContent=plan.msg||'Получитe новый прогноз.'}render();refresh(true);setInterval(()=>refresh(false),1500)</script></body></html>
