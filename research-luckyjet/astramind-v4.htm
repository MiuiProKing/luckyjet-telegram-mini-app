<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta http-equiv="cache-control" content="no-cache"><title>LuckyJet AstraMind V4</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#fff}body{background:#050912}.stars,.bg{position:fixed;inset:0;z-index:-2}.stars{background:radial-gradient(circle at 20% 20%,#fff 0 1px,transparent 1.5px) 0 0/95px 95px,radial-gradient(circle at 70% 65%,#fff8 0 1px,transparent 1.4px) 0 0/130px 130px}.bg{z-index:-1;background:radial-gradient(circle at 50% 75%,#15263e 0,#08111f 42%,#050912 80%)}.head{position:sticky;top:0;z-index:10;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;background:#070b14dd;border-bottom:1px solid #00eaff44}.logo{font-size:25px;font-weight:900;background:linear-gradient(90deg,#09e9ff,#7a5cff,#a500ff);-webkit-background-clip:text;color:transparent}.status{max-width:48vw;padding:9px 11px;border:1px solid #00eaff66;border-radius:10px;background:#0005;font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hero{min-height:42vh;display:grid;place-items:center;text-align:center;padding:45px 18px}.hero h1{font-size:clamp(40px,8vw,72px);line-height:1.08;margin:0;background:linear-gradient(90deg,#0eefff,#367cff,#9a00ff);-webkit-background-clip:text;color:transparent}.hero p{max-width:720px;margin:18px auto;color:#ddd;font-size:17px;line-height:1.5}.pred{max-width:680px;margin:0 auto 60px;padding:18px}.card{background:#07121ddd;border:1px solid #00eaff55;border-radius:22px;padding:18px;box-shadow:0 0 38px #00eaff17}.circle{width:205px;height:205px;border-radius:50%;display:grid;place-items:center;margin:16px auto;background:#07121d;border:4px solid transparent;background:linear-gradient(#07121d,#07121d) padding-box,linear-gradient(45deg,#00eaff,#8a23ff,#ff9d00) border-box;position:relative}.circle:after{content:"";position:absolute;inset:11px;border-radius:50%;border:2px dashed #00eaff99;animation:spin 5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#value{font-size:48px;font-weight:900;z-index:2}.meta{text-align:center;min-height:40px;font-size:12px;color:#ccd8e2;line-height:1.4}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.mode{padding:11px 4px;border-radius:12px;border:1px solid #00eaff55;background:#00eaff0b;color:#fff;font-weight:900}.mode.active{border-color:#ff9d00}.go{width:100%;margin-top:10px;padding:15px;border:0;border-radius:14px;background:linear-gradient(90deg,#00dff7,#881cff);color:#fff;font-size:18px;font-weight:900}.entry{margin-top:10px;border-radius:15px;padding:12px;border:1px solid #00eaff44;background:#03111a99;text-align:center}.entry.wait{border-color:#ffc85788}.entry.enter{border-color:#39ff8899;background:#064f2638;box-shadow:0 0 25px #39ff8844}.entry.entered{border-color:#55bfff88}.entry.win{border-color:#45ff8d99;background:#07451e66}.entry.loss{border-color:#ff657999;background:#52132066}.et{font-size:20px;font-weight:1000}.entry.enter .et{color:#66ff9f}.es{font-size:12px;line-height:1.4;color:#ddd;margin-top:6px}.actions{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.actions.show{display:grid}.actions button{padding:11px;border-radius:10px;border:1px solid #ffffff24;background:#ffffff0c;color:#fff;font-weight:900}.actions .in{background:#1ebd62;border:0}.session{margin-top:10px;display:flex;gap:7px}.session input{flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid #00eaff44;background:#0005;color:#fff}.session button{padding:10px 12px;border-radius:10px;border:1px solid #00eaff44;background:#00eaff0c;color:#fff;font-weight:800}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.chip{font-size:11px;background:#00eaff11;border:1px solid #00eaff22;padding:5px 7px;border-radius:7px}</style></head><body><div class="stars"></div><div class="bg"></div><header class="head"><div class="logo">Predictor Lucky Jet</div><div id="status" class="status">📡 Введите Session</div></header><section class="hero"><div><h1>VIP ПРОГНОЗЫ<br>ДЛЯ LUCKY JET</h1><p>AstraMind V4 · LIVE /history · точный отсчёт новых раундов до входа.</p></div></section><section class="pred"><div class="card"><div class="circle"><div id="value">?.??X</div></div><div id="meta" class="meta">Сначала подключи LIVE, потом выбери режим.</div><div class="modes"><button class="mode active" data-mode="standard">STANDARD</button><button class="mode" data-mode="premium">10X+</button><button class="mode" data-mode="montante">MONTANTE</button></div><button id="go" class="go">ПОЛУЧИТЬ СИГНАЛ</button><div id="entry" class="entry"><div id="et" class="et">Сначала получи сигнал</div><div id="es" class="es">Покажу сколько новых раундов ждать и когда входить.</div><div id="actions" class="actions"><button id="entered" class="in">✅ Я ВОШЁЛ</button><button id="skip">ПРОПУСТИТЬ</button></div></div><div class="session"><input id="sid" placeholder="session-id"><button id="save">Сохранить</button></div><div id="chips" class="chips"></div></div></section><script>(function(){var API='https://crash-gateway-grm-cr.100hp.app/history',CID='077dee8d-c923-4c02-9bee-757573662e69',mode='standard',rows=[],last=null,plan=null;function q(i){return document.getElementById(i)}function avg(a,d){if(!a.length)return d||0;var s=0;for(var i=0;i<a.length;i++)s+=a[i];return s/a.length}function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function norm(x){if(!x)return null;var c=Number(x.topCoefficient);if(!(c>0)&&Array.isArray(x.finalValues)){for(var i=x.finalValues.length-1;i>=0;i--){var n=Number(x.finalValues[i]);if(n>0){c=n;break}}}if(!(c>0))return null;if(c===1)c=1.01;return{id:String(x.id||x.roundId||x.round_id||x.hash||c),c:Math.round(c*100)/100}}function fetchRows(){return new Promise(function(ok,bad){var s=(q('sid').value||localStorage.getItem('LJ_SESSION_ID')||'').trim();if(!s){bad(Error('SESSION'));return}var x=new XMLHttpRequest();x.open('GET',API,true);x.timeout=10000;x.setRequestHeader('customer-id',CID);x.setRequestHeader('session-id',s);x.setRequestHeader('accept','application/json');x.onload=function(){if(x.status<200||x.status>=300){bad(Error('HTTP '+x.status));return}try{var d=JSON.parse(x.responseText),o=[],seen={};for(var i=0;i<d.length&&o.length<300;i++){var r=norm(d[i]);if(r&&!seen[r.id]){seen[r.id]=1;o.push(r)}}rows=o;ok(o)}catch(e){bad(e)}};x.onerror=function(){bad(Error('CORS/NETWORK'))};x.ontimeout=function(){bad(Error('TIMEOUT'))};x.send()})}function prediction(){var a=rows.map(function(r){return r.c});if(a.length<20)return null;var base=avg(a.slice(0,20).map(function(v){return Math.min(v,12)}),1),low=a.slice(0,10).filter(function(v){return v<2}).length,target,wait,score;if(mode==='premium'){target=10;wait=2;score=62+Math.min(20,low*2)}else if(mode==='montante'){target=clamp(avg(a.filter(function(v){return v>=1.2&&v<=1.5}).slice(0,30),1.33),1.2,1.5);wait=1;score=58+Math.min(20,low*2)}else{target=clamp(base*.7,1.35,4);score=60+Math.min(20,low);wait=score>=72?1:2}return{target:target,score:score,wait:wait}}function ui(){var e=q('entry'),et=q('et'),es=q('es'),ac=q('actions');e.className='entry';ac.className='actions';if(!plan){et.textContent='Сначала получи сигнал';es.textContent='Покажу сколько новых раундов ждать и когда входить.';return}if(plan.s==='wait'){e.className+=' wait';et.textContent='🟡 ЖДАТЬ '+plan.left+' РАУНД';es.textContent='Цель '+plan.t.toFixed(2)+'X. Сейчас НЕ входить.'}else if(plan.s==='enter'){e.className+=' enter';et.textContent='🟢 ВХОД СЕЙЧАС';es.textContent='Вход в следующий новый раунд. Если ставки закрыты — пропусти.';ac.className='actions show'}else if(plan.s==='entered'){e.className+=' entered';et.textContent='🔵 ВХОД ПОДТВЕРЖДЁН';es.textContent='Ждём завершение текущего раунда.'}else if(plan.s==='win'){e.className+=' win';et.textContent='✅ ЦЕЛЬ ДОСТИГНУТА';es.textContent='Выпало '+plan.a.toFixed(2)+'X'}else if(plan.s==='loss'){e.className+=' loss';et.textContent='❌ ЦЕЛЬ НЕ ДОСТИГНУТА';es.textContent='Выпало '+plan.a.toFixed(2)+'X'}else{et.textContent='⚠️ СИГНАЛ ПРОПУЩЕН';es.textContent='Получите новый прогноз.'}}function process(r){if(!plan)return;if(plan.s==='wait'){plan.left--;if(plan.left<=0)plan.s='enter';ui()}else if(plan.s==='enter'){plan.s='miss';ui()}else if(plan.s==='entered'){plan.a=r.c;plan.s=r.c>=plan.t?'win':'loss';q('value').textContent=r.c.toFixed(2)+'X';ui()}}function refresh(){fetchRows().then(function(d){q('status').textContent='✅ LIVE · '+d.length+' раундов';q('chips').innerHTML=d.slice(0,16).map(function(r){return'<span class="chip">'+r.c.toFixed(2)+'X</span>'}).join('');if(last&&d[0].id!==last){var f=[];for(var i=0;i<d.length;i++){if(d[i].id===last)break;f.push(d[i])}for(i=f.length-1;i>=0;i--)process(f[i])}if(d[0])last=d[0].id}).catch(function(e){q('status').textContent='❌ '+e.message})}q('sid').value=localStorage.getItem('LJ_SESSION_ID')||'';q('save').onclick=function(){localStorage.setItem('LJ_SESSION_ID',(q('sid').value||'').trim());refresh()};document.querySelectorAll('.mode').forEach(function(b){b.onclick=function(){document.querySelectorAll('.mode').forEach(function(x){x.classList.remove('active')});b.classList.add('active');mode=b.getAttribute('data-mode')}});q('go').onclick=function(){fetchRows().then(function(){var p=prediction();if(!p){q('meta').textContent='Недостаточно истории';return}plan={s:'wait',left:p.wait,t:p.target};q('value').textContent=p.target.toFixed(2)+'X';q('meta').textContent='Цель '+p.target.toFixed(2)+'X · score '+p.score+'/100';ui()}).catch(function(e){q('meta').textContent=e.message})};q('entered').onclick=function(){if(plan&&plan.s==='enter'){plan.s='entered';ui()}};q('skip').onclick=function(){if(plan){plan.s='miss';ui()}};refresh();setInterval(refresh,1600)})();</script></body></html>
