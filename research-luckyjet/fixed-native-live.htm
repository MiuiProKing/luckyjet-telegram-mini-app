<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LuckyJet LIVE Fixed</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#fff}button{font:inherit}
body.magic{background:linear-gradient(to top,#4f0070,#2a003f);overflow:hidden}body.astra{background:#050912}
.magic-app{height:100dvh;min-height:640px;display:flex;flex-direction:column;position:relative;overflow:hidden}.magic-app:before{content:"";position:absolute;top:-4vh;left:50%;transform:translateX(-50%);width:150vw;height:52vh;background:linear-gradient(180deg,#4a0e67,#2a003f);border-radius:0 0 100% 100%/0 0 120px 120px;box-shadow:0 10px 30px #0005}
.magic-head{height:110px;z-index:2;padding:18px 14px;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:28px;line-height:.95;font-weight:900;letter-spacing:-1px}.brand small{display:block;font-size:11px;letter-spacing:2px;color:#ff79d9;margin-top:8px}.status{margin-top:2px;padding:11px 14px;border:1px solid #ffffff28;background:#0003;border-radius:999px;font-size:12px;font-weight:800;max-width:49vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.magic-main{z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 16px 22px}.circle{width:214px;height:214px;border-radius:50%;display:grid;place-items:center;position:relative;background:#3a112f;border:5px solid #1e0c18;box-shadow:0 0 45px #ec489933,0 15px 30px #0008}.circle:before{content:"";position:absolute;inset:10px;border-radius:50%;border:3px solid transparent;border-top-color:#f15bb5;border-bottom-color:#f15bb5;animation:spin 3s linear infinite}.circle:after{content:"";position:absolute;inset:13px;border-radius:50%;border:2px solid #f15bb544}@keyframes spin{to{transform:rotate(360deg)}}#value{font-size:52px;font-weight:900;z-index:2;text-shadow:0 3px 5px #0008}
#meta{min-height:45px;text-align:center;font-size:12px;opacity:.8;max-width:360px;margin:16px 0 4px}.modes{width:min(360px,94vw);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mode{padding:12px 4px;border-radius:13px;border:1px solid #ffffff25;background:#0003;color:white;font-weight:900}.mode.active{border-color:#ff9ee8;background:#ffffff16}.go{width:min(360px,94vw);margin-top:12px;padding:17px;border:0;border-radius:14px;background:linear-gradient(90deg,#d92fc7,#ae47ff);color:white;font-size:20px;font-weight:900;box-shadow:0 9px 20px #0006}
.magic-foot{height:78px;z-index:2;border-top:1px solid #ffffff16;background:#0003;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.clock{font-size:34px;font-weight:900;letter-spacing:-2px}.icons{display:flex;gap:10px}.ico{width:47px;height:47px;border-radius:14px;border:1px solid #ffffff25;background:#ffffff09;color:#fff;font-size:19px}.history{position:fixed;z-index:30;right:12px;bottom:86px;width:min(350px,calc(100vw - 24px));background:#210c2fee;border:1px solid #ffffff22;border-radius:18px;padding:14px;display:none;backdrop-filter:blur(18px)}.history.show{display:block}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.chip{padding:6px 8px;border-radius:8px;background:#ffffff11;font-size:12px;font-weight:800}
.astra-bg,.astra-stars{position:fixed;inset:0;z-index:-2}.astra-stars{background:radial-gradient(circle at 20% 20%,#fff 0 1px,transparent 1.5px) 0 0/95px 95px,radial-gradient(circle at 70% 65%,#fff8 0 1px,transparent 1.4px) 0 0/130px 130px}.astra-bg{z-index:-1;background:radial-gradient(circle at 50% 75%,#15263e 0,#08111f 42%,#050912 80%)}.astra-head{position:sticky;top:0;z-index:10;padding:18px 5%;display:flex;align-items:center;justify-content:space-between;background:#070b14dd;backdrop-filter:blur(12px);border-bottom:1px solid #00eaff44}.astra-logo{font-size:27px;font-weight:900;background:linear-gradient(90deg,#09e9ff,#7a5cff,#a500ff);-webkit-background-clip:text;color:transparent}.astra-btns{display:flex;gap:8px}.astra-btns button{padding:10px 13px;border:1px solid #00eaff66;border-radius:10px;background:#0005;color:white;font-weight:800}.astra-livebar{max-width:980px;margin:14px auto 0;padding:0 18px}.astra-live{padding:10px 13px;border:1px solid #00eaff55;border-radius:12px;background:#06111ecc;font-size:13px}.astra-hero{min-height:68vh;display:grid;place-items:center;text-align:center;padding:70px 18px}.astra-hero h1{font-size:clamp(46px,9vw,84px);line-height:1.08;margin:0;background:linear-gradient(90deg,#0eefff,#367cff,#9a00ff);-webkit-background-clip:text;color:transparent;text-shadow:0 0 30px #00d9ff44}.astra-hero p{max-width:760px;margin:28px auto;color:#ddd;font-size:clamp(18px,3.5vw,28px);line-height:1.6}.astra-cta{padding:16px 44px;border:0;border-radius:999px;background:linear-gradient(90deg,#17dbf4,#8c18ff);color:#fff;font-size:18px;font-weight:900;box-shadow:0 0 28px #7b22ff66}.astra-pred{max-width:680px;margin:0 auto 80px;padding:22px}.astra-card{background:#07121ddd;border:1px solid #00eaff55;border-radius:22px;padding:20px;box-shadow:0 0 38px #00eaff17}.astra-card .circle{margin:22px auto;background:#07121d;border:4px solid transparent;background:linear-gradient(#07121d,#07121d) padding-box,linear-gradient(45deg,#00eaff,#8a23ff,#ff9d00) border-box}.astra-card .mode{border-color:#00eaff55;background:#00eaff0b}.astra-card .mode.active{border-color:#ff9d00}.astra-card .go{width:100%;background:linear-gradient(90deg,#00dff7,#881cff)}
.lj-mask{position:fixed;z-index:1000;inset:0;background:#000b;display:grid;place-items:center;padding:18px}.lj-box{width:min(430px,100%);background:#111827;border:1px solid #ffffff33;border-radius:18px;padding:18px}.lj-box p{font-size:13px;color:#ccc}.lj-box input{width:100%;padding:13px;border-radius:10px;border:1px solid #ffffff33;background:#0005;color:white}.lj-actions{display:flex;gap:8px;margin-top:12px}.lj-actions button{flex:1;padding:12px;border-radius:10px;border:1px solid #ffffff22;background:#ffffff0b;color:white;font-weight:800}.lj-actions button:last-child{background:linear-gradient(90deg,#00dff7,#881cff)}
</style></head><body><div id="root"></div><script>
window.LJ = (() => {
  const API = "https://crash-gateway-grm-cr.100hp.app/history";
  const CID = "077dee8d-c923-4c02-9bee-757573662e69";
  const KEY = "LJ_SESSION_ID";
  let cache=[];
  const mean=(a,d=0)=>a.length?a.reduce((s,x)=>s+x,0)/a.length:d;
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const sd=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))};
  const median=(a,d=0)=>{if(!a.length)return d;const s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2};
  function sid(){return(localStorage.getItem(KEY)||"").trim()}
  function setSid(v){v=(v||"").trim();if(v)localStorage.setItem(KEY,v);else localStorage.removeItem(KEY)}
  function normalize(x){if(!x||typeof x!=="object")return null;let c=Number(x.topCoefficient);if(!Number.isFinite(c)||c<=0){const a=Array.isArray(x.finalValues)?x.finalValues.map(Number).filter(v=>Number.isFinite(v)&&v>0):[];if(a.length)c=a[a.length-1]}if(!Number.isFinite(c)||c<=0)return null;if(c===1)c=1.01;return{id:String(x.id||x.roundId||x.round_id||x.hash||`${c}:${x.createdAt||x.time||""}`),c:Math.round(c*100)/100}}
  async function fetchRounds(limit=300){const s=sid();if(!s)throw new Error("SESSION_REQUIRED");const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),10000);try{const r=await fetch(API,{headers:{"customer-id":CID,"session-id":s,"accept":"application/json"},cache:"no-store",signal:ctl.signal});if(!r.ok)throw new Error("HTTP_"+r.status);const data=await r.json();if(!Array.isArray(data))throw new Error("BAD_FORMAT");const out=[],seen=new Set();for(const x of data){const row=normalize(x);if(!row||seen.has(row.id))continue;seen.add(row.id);out.push(row);if(out.length>=limit)break}if(!out.length)throw new Error("EMPTY_HISTORY");cache=out;return out}catch(e){if(e.name==="AbortError")throw new Error("TIMEOUT");if(e instanceof TypeError)throw new Error("NETWORK_OR_CORS");throw e}finally{clearTimeout(timer)}}
  function predict(rows,mode="standard"){const a=rows.map(r=>r.c);if(a.length<20)return{ready:false,target:0,score:0,window:0,why:`Сбор данных ${a.length}/20`};const clip=a.slice(0,30).map(x=>Math.min(x,20));const avg=mean(clip,1),vol=sd(clip)/Math.max(avg,1);const pos10=[];a.forEach((x,i)=>{if(x>=10)pos10.push(i)});const gaps=[];for(let i=1;i<pos10.length;i++)gaps.push(pos10[i]-pos10[i-1]);const gap10=pos10.length?pos10[0]:a.length,med10=median(gaps,12);const low=a.slice(0,10).filter(x=>x<2).length;if(mode==="premium"){let score=42+Math.min(30,(gap10/Math.max(med10,1))*18)+low*2+(1-clamp(vol,0,1))*14;if(gap10<=2)score-=22;score=Math.round(clamp(score,10,94));const vals=a.filter(x=>x>=10).sort((x,y)=>x-y);const target=vals.length?clamp(vals[Math.floor((vals.length-1)*.2)],10,15):10;return{ready:score>=62,target:+target.toFixed(2),score,window:score>=78?3:4,why:`gap10 ${gap10}/${med10.toFixed(1)} · vol ${vol.toFixed(2)}`}}if(mode==="montante"){const vals=a.filter(x=>x>=1.2&&x<=1.5).slice(0,40);let score=Math.round(clamp(50+low*4+(1-clamp(vol,0,1))*12,20,92));const target=clamp(mean(vals,1.33),1.2,1.5);return{ready:score>=56,target:+target.toFixed(2),score,window:1,why:`low10 ${low} · n ${vals.length}`}}const recent=mean(a.slice(0,10).map(x=>Math.min(x,12)),1);const older=mean(a.slice(10,20).map(x=>Math.min(x,12)),1);const momentum=(recent-older)/Math.max(older,1);let raw=avg*.68+(a[0]||1)*.32;let target=clamp(raw*(raw<2?.82:raw<3?.74:.64)*(1+clamp(momentum,-.3,.3)*.08),1.35,4.5);let score=Math.round(clamp(56+(1-clamp(vol/1.5,0,1))*22+clamp(momentum*8,-4,4),20,94));return{ready:score>=57,target:+target.toFixed(2),score,window:3,why:`vol ${vol.toFixed(2)} · momentum ${momentum>=0?"+":""}${momentum.toFixed(2)}`}}
  function latest(n=20){return cache.slice(0,n)}return{sid,setSid,fetchRounds,predict,latest};
})();
window.LJUI={explainError(code){if(code==="SESSION_REQUIRED")return"Нажми Session и вставь актуальный session-id.";if(code==="NETWORK_OR_CORS")return"Браузер заблокировал LIVE-запрос. Открой именно GitHub Pages-ссылку, не скачанный HTML.";if(code==="TIMEOUT")return"LIVE API не ответил за 10 секунд.";if(code.startsWith("HTTP_"))return"LIVE API ответил ошибкой "+code.replace("HTTP_","");if(code==="EMPTY_HISTORY")return"API подключён, но история пустая.";return code},openSession(afterSave){let old=document.getElementById("lj-session-modal");if(old)old.remove();const box=document.createElement("div");box.id="lj-session-modal";box.innerHTML=`<div class="lj-mask"><div class="lj-box"><h3>LuckyJet Session</h3><p>Вставь актуальный <b>session-id</b>. Он сохраняется только в localStorage этого сайта.</p><input id="lj-sid" autocomplete="off" spellcheck="false" placeholder="session-id" value="${LJ.sid().replace(/"/g,"&quot;")}"><div class="lj-actions"><button id="lj-cancel">Отмена</button><button id="lj-save">Сохранить и подключить</button></div></div></div>`;document.body.appendChild(box);document.getElementById("lj-cancel").onclick=()=>box.remove();document.getElementById("lj-save").onclick=()=>{LJ.setSid(document.getElementById("lj-sid").value);box.remove();if(afterSave)afterSave()}}};
</script><script>
const skin=(new URLSearchParams(location.search).get("skin")||"magicpro").toLowerCase();let mode="standard",rows=[];const $=id=>document.getElementById(id);
function modes(){return`<div class="modes"><button class="mode active" data-mode="standard">STANDARD</button><button class="mode" data-mode="premium">10X+</button><button class="mode" data-mode="montante">MONTANTE</button></div>`}
function render(){if(skin==="astra"){document.body.className="astra";document.getElementById("root").innerHTML=`<div class="astra-stars"></div><div class="astra-bg"></div><header class="astra-head"><div class="astra-logo">Predictor Lucky Jet</div><div class="astra-btns"><button onclick="document.getElementById('pred').scrollIntoView({behavior:'smooth'})">Сигнал</button><button id="sidBtn">Session</button></div></header><div class="astra-livebar"><div id="status" class="astra-live">Session не задан — нажми Session.</div></div><section class="astra-hero"><div><h1>VIP ПРОГНОЗЫ ДЛЯ<br>LUCKY JET</h1><p>Космический интерфейс AstraMind. Реальная история LuckyJet /history и статистический анализ.</p><button class="astra-cta" onclick="document.getElementById('pred').scrollIntoView({behavior:'smooth'})">ОТКРЫТЬ LIVE PREDICTOR</button></div></section><section id="pred" class="astra-pred"><div class="astra-card"><div class="circle"><div id="value">?.??X</div></div><div id="meta">После подключения здесь появится LIVE-анализ.</div>${modes()}<button id="go" class="go">ПОЛУЧИТЬ LIVE СИГНАЛ</button><div id="chips" class="chips"></div></div></section>`}else{document.body.className="magic";const label=skin==="classic"?"CLASSIC · LIVE":"PRO · LIVE";document.getElementById("root").innerHTML=`<div class="magic-app"><header class="magic-head"><div class="brand">Lucky Jet<br>Predictor<small>${label}</small></div><div id="status" class="status">Session не задан</div></header><main class="magic-main"><div class="circle"><div id="value">?.??x</div></div><div id="meta">Нажми Session и вставь session-id.</div>${modes()}<button id="go" class="go">ПОЛУЧИТЬ СИГНАЛ</button></main><footer class="magic-foot"><div id="clock" class="clock">--:--</div><div class="icons"><button id="histBtn" class="ico">☰</button><button id="sidBtn" class="ico">S</button></div></footer></div><div id="history" class="history"><b>LIVE история</b><div id="chips" class="chips"></div></div>`}bind()}
function paint(){const el=$("chips");if(el)el.innerHTML=LJ.latest(20).map(r=>`<span class="chip">${r.c.toFixed(2)}X</span>`).join("")}
async function connect(){if(!LJ.sid()){$("status").textContent="Session не задан — нажми Session";return}$("status").textContent="📡 Подключение…";try{rows=await LJ.fetchRounds(300);$("status").textContent=`✅ LIVE /history · ${rows.length}`;$("meta").textContent="Соединение установлено.";paint()}catch(e){$("status").textContent="❌ LIVE ошибка";$("meta").textContent=LJUI.explainError(e.message)}}
function bind(){document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.mode;$("value").textContent="?.??X"});$("sidBtn").onclick=()=>LJUI.openSession(connect);if($("histBtn"))$("histBtn").onclick=()=>$("history").classList.toggle("show");$("go").onclick=async()=>{try{if(!rows.length)rows=await LJ.fetchRounds(300);const r=LJ.predict(rows,mode);if(!r.ready){$("value").textContent="PAUSE";$("meta").textContent=`Пропуск · ${r.score}/100 · ${r.why}`}else{$("value").textContent=r.target.toFixed(2)+"X";$("meta").textContent=`LIVE score ${r.score}/100 · окно ${r.window} · ${r.why}`}}catch(e){$("meta").textContent=LJUI.explainError(e.message)}};if($("clock")){const t=()=>{const d=new Date();$("clock").textContent=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};t();setInterval(t,1000)}connect();setInterval(()=>{if(LJ.sid())connect()},5000)}
render();
</script></body></html>
