<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon Profil</title><style>body{font-family:Arial;background:#f0f0f0;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.profile-container{background:#fff;padding:20px;border-radius:10px;box-shadow:0 0 20px #0001;max-width:400px;width:100%;text-align:center;margin:20px}.profile-container img{width:100px;height:100px;border-radius:50%;object-fit:cover;margin-bottom:15px}.profile-container input[type=file]{display:none}.profile-container label{display:inline-block;background:#007BFF;color:#fff;padding:10px 20px;border-radius:5px;cursor:pointer;margin-bottom:20px}.profile-container input{width:80%;padding:10px;margin-bottom:15px;border:1px solid #ccc;border-radius:5px}.profile-container button{background:#28a745;color:white;padding:10px 20px;border:0;border-radius:5px}</style></head><body><div class="profile-container"><h2>Mon Profil</h2><img id="profile-image" src="https://via.placeholder.com/100"><label for="profile-image-input">Changer de photo</label><input type="file" id="profile-image-input" accept="image/*"><input id="username" placeholder="Nom d'utilisateur"><input id="phone-number" placeholder="Numéro de téléphone"><input id="city" placeholder="Ville"><input id="country" placeholder="Pays"><button id="save-button">Enregistrer</button><p><a href="babel-v6-game-live.htm">← Jeux</a></p></div><script>const ids=['username','phone-number','city','country'];function load(){let p={};try{p=JSON.parse(localStorage.getItem('babelProfile')||'{}')}catch(e){}ids.forEach(i=>document.getElementById(i).value=p[i]||'');if(p.image)document.getElementById('profile-image').src=p.image}document.getElementById('save-button').onclick=function(){let p={};ids.forEach(i=>p[i]=document.getElementById(i).value);p.image=document.getElementById('profile-image').src;localStorage.setItem('babelProfile',JSON.stringify(p));alert('Profil enregistré !')};document.getElementById('profile-image-input').onchange=function(e){let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=x=>document.getElementById('profile-image').src=x.target.result;r.readAsDataURL(f)};load()</script></body></html>
