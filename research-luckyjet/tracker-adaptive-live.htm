<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Lucky Jet Tracker · LIVE</title><style>
.hist{display:inline-flex;align-items:center;justify-content:center;padding:7px 9px;border-radius:9px;background:#ffffff0b;border:1px solid #ffffff12;font-size:12px;font-weight:800;margin:3px}.hist.big{color:#c084fc;border-color:#a855f755}.hist.big10{color:#ffcc66;border-color:#ffb34766;box-shadow:0 0 12px #ffb34718}
.entry-box{margin-top:13px;padding:13px;border-radius:14px;border:1px solid #ffffff20;background:#0004}.entry-box.wait{border-color:#ffc85777}.entry-box.enter{border-color:#31ee7d99;box-shadow:0 0 20px #20df6b22}.entry-box.win{border-color:#31ee7d99}.entry-box.loss{border-color:#ff5e7588}.entry-title{font-size:17px;font-weight:1000}.entry-sub{margin-top:6px;font-size:12px;line-height:1.45;color:#bbc2ce}
</style><style>
*{box-sizing:border-box}body{margin:0;background:#0f1117;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial}.app{max-width:520px;margin:auto;min-height:100vh;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;margin:8px 0 18px}.brand{display:flex;gap:10px;align-items:center}.ico{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#6b7aff,#a855f7);display:grid;place-items:center;font-size:20px}h1{font-size:17px;margin:0}.sub{font-size:10px;color:#7888aa;letter-spacing:1px;margin-top:3px}button{border:0;color:#e2e8f0;background:#1a2030;border-radius:11px;padding:10px 12px;font-weight:800}.live{border:1px solid #4ade80;color:#4ade80;background:#17241a;border-radius:20px;padding:7px 12px;font-size:11px;font-weight:900}.card{background:#171a22;border:1px solid #252a38;border-radius:15px;padding:15px;margin-bottom:13px}.hero{text-align:center;padding:20px}.signal{font-size:54px;font-weight:1000;letter-spacing:-2px;color:#a855f7;margin:8px}.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.zone{background:#11141b;padding:10px;border-radius:10px;text-align:center}.zone small{display:block;color:#778199;font-size:9px}.zone b{font-size:18px}.actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}#signalBtn{background:linear-gradient(135deg,#6b7aff,#a855f7);padding:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#11141b;border-radius:10px;padding:9px;text-align:center}.stat small{color:#7888aa;font-size:9px;display:block}.stat b{font-size:15px}.history{display:flex;flex-wrap:wrap;margin:-3px}.label{font-size:11px;color:#7888aa;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
</style></head><body><div class="app"><div class="head"><div class="brand"><div class="ico">🚀</div><div><h1>Lucky Jet Tracker</h1><div class="sub">ANALYSE EN TEMPS RÉEL</div></div></div><button id="sessionBtn">SESSION</button></div><div id="liveStatus" class="live">LIVE подключение…</div><div class="card hero"><div class="label">AUTO ADAPTIVE ENGINE</div><div id="signalValue" class="signal">?.??X</div><div class="zones"><div class="zone"><small>ZONE</small><b id="zone">--</b></div><div class="zone"><small>CONFIDENCE</small><b id="score">--</b></div><div class="zone"><small>10X GAP</small><b id="gap10">--</b></div></div><div class="actions"><button id="signalBtn">🎯 ПОЛУЧИТЬ СИГНАЛ</button><button id="resetBtn">↻</button></div><div id="entryBox" class="entry-box"><div id="entryTitle" class="entry-title"></div><div id="entrySub" class="entry-sub"></div></div></div><div class="card"><div class="label">LIVE STATS</div><div class="stats"><div class="stat"><small>AVG</small><b id="avg">--</b></div><div class="stat"><small>VOL</small><b id="vol">--</b></div><div class="stat"><small>≥2X</small><b id="freq2">--</b></div></div></div><div class="card"><div class="label">ROUND TABLE</div><div id="historyList" class="history"></div></div></div>
<script>
(function(){
'use strict';
var API='https://crash-gateway-grm-cr.100hp.app/history';
var KEY_S='LJ_SESSION_ID', KEY_C='LJ_CUSTOMER_ID', OLD_S='SIGNAL_MASTER_LJ_SESSION';
var state={rows:[],lastId:null,busy:false,plan:null,weights:{pattern:.40,volatility:.30,interval:.25,ending:.05},perf:[],lastPred:null};
try{state.plan=JSON.parse(localStorage.getItem('LJ_DEEP_SIGNAL_PLAN')||'null')}catch(e){state.plan=null}
function q(id){return document.getElementById(id)}
function setText(id,t){var e=q(id);if(e)e.textContent=t}
function mean(a){if(!a.length)return 0;var s=0;for(var i=0;i<a.length;i++)s+=a[i];return s/a.length}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function std(a){if(a.length<2)return 0;var m=mean(a),s=0;for(var i=0;i<a.length;i++)s+=(a[i]-m)*(a[i]-m);return Math.sqrt(s/a.length)}
function session(){return (localStorage.getItem(KEY_S)||localStorage.getItem(OLD_S)||'').trim()}
function customer(){return (localStorage.getItem(KEY_C)||'').trim()}
function savePlan(){if(state.plan)localStorage.setItem('LJ_DEEP_SIGNAL_PLAN',JSON.stringify(state.plan));else localStorage.removeItem('LJ_DEEP_SIGNAL_PLAN')}
function errText(x){if(x==='SETUP')return 'Нужны данные LIVE — нажми SESSION';if(x==='TIMEOUT')return 'LIVE API: таймаут 10 сек';if(x==='NETWORK')return 'LIVE: сеть/CORS. Открой именно GitHub Pages';if(x.indexOf('HTTP_')===0)return 'LIVE API: '+x.replace('HTTP_','HTTP ');if(x==='EMPTY')return 'LIVE API вернул пустую историю';return x}
function openSetup(){var old=q('lj-setup');if(old)old.remove();var w=document.createElement('div');w.id='lj-setup';w.innerHTML='<div style="position:fixed;z-index:99999;inset:0;background:#000d;display:grid;place-items:center;padding:18px"><div style="width:min(430px,100%);background:#10131c;color:#fff;border:1px solid #ffffff2b;border-radius:18px;padding:18px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial"><div style="font-size:20px;font-weight:900;margin-bottom:6px">LIVE подключение</div><div style="font-size:12px;color:#aeb6c5;line-height:1.45;margin-bottom:12px">Данные сохраняются только в localStorage на твоём устройстве и не записываются в исходник GitHub.</div><input id="lj-cid" placeholder="customer-id" style="width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid #ffffff25;background:#05070c;color:#fff"><input id="lj-sid" placeholder="session-id" style="width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid #ffffff25;background:#05070c;color:#fff"><div style="display:flex;gap:8px;margin-top:10px"><button id="lj-cancel" style="flex:1;padding:12px;border-radius:10px;border:1px solid #ffffff22;background:#ffffff09;color:white">Отмена</button><button id="lj-save" style="flex:1;padding:12px;border:0;border-radius:10px;background:linear-gradient(90deg,#6d5dfc,#b14cff);color:white;font-weight:900">Сохранить</button></div></div></div>';document.body.appendChild(w);q('lj-cid').value=customer();q('lj-sid').value=session();q('lj-cancel').onclick=function(){w.remove()};q('lj-save').onclick=function(){localStorage.setItem(KEY_C,q('lj-cid').value.trim());localStorage.setItem(KEY_S,q('lj-sid').value.trim());w.remove();refresh(true)}}
function normalize(x){if(!x||typeof x!=='object')return null;var c=Number(x.topCoefficient);if(!isFinite(c)||c<=0){var v=x.finalValues;if(Array.isArray(v)){for(var i=v.length-1;i>=0;i--){var n=Number(v[i]);if(isFinite(n)&&n>0){c=n;break}}}}if(!isFinite(c)||c<=0){var ks=['coefficient','coef','crash','value','multiplier'];for(var j=0;j<ks.length;j++){var z=Number(x[ks[j]]);if(isFinite(z)&&z>0){c=z;break}}}if(!isFinite(c)||c<=0)return null;if(c===1)c=1.01;return {id:String(x.id||x.roundId||x.round_id||x.hash||(c+':'+(x.createdAt||x.time||''))),c:Math.round(c*100)/100,hash:String(x.hash||'')}}
async function fetchRows(){if(state.busy)return state.rows;var s=session(),c=customer();if(!s||!c)throw new Error('SETUP');state.busy=true;var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort()},10000);try{var r=await fetch(API,{headers:{'customer-id':c,'session-id':s,'accept':'application/json'},cache:'no-store',signal:ctl.signal});if(!r.ok)throw new Error('HTTP_'+r.status);var d=await r.json();if(!Array.isArray(d))throw new Error('FORMAT');var out=[],seen={};for(var i=0;i<d.length&&out.length<500;i++){var row=normalize(d[i]);if(row&&!seen[row.id]){seen[row.id]=1;out.push(row)}}if(!out.length)throw new Error('EMPTY');state.rows=out;return out}catch(e){if(e.name==='AbortError')throw new Error('TIMEOUT');if(e instanceof TypeError)throw new Error('NETWORK');throw e}finally{clearTimeout(tm);state.busy=false}}
function zone(x){return x<1.5?'B':x<3?'M':'H'}
function analysis(rows){var a=[];for(var i=rows.length-1;i>=0;i--)a.push(rows[i].c);var recent=a.slice(Math.max(0,a.length-50)),clipped=[];for(i=0;i<recent.length;i++)clipped.push(Math.min(recent[i],25));var av=mean(clipped)||1,vol=std(clipped)/Math.max(av,1),f2=recent.filter(function(x){return x>=2}).length/Math.max(1,recent.length)*100;var newest=[];for(i=0;i<rows.length;i++)newest.push(rows[i].c);var gap10=newest.findIndex(function(x){return x>=10});if(gap10<0)gap10=newest.length;var zs=a.map(zone),pattern={B:.33,M:.33,H:.33};if(zs.length>=9){var k=zs.slice(-4).join(''),cnt={B:0,M:0,H:0},occ=0;for(i=0;i<zs.length-4;i++){if(zs.slice(i,i+4).join('')===k){cnt[zs[i+4]]++;occ++}}if(occ>=2){pattern={B:cnt.B/occ,M:cnt.M/occ,H:cnt.H/occ}}}var vs={B:.33,M:.33,H:.33};if(vol<.45)vs={B:.65,M:.25,H:.10};else if(vol<.9)vs={B:.20,M:.60,H:.20};else vs={B:.38,M:.24,H:.38};var intv={B:.33,M:.33,H:.33};if(a.length>=4){var dif=[];for(i=1;i<a.length;i++)dif.push(a[i]-a[i-1]);var lg=dif[dif.length-1],dm=mean(dif);if(lg>dm*1.5)intv={B:.15,M:.25,H:.60};else if(lg<dm*.5)intv={B:.55,M:.30,H:.15};else intv={B:.25,M:.50,H:.25}}var end={B:.33,M:.33,H:.33};if(a.length>=8){var last=a[a.length-1],e=(last.toFixed(2).split('.')[1]),same=0;for(i=0;i<a.length;i++)if(a[i].toFixed(2).split('.')[1]===e)same++;if(same>=3){var zz=zone(last);end={B:.2,M:.2,H:.2};end[zz]=.6}}var w=state.weights,sc={B:0,M:0,H:0};['B','M','H'].forEach(function(z){sc[z]=pattern[z]*w.pattern+vs[z]*w.volatility+intv[z]*w.interval+end[z]*w.ending});var best='B';if(sc.M>sc[best])best='M';if(sc.H>sc[best])best='H';var conf=Math.round(clamp(sc[best]*115,0,82));var target=best==='B'?1.35:(best==='M'?1.85:3.0);var wait=conf>=68?1:2;return {zone:best,confidence:conf,target:target,wait:wait,avg:av,vol:vol,f2:f2,gap10:gap10,sc:sc,pattern:pattern}}
function learn(actual){if(!state.lastPred)return;var ok=state.lastPred.zone===zone(actual),reward=ok?1:-1;state.perf.push(ok?1:0);if(state.perf.length>50)state.perf.shift();state.lastPred=null}
function renderRows(){var box=q('historyList');if(!box)return;var h='';for(var i=0;i<Math.min(20,state.rows.length);i++){var r=state.rows[i],cl=r.c>=10?'big10':(r.c>=3?'big':'');h+='<span class="hist '+cl+'">'+r.c.toFixed(2)+'X</span>'}box.innerHTML=h}
function renderStats(a){setText('score',a.confidence+'/82');setText('zone',a.zone);setText('avg',a.avg.toFixed(2)+'X');setText('vol',a.vol.toFixed(2));setText('freq2',a.f2.toFixed(0)+'%');setText('gap10',String(a.gap10));var b=q('signalValue');if(b&&!state.plan)b.textContent=a.zone==='H'?'3.00X+':(a.zone==='M'?'1.85X':'1.35X')}
function updatePlanUI(){var t=q('entryTitle'),s=q('entrySub'),b=q('entryBox');if(!t||!s)return;if(b)b.className='entry-box';if(!state.plan){t.textContent='ОЖИДАНИЕ СИГНАЛА';s.textContent='Нажми получить сигнал. Вход считается только по новым завершённым ID раундов.';return}if(state.plan.state==='waiting'){if(b)b.className+=' wait';t.textContent='🟡 ЖДАТЬ '+state.plan.left+' РАУНД'+(state.plan.left===1?'':'А');s.textContent='Цель '+state.plan.target.toFixed(2)+'X · сейчас НЕ входить.'}else if(state.plan.state==='entry'){if(b)b.className+=' enter';t.textContent='🟢 ВХОД СЕЙЧАС';s.textContent='Вход в следующий новый раунд · цель '+state.plan.target.toFixed(2)+'X. Если приём уже закрыт — пропусти.'}else if(state.plan.state==='done'){if(b)b.className+=' '+(state.plan.ok?'win':'loss');t.textContent=state.plan.ok?'✅ ЦЕЛЬ ДОСТИГНУТА':'❌ ЦЕЛЬ НЕ ДОСТИГНУТА';s.textContent='Цель '+state.plan.target.toFixed(2)+'X · результат '+state.plan.actual.toFixed(2)+'X.'}else{if(b)b.className+=' loss';t.textContent='⚠️ ОКНО ПРОПУЩЕНО';s.textContent=state.plan.msg||'Получи новый сигнал.'}}
function newRound(r){learn(r.c);if(!state.plan)return;if(state.plan.state==='waiting'){state.plan.left--;if(state.plan.left<=0)state.plan.state='entry';savePlan();updatePlanUI()}else if(state.plan.state==='entry'){state.plan.state='done';state.plan.actual=r.c;state.plan.ok=r.c>=state.plan.target;savePlan();updatePlanUI()}}
async function refresh(force){try{var rows=await fetchRows();setText('liveStatus','✅ LIVE · '+rows.length+' · '+rows[0].c.toFixed(2)+'X');renderRows();var a=analysis(rows);renderStats(a);if(!state.lastId)state.lastId=rows[0].id;else if(rows[0].id!==state.lastId){var fresh=[];for(var i=0;i<rows.length;i++){if(rows[i].id===state.lastId)break;fresh.push(rows[i])}if(fresh.length>1&&state.plan&&(state.plan.state==='waiting'||state.plan.state==='entry')){state.plan.state='expired';state.plan.msg='Пропущено '+fresh.length+' новых раундов';savePlan();updatePlanUI()}else for(i=fresh.length-1;i>=0;i--)newRound(fresh[i]);state.lastId=rows[0].id}}catch(e){setText('liveStatus','❌ '+errText(e.message));if(force&&e.message==='SETUP')openSetup()}}
function makeSignal(){if(!state.rows.length){refresh(false).then(makeSignal);return}var a=analysis(state.rows);if(a.confidence<38){state.plan=null;savePlan();setText('signalValue','PAUSE');var t=q('entryTitle');if(t)t.textContent='🔴 ПРОПУСК';var s=q('entrySub');if(s)s.textContent='Статистический score слишком низкий: '+a.confidence+'/82.';return}state.plan={state:'waiting',left:a.wait,total:a.wait,target:a.target,zone:a.zone,conf:a.confidence,created:Date.now()};savePlan();state.lastPred={zone:a.zone};setText('signalValue',a.target.toFixed(2)+'X');updatePlanUI()}
function reset(){state.plan=null;savePlan();updatePlanUI();if(state.rows.length)renderStats(analysis(state.rows))}
function init(){var sb=q('sessionBtn');if(sb)sb.onclick=openSetup;var b=q('signalBtn');if(b)b.onclick=makeSignal;var rb=q('resetBtn');if(rb)rb.onclick=reset;updatePlanUI();refresh(true);setInterval(function(){refresh(false)},2500)}
window.LJDeep={init:init,refresh:refresh,setup:openSetup,signal:makeSignal,reset:reset};
})();
</script>
<script>LJDeep.init();</script></body></html>
