iv><div class="stats"><span>WIN<b id="wins">0</b></span><span>LOSS<b id="losses">0</b></span><span>ВСЕГО<b id="total">0</b></span></div><div id="chips" class="chips"></div><div id="verify" class="verify">Ещё нет проверки.</div><button id="reset" class="btn">Сбросить session-id</button></main><script src="live-core.js"></script></body></html>
