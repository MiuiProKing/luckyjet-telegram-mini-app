<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta http-equiv="cache-control" content="no-cache"><title>LuckyJet Magicgram PRO V4</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#fff}body{background:linear-gradient(180deg,#53106e 0,#2c063e 45%,#170021 100%)}.app{min-height:100dvh;display:flex;flex-direction:column}.head{padding:18px 16px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.brand{font-size:28px;font-weight:900;line-height:.95}.brand small{display:block;color:#ff80df;font-size:10px;letter-spacing:2px;margin-top:8px}.status{max-width:52vw;padding:10px 12px;border:1px solid #ffffff2e;border-radius:999px;background:#0004;font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:10px 14px 16px}.circle{width:205px;height:205px;border-radius:50%;display:grid;place-items:center;background:#3b132f;border:5px solid #1f0c18;box-shadow:0 0 42px #e951c84f,0 14px 28px #0008;position:relative}.circle:before{content:"";position:absolute;inset:11px;border-radius:50%;border:3px solid transparent;border-top-color:#ff67c8;border-bottom-color:#ff67c8;animation:spin 3s linear infinite}.circle:after{content:"";position:absolute;inset:14px;border-radius:50%;border:2px solid #ff67c844}@keyframes spin{to{transform:rotate(360deg)}}#value{font-size:50px;font-weight:900;z-index:2}.meta{max-width:370px;min-height:40px;text-align:center;font-size:12px;line-height:1.4;opacity:.82;margin:11px 0 5px}.modes{width:min(370px,94vw);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mode{padding:11px 4px;border-radius:13px;border:1px solid #ffffff28;background:#0003;color:#fff;font-weight:900}.mode.active{border-color:#ff9ee8;background:#ffffff16}.go{width:min(370px,94vw);margin-top:10px;padding:15px;border:0;border-radius:14px;background:linear-gradient(90deg,#d92fc7,#ae47ff);color:#fff;font-size:19px;font-weight:900;box-shadow:0 8px 20px #0006}.entry{width:min(370px,94vw);margin-top:10px;border-radius:15px;padding:12px;border:1px solid #ffffff28;background:#0004;text-align:center}.et{font-size:20px;font-weight:1000}.es{font-size:12px;line-height:1.4;color:#ddd;margin-top:6px}.entry.wait{border-color:#ffc85788}.entry.enter{border-color:#39ff8899;background:#064f2638;box-shadow:0 0 25px #39ff8844}.entry.enter .et{color:#66ff9f}.entry.entered{border-color:#55bfff88}.entry.win{border-color:#45ff8d99;background:#07451e66}.entry.loss{border-color:#ff657999;background:#52132066}.actions{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.actions.show{display:grid}.actions button{padding:11px;border-radius:10px;border:1px solid #ffffff24;background:#ffffff0c;color:#fff;font-weight:900}.actions .in{background:linear-gradient(90deg,#10ad55,#28d97a);border:0}.session{width:min(370px,94vw);margin:10px auto 0;display:flex;gap:7px}.session input{flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid #ffffff2d;background:#0004;color:#fff}.session button{padding:10px 12px;border-radius:10px;border:1px solid #ffffff2d;background:#ffffff10;color:#fff;font-weight:800}.foot{padding:12px 16px;border-top:1px solid #ffffff14;background:#0003;display:flex;justify-content:space-between;align-items:center}.chips{display:flex;gap:5px;overflow:auto;max-width:78vw}.chip{flex:0 0 auto;font-size:11px;background:#ffffff10;padding:5px 7px;border-radius:7px}.note{font-size:10px;color:#bbb;margin-top:7px;line-height:1.35}</style></head><body><div class="app"><div class="head"><div class="brand">Lucky Jet<br>Predictor<small>MAGICGRAM PRO · V4</small></div><div id="status" class="status">📡 Введите Session</div></div><div class="main"><div class="circle"><div id="value">?.??x</div></div><div id="meta" class="meta">Сначала подключи LIVE, потом выбери режим и получи сигнал.</div><div class="modes"><button class="mode active" data-mode="standard">STANDARD</button><button class="mode" data-mode="premium">10X+</button><button class="mode" data-mode="montante">MONTANTE</button></div><button id="go" class="go">ПОЛУЧИТЬ СИГНАЛ</button><div id="entry" class="entry"><div id="et" class="et">Сначала получи сигнал</div><div id="es" class="es">Покажу сколько новых раундов ждать и когда входить.</div><div id="actions" class="actions"><button id="entered" class="in">✅ Я ВОШЁЛ</button><button id="skip">ПРОПУСТИТЬ</button></div><div class="note">Если приём ставок уже закрыт — не входи.</div></div><div class="session"><input id="sid" placeholder="session-id"><button id="save">Сохранить</button></div></div><div class="foot"><div id="clock">--:--</div><div id="chips" class="chips"></div></div></div><script>(function(){var API='https://crash-gateway-grm-cr.100hp.app/history',CID='077dee8d-c923-4c02-9bee-757573662e69',mode='standard',rows=[],lastId=null,plan=null,busy=false;function q(id){return document.getElementById(id)}function mean(a,d){if(!a.length)return d||0;var s=0;for(var i=0;i<a.length;i++)s+=a[i];return s/a.length}function sd(a){if(a.length<2)return 0;var m=mean(a,0),s=0;for(var i=0;i<a.length;i++)s+=(a[i]-m)*(a[i]-m);return Math.sqrt(s/a.length)}function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function med(a,d){if(!a.length)return d||0;a=a.slice().sort(function(x,y){return x-y});var m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}function norm(x){if(!x||typeof x!=='object')return null;var c=Number(x.topCoefficient);if(!(c>0)&&Array.isArray(x.finalValues)){for(var i=x.finalValues.length-1;i>=0;i--){var n=Number(x.finalValues[i]);if(n>0){c=n;break}}}if(!(c>0))return null;if(c===1)c=1.01;return{id:String(x.id||x.roundId||x.round_id||x.hash||(c+':'+(x.createdAt||x.time||''))),c:Math.round(c*100)/100}}function setStatus(t){q('status').textContent=t}function explain(e){var c=e&&e.message?e.message:String(e);if(c==='SESSION')return'Введи session-id и нажми Сохранить';if(c==='TIMEOUT')return'LIVE API не ответил';if(c.indexOf('HTTP_')===0)return'LIVE ошибка '+c.slice(5);if(c==='CORS')return'Браузер заблокировал LIVE-запрос';return c}function fetchRows(){return new Promise(function(resolve,reject){var sid=(q('sid').value||localStorage.getItem('LJ_SESSION_ID')||'').trim();if(!sid){reject(new Error('SESSION'));return}var x=new XMLHttpRequest();x.open('GET',API,true);x.timeout=10000;x.setRequestHeader('customer-id',CID);x.setRequestHeader('session-id',sid);x.setRequestHeader('accept','application/json');x.onreadystatechange=function(){if(x.readyState!==4)return;if(x.status<200||x.status>=300){reject(new Error('HTTP_'+x.status));return}try{var data=JSON.parse(x.responseText),out=[],seen={};for(var i=0;i<data.length&&out.length<300;i++){var r=norm(data[i]);if(r&&!seen[r.id]){seen[r.id]=1;out.push(r)}}if(!out.length)throw new Error('EMPTY');rows=out;resolve(out)}catch(e){reject(e)}};x.ontimeout=function(){reject(new Error('TIMEOUT'))};x.onerror=function(){reject(new Error('CORS'))};x.send()})}function predict(){var a=rows.map(function(r){return r.c});if(a.length<20)return{ready:false};var clip=a.slice(0,30).map(function(v){return Math.min(v,20)}),avg=mean(clip,1),vol=sd(clip)/Math.max(avg,1),low=a.slice(0,10).filter(function(v){return v<2}).length;if(mode==='premium'){var pos=[];for(var i=0;i<a.length;i++)if(a[i]>=10)pos.push(i);var gaps=[];for(i=1;i<pos.length;i++)gaps.push(pos[i]-pos[i-1]);var gap=pos.length?pos[0]:a.length,mg=med(gaps,12),score=Math.round(clamp(42+Math.min(30,gap/Math.max(mg,1)*18)+low*2+(1-clamp(vol,0,1))*14-(gap<=2?22:0),10,94)),vals=a.filter(function(v){return v>=10}).sort(function(x,y){return x-y}),target=vals.length?clamp(vals[Math.floor((vals.length-1)*.2)],10,15):10;return{ready:score>=62,score:score,target:target,wait:score>=78?1:2}}if(mode==='montante'){var ms=a.filter(function(v){return v>=1.2&&v<=1.5}).slice(0,40),sc=Math.round(clamp(50+low*4+(1-clamp(vol,0,1))*12,20,92));return{ready:sc>=56,score:sc,target:clamp(mean(ms,1.33),1.2,1.5),wait:1}}var recent=mean(a.slice(0,10).map(function(v){return Math.min(v,12)}),1),older=mean(a.slice(10,20).map(function(v){return Math.min(v,12)}),1),mom=(recent-older)/Math.max(older,1),raw=avg*.68+(a[0]||1)*.32,target=clamp(raw*(raw<2?.82:raw<3?.74:.64)*(1+clamp(mom,-.3,.3)*.08),1.35,4.5),score=Math.round(clamp(56+(1-clamp(vol/1.5,0,1))*22+clamp(mom*8,-4,4),20,94));return{ready:score>=57,score:score,target:target,wait:score>=72?1:2}}function entryUI(){var e=q('entry'),et=q('et'),es=q('es'),ac=q('actions');e.className='entry';ac.className='actions';if(!plan){et.textContent='Сначала получи сигнал';es.textContent='Покажу сколько новых раундов ждать и когда входить.';return}if(plan.state==='wait'){e.className+=' wait';et.textContent='🟡 ЖДАТЬ '+plan.left+' РАУНД';es.textContent='Цель '+plan.target.toFixed(2)+'X. Сейчас НЕ входить.'}else if(plan.state==='enter'){e.className+=' enter';et.textContent='🟢 ВХОД СЕЙЧАС';es.textContent='Вход в следующий новый раунд. Если ставки уже закрыты — пропусти.';ac.className='actions show'}else if(plan.state==='entered'){e.className+=' entered';et.textContent='🔵 ВХОД ПОДТВЕРЖДЁН';es.textContent='Ждём завершение текущего раунда. Цель '+plan.target.toFixed(2)+'X.'}else if(plan.state==='win'){e.className+=' win';et.textContent='✅ ЦЕЛЬ ДОСТИГНУТА';es.textContent='Выпало '+plan.actual.toFixed(2)+'X при цели '+plan.target.toFixed(2)+'X.'}else if(plan.state==='loss'){e.className+=' loss';et.textContent='❌ ЦЕЛЬ НЕ ДОСТИГНУТА';es.textContent='Выпало '+plan.actual.toFixed(2)+'X при цели '+plan.target.toFixed(2)+'X.'}else{et.textContent='⚠️ СИГНАЛ ПРОПУЩЕН';es.textContent='Получите новый прогноз.'}}function process(r){if(!plan)return;if(plan.state==='wait'){plan.left--;if(plan.left<=0)plan.state='enter';entryUI()}else if(plan.state==='enter'){plan.state='miss';entryUI()}else if(plan.state==='entered'){plan.actual=r.c;plan.state=r.c>=plan.target?'win':'loss';q('value').textContent=r.c.toFixed(2)+'x';entryUI()}}function refresh(){fetchRows().then(function(d){setStatus('✅ LIVE · '+d.length+' раундов');q('chips').innerHTML=d.slice(0,12).map(function(r){return'<span class="chip">'+r.c.toFixed(2)+'X</span>'}).join('');if(lastId&&d[0].id!==lastId){var fresh=[];for(var i=0;i<d.length;i++){if(d[i].id===lastId)break;fresh.push(d[i])}for(i=fresh.length-1;i>=0;i--)process(fresh[i])}lastId=d[0].id}).catch(function(e){setStatus('❌ '+explain(e))})}q('save').onclick=function(){localStorage.setItem('LJ_SESSION_ID',(q('sid').value||'').trim());refresh()};q('sid').value=localStorage.getItem('LJ_SESSION_ID')||'';document.querySelectorAll('.mode').forEach(function(b){b.onclick=function(){document.querySelectorAll('.mode').forEach(function(x){x.classList.remove('active')});b.classList.add('active');mode=b.getAttribute('data-mode')}});q('go').onclick=function(){if(busy)return;busy=true;fetchRows().then(function(){var p=predict();if(!p.ready){plan=null;q('value').textContent='PAUSE';q('meta').textContent='Рынок пропущен';entryUI();return}plan={state:'wait',left:p.wait,target:p.target};q('value').textContent=p.target.toFixed(2)+'x';q('meta').textContent='Цель '+p.target.toFixed(2)+'X · score '+p.score+'/100';entryUI()}).catch(function(e){q('meta').textContent=explain(e)}).finally(function(){busy=false})};q('entered').onclick=function(){if(plan&&plan.state==='enter'){plan.state='entered';entryUI()}};q('skip').onclick=function(){if(plan){plan.state='miss';entryUI()}};setInterval(function(){var d=new Date();q('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')},1000);refresh();setInterval(refresh,1600)})();</script></body></html>
