<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LuckyJet PRO</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial}.wrap{max-width:980px;margin:auto;padding:14px}.top{background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff;border-radius:15px;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{background:rgba(255,255,255,.16);padding:8px 11px;border-radius:999px;font-size:13px}.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,1fr);gap:14px;margin-top:14px}.card{background:white;border:1px solid #dbe4ee;border-radius:15px;padding:15px;box-shadow:0 5px 18px rgba(30,64,175,.06)}.title{font-weight:800;color:#1d4ed8}.status{font-size:14px;color:#475569}.coefs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.chip{padding:7px 9px;border-radius:9px;background:#eef6ff;color:#1e40af;font-weight:700}.signal{background:#f8fbff;border:1px solid #d9e8fa;border-radius:12px;padding:20px;text-align:center}.big{font-size:34px;font-weight:900;color:#2563eb;margin:8px}.meta{color:#64748b}.buttons{display:flex;gap:8px;margin-top:12px}.btn{flex:1;border:0;border-radius:10px;padding:11px;font-weight:800;color:white;background:linear-gradient(90deg,#2563eb,#0ea5e9)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.s{text-align:center;border-radius:10px;padding:10px}.s:nth-child(1){background:#dcfce7}.s:nth-child(2){background:#fee2e2}.s:nth-child(3){background:#dbeafe}.s b{display:block;font-size:21px}.verify{margin-top:12px;padding:11px;border-radius:10px;background:#f8fafc}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body data-engine="gamehub-pro"><div class="wrap"><div class="top"><div><b id="engine">LuckyJet PRO</b><div style="font-size:13px;opacity:.85">Профессиональный предиктор Lucky Jet</div></div><div class="badge" id="api">Проверка LIVE…</div></div><div class="grid"><section class="card"><div class="title">↻ Автоматическое получение</div><div class="status">LIVE /history · наше подключение</div><div id="chips" class="coefs"></div><div class="signal"><div style="font-size:13px">РЕЗУЛЬТАТ ПРОГНОЗА</div><div id="sig" class="big">СБОР ДАННЫХ…</div><div id="meta" class="meta">Ожидание завершённых раундов</div></div><div class="buttons"><button class="btn" onclick="location.reload()">▶ Обновить</button><button class="btn" id="reset">⚙ Session</button></div></section><aside><div class="card"><div class="title">Глобальная статистика</div><div class="stats" style="margin-top:12px"><div class="s">✅<b id="wins">0</b></div><div class="s">❌<b id="losses">0</b></div><div class="s">Σ<b id="total">0</b></div></div></div><div class="card" style="margin-top:14px"><div class="title">Последняя проверка</div><div id="verify" class="verify">Ещё нет прогноза.</div></div></aside></div></div><script src="live-core.js"></script></body></html>
