name: Temporary iPhone Optimizer Runner
on: [push]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build optimizer
        shell: bash
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import base64, html, http.cookiejar, json, pathlib, re, urllib.parse, urllib.request, traceback
          root=pathlib.Path('.tmp-iphone-optimizer'); status=root/'status.txt'
          try:
              source=(root/'source.cherri').read_text()
              base='https://playground.cherrilang.org'
              jar=http.cookiejar.CookieJar(); op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
              with op.open(urllib.request.Request(base+'/',headers={'User-Agent':'Mozilla/5.0'}),timeout=60) as r: page=r.read().decode('utf-8','replace')
              xsrf=None
              for c in jar:
                  if c.name=='XSRF-TOKEN': xsrf=urllib.parse.unquote(c.value)
              headers={'Content-Type':'application/json','Accept':'application/json, text/plain, */*','X-Requested-With':'XMLHttpRequest','Origin':base,'Referer':base+'/','User-Agent':'Mozilla/5.0'}
              if xsrf: headers['X-XSRF-TOKEN']=xsrf
              af={'id':'file-1','name':'iPhone-Optimizer-PRO.cherri','content':source,'compiled':False,'error':None,'output':None,'decompOutput':None,'shareLink':None,'file':None}
              req=urllib.request.Request(base+'/compile',data=json.dumps({'active_file':af,'files':[]}).encode(),headers=headers,method='POST')
              with op.open(req,timeout=120) as r: data=json.loads(r.read().decode('utf-8','replace'))
              if data.get('error'): raise RuntimeError('COMPILE: '+str(data.get('error'))+' | '+str(data.get('output')))
              u=data['file']; u=base+u if u.startswith('/') else u
              with op.open(u,timeout=120) as r: plist=r.read().decode('utf-8','replace')
              name=urllib.parse.urlparse(u).path.rsplit('/',1)[-1].split('.')[0]
              req=urllib.request.Request(base+'/sign',data=json.dumps({'name':name,'data':plist}).encode(),headers=headers,method='POST')
              with op.open(req,timeout=180) as r: body=r.read()
              if body.startswith(b'AEA1'): signed=body
              else:
                  v=json.loads(body.decode('utf-8','replace')) if body.lstrip().startswith((b'"',b'{')) else body.decode('utf-8','replace').strip()
                  if isinstance(v,dict): v=v.get('url') or v.get('file') or v.get('data')
                  if v.startswith('/'): v=base+v
                  with op.open(v,timeout=180) as r: signed=r.read()
              if not signed.startswith(b'AEA1'): raise RuntimeError('Not AEA1')
              (root/'signed.b64').write_text(base64.b64encode(signed).decode())
              (root/'iPhone-Optimizer-PRO.shortcut').write_bytes(signed)
              status.write_text('OK '+str(len(signed)))
          except Exception as e:
              status.write_text('ERROR\n'+str(e)+'\n'+traceback.format_exc())
              raise
          PY
      - name: Upload Shortcut
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: iphone-optimizer-pro
          path: .tmp-iphone-optimizer/iPhone-Optimizer-PRO.shortcut
          if-no-files-found: error
      - name: Save result
        if: always()
        run: |
          echo "${{ steps.upload.outputs.artifact-id }}" > .tmp-iphone-optimizer/artifact-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp-iphone-optimizer/
          git commit -m 'Temporary iPhone optimizer artifact result' || exit 0
          git push
