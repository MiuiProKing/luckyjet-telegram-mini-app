name: Add DOG PLAY card once

on:
  push:
    paths:
      - '.github/workflows/add-dog-play-card.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add DOG PLAY card directly to index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'data-dog-play-card' not in s:
              anchor = '''        <button class="game-card c-violet" type="button" data-now-card-direct aria-label="Open NoW" onclick="window.location.href='https://entypublic.github.io/snakegameminivladis/'"><span class="card-icon">▶</span><span class="lock-pill open-pill">OPEN</span><span class="card-copy"><span class="card-name">NoW</span><span class="card-studio">LIVE GAME</span></span></button>'''
              card = '''        <button class="game-card c-green" type="button" data-dog-play-card aria-label="Open DOG PLAY" onclick="window.location.href='https://entypublic.github.io/dogmain/'"><span class="card-icon">🐶</span><span class="lock-pill open-pill">OPEN</span><span class="card-copy"><span class="card-name">DOG PLAY</span><span class="card-studio">GAME HUB</span></span></button>'''
              if anchor not in s:
                  raise SystemExit('NoW card anchor not found; index left untouched')
              s = s.replace(anchor, anchor + '\n' + card, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit only index.html
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add DOG PLAY card to main page"
          git push
