name: Temporary iPhone Optimizer PRO v2

on:
  push:
    paths:
      - '.github/workflows/tmp-iphone-optimizer-v2.yml'
      - '.tmp-iphone-optimizer-v2/source.cherri'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compile and sign Shortcut
        shell: bash
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import base64, html as htmlmod, http.cookiejar, json, pathlib, re, traceback
          import urllib.parse, urllib.request

          root = pathlib.Path('.tmp-iphone-optimizer-v2')
          root.mkdir(exist_ok=True)
          status = root / 'status.txt'
          try:
              source = (root / 'source.cherri').read_text()
              base = 'https://playground.cherrilang.org'
              jar = http.cookiejar.CookieJar()
              op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
              req = urllib.request.Request(base + '/', headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/xhtml+xml'})
              with op.open(req, timeout=60) as r:
                  page = r.read().decode('utf-8','replace')
              m = re.search(r'<meta[^>]+name=["\']csrf-token["\'][^>]+content=["\']([^"\']+)', page, re.I)
              if not m:
                  m = re.search(r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+name=["\']csrf-token["\']', page, re.I)
              csrf = htmlmod.unescape(m.group(1)) if m else None
              xsrf = None
              for c in jar:
                  if c.name == 'XSRF-TOKEN': xsrf = urllib.parse.unquote(c.value)
              headers = {'Content-Type':'application/json','Accept':'application/json, text/plain, */*','X-Requested-With':'XMLHttpRequest','Origin':base,'Referer':base+'/','User-Agent':'Mozilla/5.0'}
              if csrf: headers['X-CSRF-TOKEN'] = csrf
              if xsrf: headers['X-XSRF-TOKEN'] = xsrf

              af = {'id':'file-1','name':'iPhone-Optimizer-ULTRA-PRO-v2.cherri','content':source,'compiled':False,'error':None,'output':None,'decompOutput':None,'shareLink':None,'file':None}
              creq = urllib.request.Request(base + '/compile', data=json.dumps({'active_file':af,'files':[]}).encode(), headers=headers, method='POST')
              with op.open(creq, timeout=120) as r:
                  data = json.loads(r.read().decode('utf-8','replace'))
              if data.get('error'):
                  raise RuntimeError('COMPILE: ' + str(data.get('error')) + ' | ' + str(data.get('output')))
              u = data.get('file')
              if not u: raise RuntimeError('Compile missing file URL')
              if u.startswith('/'): u = base + u
              with op.open(u, timeout=120) as r:
                  plist = r.read().decode('utf-8','replace')

              name = urllib.parse.urlparse(u).path.rsplit('/',1)[-1].split('.')[0]
              sreq = urllib.request.Request(base + '/sign', data=json.dumps({'name':name,'data':plist}).encode(), headers=headers, method='POST')
              with op.open(sreq, timeout=180) as r:
                  body = r.read()
              if body.startswith(b'AEA1'):
                  signed = body
              else:
                  txt = body.decode('utf-8','replace').strip()
                  try: value = json.loads(txt)
                  except Exception: value = txt
                  if isinstance(value, dict): value = value.get('url') or value.get('file') or value.get('data')
                  if not isinstance(value, str): raise RuntimeError('Unexpected sign response: ' + txt[:500])
                  value = value.strip('"')
                  if value.startswith('data:'):
                      head, enc = value.split(',',1)
                      signed = base64.b64decode(enc) if ';base64' in head else urllib.parse.unquote_to_bytes(enc)
                  else:
                      if value.startswith('/'): value = base + value
                      with op.open(value, timeout=180) as r:
                          signed = r.read()
              if not signed.startswith(b'AEA1'): raise RuntimeError('Signing result is not AEA1')

              out = root / 'iPhone-Optimizer-ULTRA-PRO-v2.shortcut'
              out.write_bytes(signed)
              (root / 'signed.b64').write_text(base64.b64encode(signed).decode())
              status.write_text('OK ' + str(len(signed)))
          except Exception as e:
              status.write_text('ERROR\n' + str(e) + '\n' + traceback.format_exc())
              raise
          PY

      - name: Upload signed Shortcut
        if: hashFiles('.tmp-iphone-optimizer-v2/iPhone-Optimizer-ULTRA-PRO-v2.shortcut') != ''
        uses: actions/upload-artifact@v4
        with:
          name: iphone-optimizer-ultra-pro-v2
          path: .tmp-iphone-optimizer-v2/iPhone-Optimizer-ULTRA-PRO-v2.shortcut

      - name: Persist result
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp-iphone-optimizer-v2/
          git commit -m 'Temporary iPhone optimizer PRO v2 build result' || exit 0
          git push
