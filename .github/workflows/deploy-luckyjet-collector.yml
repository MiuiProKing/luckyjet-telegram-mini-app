name: Deploy LuckyJet collector to active project

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/v0xff3-live/**'
      - '.github/workflows/deploy-luckyjet-collector.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: xrniwkvfrtchtxjrwwgd
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify deployment secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
      - name: Deploy LuckyJet collector
        run: supabase functions deploy v0xff3-live --project-ref "$PROJECT_ID" --use-api
