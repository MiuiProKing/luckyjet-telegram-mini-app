name: Collect LuckyJet rounds

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-luckyjet-rounds.yml'

permissions:
  contents: read

concurrency:
  group: luckyjet-supabase-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check collector secret
        env:
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
        run: |
          if [ -z "${COLLECTOR_TOKEN:-}" ]; then
            echo "::error::Add COLLECTOR_TOKEN in repository Actions secrets before running this collector."
            exit 1
          fi

      - name: Fetch and save recent rounds
        env:
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
          SUPABASE_FUNCTION_URL: https://xrniwkvfrtchtxjrwwgd.supabase.co/functions/v1/v0xff3-live
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors --retry-delay 2 --max-time 25 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-collector-token: ${COLLECTOR_TOKEN}" \
            "${SUPABASE_FUNCTION_URL}")"
          printf '%s' "$response" | jq .
          printf '%s' "$response" | jq -e '.ok == true' >/dev/null
