name: Temporary Build Instagram x100 Shortcut

on:
  push:
    paths:
      - '.github/workflows/tmp-build-instagram-shortcut.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compile and sign Shortcut
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, html as htmlmod, http.cookiejar, json, pathlib, re
          import urllib.parse, urllib.request, urllib.error

          source = r'''#include 'actions/device'

          repeat i for 100 {
              openApp("com.burbn.instagram")
              wait(2)
              returnToHomescreen()
              wait(58)
          }
          '''

          base = 'https://playground.cherrilang.org'
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          # Establish session and get XSRF token.
          req = urllib.request.Request(base + '/', headers={
              'User-Agent': 'Mozilla/5.0',
              'Accept': 'text/html,application/xhtml+xml'
          })
          with opener.open(req, timeout=60) as r:
              page = r.read().decode('utf-8', 'replace')
              print('GET root:', r.status)

          m = re.search(r'<meta[^>]+name=["\']csrf-token["\'][^>]+content=["\']([^"\']+)', page, re.I)
          if not m:
              m = re.search(r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+name=["\']csrf-token["\']', page, re.I)
          csrf = htmlmod.unescape(m.group(1)) if m else None
          xsrf = None
          for c in jar:
              if c.name == 'XSRF-TOKEN':
                  xsrf = urllib.parse.unquote(c.value)

          headers = {
              'Content-Type': 'application/json',
              'Accept': 'application/json, text/plain, */*',
              'X-Requested-With': 'XMLHttpRequest',
              'Origin': base,
              'Referer': base + '/',
              'User-Agent': 'Mozilla/5.0'
          }
          if csrf:
              headers['X-CSRF-TOKEN'] = csrf
          if xsrf:
              headers['X-XSRF-TOKEN'] = xsrf

          active_file = {
              'id': 'file-1',
              'name': 'Instagram-x100.cherri',
              'content': source,
              'compiled': False,
              'error': None,
              'output': None,
              'decompOutput': None,
              'shareLink': None,
              'file': None,
          }
          compile_payload = json.dumps({'active_file': active_file, 'files': []}).encode('utf-8')
          compile_req = urllib.request.Request(base + '/compile', data=compile_payload, headers=headers, method='POST')
          try:
              with opener.open(compile_req, timeout=120) as r:
                  compile_body = r.read()
                  print('POST compile:', r.status, r.headers.get('content-type',''))
          except urllib.error.HTTPError as e:
              err = e.read().decode('utf-8','replace')
              print('COMPILE HTTP ERROR', e.code, err[:3000])
              raise

          compile_data = json.loads(compile_body.decode('utf-8','replace'))
          print('compiler output:', compile_data.get('output'))
          print('compiler error:', compile_data.get('error'))
          if compile_data.get('error'):
              raise RuntimeError('Cherri compile error: ' + str(compile_data.get('error')))
          file_url = compile_data.get('file')
          if not file_url:
              raise RuntimeError('Compile response did not include file URL: ' + repr(compile_data)[:2000])
          if file_url.startswith('/'):
              file_url = base + file_url
          with opener.open(file_url, timeout=120) as r:
              shortcut_data = r.read().decode('utf-8','replace')
              print('compiled plist chars:', len(shortcut_data))

          file_base = urllib.parse.urlparse(file_url).path.rsplit('/',1)[-1].split('.')[0]
          sign_payload = json.dumps({'name': file_base, 'data': shortcut_data}).encode('utf-8')
          sign_req = urllib.request.Request(base + '/sign', data=sign_payload, headers=headers, method='POST')
          try:
              with opener.open(sign_req, timeout=180) as r:
                  sign_body = r.read()
                  print('POST sign:', r.status, r.headers.get('content-type',''), 'bytes:', len(sign_body))
          except urllib.error.HTTPError as e:
              err = e.read().decode('utf-8','replace')
              print('SIGN HTTP ERROR', e.code, err[:3000])
              raise

          signed = None
          if sign_body.startswith(b'AEA1'):
              signed = sign_body
          else:
              txt = sign_body.decode('utf-8','replace').strip()
              try:
                  value = json.loads(txt)
              except Exception:
                  value = txt
              if isinstance(value, dict):
                  value = value.get('url') or value.get('file') or value.get('data')
              if not isinstance(value, str):
                  raise RuntimeError('Unexpected sign response: ' + txt[:1000])
              value = value.strip('"')
              if value.startswith('data:'):
                  header, encoded = value.split(',',1)
                  signed = base64.b64decode(encoded) if ';base64' in header else urllib.parse.unquote_to_bytes(encoded)
              else:
                  if value.startswith('/'):
                      value = base + value
                  with opener.open(value, timeout=180) as r:
                      signed = r.read()
                      print('download signed:', r.status, 'bytes:', len(signed))

          if not signed or not signed.startswith(b'AEA1'):
              raise RuntimeError('Signing result is not an AEA1 Shortcut')

          out = pathlib.Path('Instagram-x100.shortcut')
          out.write_bytes(signed)
          print('SIGNED_OK', len(signed), signed[:4])
          PY

      - name: Upload signed Shortcut
        uses: actions/upload-artifact@v4
        with:
          name: Instagram-x100-signed
          path: Instagram-x100.shortcut
          if-no-files-found: error
