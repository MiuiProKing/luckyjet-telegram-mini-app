name: Lucky Jet ML checks
on:
  push:
    branches: [bog-hishchnik-ml-20261005]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tests/bog-hishchnik-audit.test.mjs
        env:
          TZ: UTC
      - run: node tests/bog-hishchnik-audit.test.mjs
        env:
          TZ: Europe/Kyiv
      - run: node tests/bog-hishchnik-ml.test.mjs
      - run: python tests/test_local_server.py
