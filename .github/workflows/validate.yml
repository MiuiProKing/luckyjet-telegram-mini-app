name: Validate mini app

on:
  push:
    branches: [main]
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Safari userscript bundle
        run: |
          npm ci --ignore-scripts --prefix god-preditor-pro-vip/safari
          npm run check --prefix god-preditor-pro-vip/safari
          node --check god-preditor-pro-vip/safari/god-preditor.user.js
      - name: Check JavaScript syntax
        run: |
          set -e
          for file in *.js; do
            echo "Checking $file"
            node --check "$file"
          done
          node --check god-preditor-pro-vip/app.js
      - name: Verify required files
        run: |
          test -f index.html
          test -f app-config.js
          test -f i18n-runtime.js
          test -f language-onboarding.js
          test -f access.js
          test -f license-client.js
          test -f analytics-client.js
          test -f app-center.js
          test -f admin.html
      - name: Verify Lucky Jet audit scenarios
        run: |
          node --test tests/luckyjet-hub-supabase.test.mjs
          node --test god-preditor-pro-vip/tests/*.test.mjs
          TZ=UTC node tests/pro-luckyjet-audit.test.mjs
          TZ=Europe/Kyiv node tests/pro-luckyjet-audit.test.mjs
