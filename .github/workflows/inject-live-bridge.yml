name: Inject live coefficient bridge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[live-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject/update bridge in all HTML pages
        shell: python
        run: |
          from pathlib import Path
          import re
          tag = '<script src="live-coefficients.js?v=20260912-2"></script>'
          changed = []
          pattern = re.compile(r'<script\s+src=["\']live-coefficients\.js(?:\?[^"\']*)?["\']\s*></script>', re.I)
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8')
              if pattern.search(text):
                  new = pattern.sub(tag, text, count=1)
              elif '</body>' in text:
                  new = text.replace('</body>', tag + '\n</body>', 1)
              else:
                  continue
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(str(p))
          print('Updated:', changed)
      - name: Commit injected pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes needed"
            exit 0
          fi
          git commit -m "Refresh live bridge in all HTML pages [live-sync]"
          git push
