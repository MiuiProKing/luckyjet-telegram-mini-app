name: Inject live coefficient bridge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[live-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject bridge into HTML pages
        shell: python
        run: |
          from pathlib import Path
          tag = '<script src="live-coefficients.js?v=20260912"></script>'
          changed = []
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8')
              if 'live-coefficients.js' in text:
                  continue
              marker = '</body>'
              if marker in text:
                  p.write_text(text.replace(marker, tag + '\n' + marker, 1), encoding='utf-8')
                  changed.append(str(p))
          print('Injected:', changed)
      - name: Commit injected pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes needed"
            exit 0
          fi
          git commit -m "Inject live coefficient bridge [live-sync]"
          git push
