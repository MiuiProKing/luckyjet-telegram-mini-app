name: Build AP Collector IPA

on:
  push:
    branches:
      - apcollector-ios27
    paths:
      - 'ios/APCollector/**'
      - '.github/workflows/build-apcollector.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios/APCollector
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: ios/APCollector
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild \
            -project APCollector.xcodeproj \
            -scheme APCollector \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ios/APCollector
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/APCollector.app"
          test -d "$APP"
          rm -rf Payload APCollector-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry APCollector-unsigned.ipa Payload
          ls -lh APCollector-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: APCollector-unsigned-ipa
          path: ios/APCollector/APCollector-unsigned.ipa

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apcollector-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            ios/APCollector/APCollector-unsigned.ipa \
            --target "$GITHUB_SHA" \
            --title "AP Collector unsigned IPA #${GITHUB_RUN_NUMBER}" \
            --notes "Unsigned IPA. Sign it with your own iOS signing method before installation. Capture requires iOS 27+."
