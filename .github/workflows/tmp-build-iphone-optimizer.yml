name: Temporary Build iPhone Optimizer Shortcut

on:
  push:
    paths:
      - '.github/workflows/tmp-build-iphone-optimizer.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compile and sign Shortcut
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, html as htmlmod, http.cookiejar, json, pathlib, re
          import urllib.parse, urllib.request, urllib.error

          source = r'''#include 'actions/basic'
#include 'actions/device'
#include 'actions/documents'
#include 'actions/sharing'

menu "🧹 Оптимизация iPhone PRO" {
    item "⚡ Быстрая уборка":
        @empty = ""
        setClipboard(@empty, true)
        setHotspot(false)
        showNotification("Буфер обмена очищен, точка доступа выключена.", "✅ Быстрая уборка", true)

    item "🕘 Удалить выбранные из Недавних":
        @recentFiles = selectFile(true)
        confirm("Будут удалены сами выбранные файлы, а не только записи в Недавних. Продолжить?", "⚠️ Внимание")
        deleteFiles(@recentFiles, false)
        showNotification("Выбранные файлы отправлены на удаление.", "🗑 Очистка файлов", true)

    item "📁 Очистить выбранную папку":
        @folder = selectFolder(false)
        @folderItems = getFolderContents(@folder, true)
        @itemCount = count(@folderItems)
        confirm("В выбранной папке найдено {@itemCount} объектов. Удалить их?", "⚠️ Очистить папку")
        deleteFiles(@folderItems, false)
        showNotification("Содержимое выбранной папки отправлено на удаление.", "🧹 Папка очищена", true)

    item "⚙️ Открыть Настройки":
        openApp("com.apple.Preferences")

    item "🔄 Перезагрузить iPhone":
        confirm("Перезагрузить iPhone сейчас?", "🔄 Перезагрузка")
        reboot()

    item "ℹ️ Что реально очищается":
        alert("Команда может удалить выбранные файлы и содержимое выбранной папки, очистить буфер обмена и открыть Настройки. Системную RAM и кэш всех приложений iOS очищает сама — отдельной системной кнопки для этого нет.", "Оптимизация iPhone")
}
'''

          base = 'https://playground.cherrilang.org'
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          req = urllib.request.Request(base + '/', headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/xhtml+xml'})
          with opener.open(req, timeout=60) as r:
              page = r.read().decode('utf-8','replace')

          m = re.search(r'<meta[^>]+name=["\']csrf-token["\'][^>]+content=["\']([^"\']+)', page, re.I)
          if not m:
              m = re.search(r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+name=["\']csrf-token["\']', page, re.I)
          csrf = htmlmod.unescape(m.group(1)) if m else None
          xsrf = None
          for c in jar:
              if c.name == 'XSRF-TOKEN':
                  xsrf = urllib.parse.unquote(c.value)

          headers = {
              'Content-Type':'application/json',
              'Accept':'application/json, text/plain, */*',
              'X-Requested-With':'XMLHttpRequest',
              'Origin':base,
              'Referer':base+'/',
              'User-Agent':'Mozilla/5.0'
          }
          if csrf: headers['X-CSRF-TOKEN'] = csrf
          if xsrf: headers['X-XSRF-TOKEN'] = xsrf

          active_file = {
              'id':'file-1','name':'iPhone-Optimizer-PRO.cherri','content':source,'compiled':False,
              'error':None,'output':None,'decompOutput':None,'shareLink':None,'file':None,
          }
          cpayload = json.dumps({'active_file':active_file,'files':[]}).encode()
          creq = urllib.request.Request(base+'/compile', data=cpayload, headers=headers, method='POST')
          with opener.open(creq, timeout=120) as r:
              cbody = r.read()
          data = json.loads(cbody.decode('utf-8','replace'))
          print('compile output:', data.get('output'))
          print('compile error:', data.get('error'))
          if data.get('error'):
              raise RuntimeError('compile error: ' + str(data.get('error')))
          file_url = data.get('file')
          if not file_url:
              raise RuntimeError('compile missing file URL')
          if file_url.startswith('/'):
              file_url = base + file_url
          with opener.open(file_url, timeout=120) as r:
              plist_text = r.read().decode('utf-8','replace')

          file_base = urllib.parse.urlparse(file_url).path.rsplit('/',1)[-1].split('.')[0]
          spayload = json.dumps({'name':file_base,'data':plist_text}).encode()
          sreq = urllib.request.Request(base+'/sign', data=spayload, headers=headers, method='POST')
          with opener.open(sreq, timeout=180) as r:
              sbody = r.read()
          signed = None
          if sbody.startswith(b'AEA1'):
              signed = sbody
          else:
              txt = sbody.decode('utf-8','replace').strip()
              try: value = json.loads(txt)
              except Exception: value = txt
              if isinstance(value, dict):
                  value = value.get('url') or value.get('file') or value.get('data')
              if not isinstance(value, str):
                  raise RuntimeError('unexpected sign response: '+txt[:500])
              value = value.strip('"')
              if value.startswith('data:'):
                  header, encoded = value.split(',',1)
                  signed = base64.b64decode(encoded) if ';base64' in header else urllib.parse.unquote_to_bytes(encoded)
              else:
                  if value.startswith('/'):
                      value = base + value
                  with opener.open(value, timeout=180) as r:
                      signed = r.read()
          if not signed or not signed.startswith(b'AEA1'):
              raise RuntimeError('signing result is not AEA1')
          out = pathlib.Path('iPhone-Optimizer-PRO.shortcut')
          out.write_bytes(signed)
          print('SIGNED_OK', len(signed), signed[:4])
          PY

      - name: Upload signed Shortcut
        uses: actions/upload-artifact@v4
        with:
          name: iphone-optimizer-pro-signed
          path: iPhone-Optimizer-PRO.shortcut
          if-no-files-found: error
