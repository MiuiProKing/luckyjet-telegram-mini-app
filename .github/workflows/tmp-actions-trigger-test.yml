name: Temporary Actions Trigger Test
on: [push]
permissions:
  contents: write
jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p .tmp-actions-trigger
          echo "OK $(date -u +%s)" > .tmp-actions-trigger/status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp-actions-trigger/status.txt
          git commit -m 'Temporary Actions trigger result'
          git push
