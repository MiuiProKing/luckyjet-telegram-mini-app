name: Verify Telegram signature fallback

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/allpredictor-api/index.ts'
      - '.github/workflows/patch-telegram-signature.yml'
  pull_request:
    paths:
      - 'supabase/functions/allpredictor-api/index.ts'
      - '.github/workflows/patch-telegram-signature.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Telegram authentication fallbacks
        run: |
          grep -q 'TELEGRAM_ED25519_FALLBACK_V1' supabase/functions/allpredictor-api/index.ts
          grep -q 'verifyPublicTelegramSignature' supabase/functions/allpredictor-api/index.ts
