name: Temporary Inspect Cherri
on:
  push:
    paths:
      - '.github/workflows/tmp-inspect-cherri.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect playground client
        shell: bash
        run: |
          curl -fsSL https://playground.cherrilang.org/build/assets/app-DEZQz9qq.js -o /tmp/app.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/app.js').read_text(errors='ignore')
          print('length',len(s))
          terms=['hubsign','signing','sign','compile','shortcut','fetch(','XMLHttpRequest','cherrilang.org']
          seen=set()
          for term in terms:
              start=0
              count=0
              while count < 30:
                  i=s.lower().find(term.lower(),start)
                  if i<0: break
                  ctx=s[max(0,i-400):min(len(s),i+700)].replace('\n',' ')
                  key=ctx[:200]
                  if key not in seen:
                      seen.add(key); print('\nTERM',term,'AT',i,'\n',ctx)
                  start=i+len(term); count+=1
          PY
