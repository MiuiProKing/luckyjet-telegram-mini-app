name: Temporary ULTRA Economy v2

on:
  push:
    paths:
      - '.tmp-ultra-v2/source.cherri'
      - '.github/workflows/tmp-ultra-economy-v2.yml'

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compile and sign Shortcut
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, html as htmlmod, http.cookiejar, json, pathlib, re
          import urllib.parse, urllib.request

          root = pathlib.Path('.tmp-ultra-v2')
          source = (root / 'source.cherri').read_text()
          base = 'https://playground.cherrilang.org'
          jar = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          with op.open(urllib.request.Request(base+'/', headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/xhtml+xml'}), timeout=60) as r:
              page = r.read().decode('utf-8','replace')
          m = re.search(r'<meta[^>]+name=["\']csrf-token["\'][^>]+content=["\']([^"\']+)', page, re.I)
          if not m:
              m = re.search(r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+name=["\']csrf-token["\']', page, re.I)
          csrf = htmlmod.unescape(m.group(1)) if m else None
          xsrf = None
          for c in jar:
              if c.name == 'XSRF-TOKEN': xsrf = urllib.parse.unquote(c.value)
          headers = {'Content-Type':'application/json','Accept':'application/json, text/plain, */*','X-Requested-With':'XMLHttpRequest','Origin':base,'Referer':base+'/','User-Agent':'Mozilla/5.0'}
          if csrf: headers['X-CSRF-TOKEN'] = csrf
          if xsrf: headers['X-XSRF-TOKEN'] = xsrf

          af = {'id':'file-1','name':'ULTRA-Economy-v2.cherri','content':source,'compiled':False,'error':None,'output':None,'decompOutput':None,'shareLink':None,'file':None}
          req = urllib.request.Request(base+'/compile', data=json.dumps({'active_file':af,'files':[]}).encode(), headers=headers, method='POST')
          with op.open(req, timeout=120) as r:
              data = json.loads(r.read().decode('utf-8','replace'))
          if data.get('error'):
              raise RuntimeError('COMPILE: '+str(data.get('error'))+' | '+str(data.get('output')))
          u = data.get('file')
          if not u: raise RuntimeError('Compile missing file URL')
          if u.startswith('/'): u = base + u
          with op.open(u, timeout=120) as r:
              plist = r.read().decode('utf-8','replace')
          name = urllib.parse.urlparse(u).path.rsplit('/',1)[-1].split('.')[0]
          req = urllib.request.Request(base+'/sign', data=json.dumps({'name':name,'data':plist}).encode(), headers=headers, method='POST')
          with op.open(req, timeout=180) as r:
              body = r.read()
          if body.startswith(b'AEA1'):
              signed = body
          else:
              txt = body.decode('utf-8','replace').strip()
              try: value = json.loads(txt)
              except Exception: value = txt
              if isinstance(value, dict): value = value.get('url') or value.get('file') or value.get('data')
              if not isinstance(value, str): raise RuntimeError('Unexpected sign response: '+txt[:500])
              value = value.strip('"')
              if value.startswith('data:'):
                  head, enc = value.split(',',1)
                  signed = base64.b64decode(enc) if ';base64' in head else urllib.parse.unquote_to_bytes(enc)
              else:
                  if value.startswith('/'): value = base + value
                  with op.open(value, timeout=180) as r: signed = r.read()
          if not signed.startswith(b'AEA1'): raise RuntimeError('Signing result is not AEA1')
          out = root / 'ULTRA-Economy-v2.shortcut'
          out.write_bytes(signed)
          (root/'status.txt').write_text('OK '+str(len(signed)))
          PY

      - name: Upload signed Shortcut
        uses: actions/upload-artifact@v4
        with:
          name: ultra-economy-v2-signed
          path: .tmp-ultra-v2/ULTRA-Economy-v2.shortcut
          if-no-files-found: error

      - name: Save artifact id and status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          ARTIFACT_ID=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["artifacts"][0]["id"])')
          echo "$ARTIFACT_ID" > .tmp-ultra-v2/artifact-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp-ultra-v2/status.txt .tmp-ultra-v2/artifact-id.txt
          git commit -m 'Temporary ULTRA Economy v2 build result' || exit 0
          git push
