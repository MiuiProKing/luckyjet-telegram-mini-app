name: Temporary Shortcut Sign
on:
  push:
    paths:
      - '.github/workflows/tmp-sign-shortcut.yml'

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Sign shortcut
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, plistlib, json, urllib.request, pathlib
          b64 = ''''''
          raw = gzip.decompress(base64.b64decode(b64))
          obj = plistlib.loads(raw)
          xml = plistlib.dumps(obj, fmt=plistlib.FMT_XML).decode('utf-8')
          payload = json.dumps({'shortcutName':'Меню зарядки PRO','shortcut':xml}).encode('utf-8')
          req = urllib.request.Request('https://hubsign.routinehub.services/sign', data=payload, headers={'Content-Type':'application/json','User-Agent':'shortcut-sign-gha'})
          with urllib.request.urlopen(req, timeout=45) as r:
              data = r.read()
          if not data.startswith(b'AEA1'):
              raise SystemExit('Signing service returned non-AEA1 data: ' + repr(data[:200]))
          pathlib.Path('Меню зарядки PRO signed.shortcut').write_bytes(data)
          print('signed bytes:', len(data))
          PY
      - name: Upload signed shortcut
        uses: actions/upload-artifact@v4
        with:
          name: menu-zaryadki-pro-signed
          path: 'Меню зарядки PRO signed.shortcut'
          if-no-files-found: error
