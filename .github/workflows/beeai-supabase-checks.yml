name: BeeAI Supabase checks
on:
  push:
    branches: [beeai-supabase-live-20261009]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-vm-modules tests/bee-cloud.test.mjs
      - run: node tests/bee-cloud-transport.cjs
      - run: node tests/bee-cloud-api.test.cjs
      - run: node tests/bog-hishchnik-audit.test.mjs
        env:
          TZ: Europe/Kyiv
      - run: node --check bog-hishchnik-alert/beeai.js && node --check bog-hishchnik-alert/bee-cloud-api.js && node --check bog-hishchnik-alert/cloud-transport.js
