name: VIP AI checks
on:
  push:
    branches: [vip-ai-supabase-20261009]
    paths: ['vip-ai/**', 'supabase/functions/luckyjet-beeai/**', 'supabase/migrations/20261010_beeai_models.sql', '.github/workflows/vip-ai-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node vip-ai/tests/vip-ai.test.cjs
      - run: node vip-ai/tests/server-models.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/luckyjet-beeai/index.ts
      - run: deno test --allow-env vip-ai/tests/cloud-ai.test.ts
      - run: node vip-ai/tests/cloud-read.cjs
