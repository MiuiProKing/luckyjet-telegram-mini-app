name: VIP AI checks
on:
  push:
    branches: [vip-ai-supabase-20261009]
    paths: ['vip-ai/**', '.github/workflows/vip-ai-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node vip-ai/tests/vip-ai.test.cjs
      - run: node vip-ai/tests/cloud-read.cjs
