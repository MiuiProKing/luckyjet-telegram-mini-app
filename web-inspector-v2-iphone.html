<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>LuckyJet Inspector V2</title>
<style>*{box-sizing:border-box}body{margin:0;background:#07090d;color:#f2f5f9;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}main{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 12px 30px}.card{background:#11151c;border:1px solid #252c37;border-radius:18px;padding:14px;margin:10px 0}h1{font-size:21px;margin:3px 0 5px}.sub{color:#929cab;font-size:12px;line-height:1.45}input,button,textarea{font:inherit;width:100%;border-radius:12px;border:1px solid #303845;background:#0b0e13;color:#fff;padding:12px;margin-top:8px}textarea{min-height:180px;font:12px monospace}button{background:#192333;font-weight:700;min-height:45px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs{display:flex;gap:7px;overflow:auto}.tab{white-space:nowrap;width:auto;padding:9px 12px;margin:0}pre{white-space:pre-wrap;word-break:break-word;background:#080a0e;border-radius:12px;padding:12px;max-height:55vh;overflow:auto;font:11px ui-monospace,monospace}.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#202938;color:#c8d4e4;margin:3px 3px 0 0;font-size:11px}.warn{color:#ffb6b6}.ok{color:#a9edc0}</style><script src="app-config.js?v=20260823-2"></script><script src="i18n-runtime.js?v=20260823-2"></script><script src="language-onboarding.js?v=20260823-2"></script><script src="license-client.js?v=20260823-2"></script><script src="access.js?v=20260823-2"></script><script src="analytics-client.js?v=20260823-2"></script><script src="app-center.js?v=20260823-2"></script></head>
<body><main><div class="card"><h1>🔎 LuckyJet Inspector V2</h1><div class="sub">Версия для iPhone: поиск session/customer, UUID, WebSocket и API. Не вводи логины, пароли, cookies или токены.</div></div>
<div class="card"><b>URL LuckyJet</b><input id="url" value="https://1w-ftend.life/casino/play/v_1wingames:luckyjet" inputmode="url"><div class="grid"><button onclick="openSite()">Открыть</button><button onclick="corsFetch()">Получить HTML</button></div><div id="msg" class="sub" style="margin-top:8px"></div></div>
<div class="card"><b>Импорт данных</b><input id="file" type="file" accept=".har,.html,.htm,.json,.txt,.webarchive"><div class="sub">HAR особенно полезен: он содержит сетевые запросы.</div></div>
<div class="card"><b>Исходный текст</b><textarea id="src" placeholder="Вставь HTML / JSON / текст ответа"></textarea><button onclick="analyze(src.value)">⚡ Найти данные</button></div>
<div class="card"><div class="tabs"><button class="tab" onclick="show('all')">Все</button><button class="tab" onclick="show('session')">Session</button><button class="tab" onclick="show('network')">Network</button><button class="tab" onclick="show('urls')">URL</button></div><div id="counts"></div><pre id="out">Результат появится здесь.</pre></div></main>
<script>let data={all:[],session:[],network:[],urls:[]};const out=document.getElementById('out'),msg=document.getElementById('msg');function openSite(){let u=url.value.trim();if(!/^https?:\\/\\//i.test(u)){msg.textContent='Неверный URL';return}window.open(u,'_blank','noopener');msg.textContent='Открыто. Network другой вкладки браузерный HTML прочитать не может.'}async function corsFetch(){let u=url.value.trim();msg.textContent='Пробую получить HTML…';try{let r=await fetch(u,{credentials:'omit'});let t=await r.text();src.value=t;analyze(t);msg.textContent='HTML получен';msg.className='sub ok'}catch(e){msg.textContent='CORS/защита сайта заблокировала запрос. Используй HAR или HTML.';msg.className='sub warn'}}document.getElementById('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;let t=await f.text();if(/\\.har$/i.test(f.name)){try{analyzeHar(JSON.parse(t))}catch{out.textContent='Не удалось прочитать HAR'}}else{src.value=t;analyze(t)}};function uniq(a){return[...new Set(a)].slice(0,150)}function analyze(t){data={all:[],session:[],network:[],urls:[]};const rules=[['SESSION',/\\b(?:session[-_ ]?id|sessionId|session_id)\\b.{0,220}/gi,'session'],['CUSTOMER',/\\b(?:customer[-_ ]?id|customerId|customer_id)\\b.{0,220}/gi,'session'],['UUID',/\\b[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\\b/gi,'session'],['WEBSOCKET',/wss?:\\/\\/[^"'\\s<>]+/gi,'network'],['API',/https?:\\/\\/[^"'\\s<>]*(?:api|history|game|round|luckyjet)[^"'\\s<>]*/gi,'network'],['URL',/https?:\\/\\/[^"'\\s<>]+/gi,'urls']];for(const[name,re,type]of rules){let a=uniq([...t.matchAll(re)].map(x=>x[0]));if(a.length){let block='### '+name+' ('+a.length+')\\n'+a.join('\\n');data[type].push(block);data.all.push(block)}}counts.innerHTML='<span class="badge">Session: '+data.session.length+'</span><span class="badge">Network: '+data.network.length+'</span><span class="badge">URL: '+data.urls.length+'</span>';show('all')}function analyzeHar(h){let entries=h?.log?.entries||[],text=['HAR entries: '+entries.length];for(const e of entries){const u=e.request?.url||'';if(/luckyjet|session|socket|wss|history|api|game/i.test(u)){text.push('\\nREQUEST\\n'+u+'\\nMethod: '+(e.request?.method||''));for(const x of e.request?.headers||[])if(!/cookie|authorization|token|password|api[-_]key/i.test(x.name))text.push(x.name+': '+x.value);if(e.response?.content?.text)text.push('\\nRESPONSE BODY\\n'+e.response.content.text.slice(0,8000))}}analyze(text.join('\\n'))}function show(k){out.textContent=(data[k]||[]).join('\\n\\n')||'Ничего не найдено.'}</script></body></html>
