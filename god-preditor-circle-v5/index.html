<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOD PREDITOR · LIVE CIRCLE V5</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 45%,#271149,#070811 65%,#030309);color:#f4eaff;font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:18px 12px}main{max-width:680px;margin:auto}h1{font-size:23px;letter-spacing:2px;color:#dfbaff}#status{font-size:12px;color:#bca9db;margin:12px 0 20px}.rounds{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.round{background:#130d27;border:1px solid #423064;border-radius:11px;padding:9px 1px}.round b{display:block;font-size:clamp(12px,3.6vw,18px);color:#b6ffd5}.round.hot b{color:#ffca87}.round small{display:block;font-size:10px;color:#a5a0bd;margin-top:4px}.orb{width:min(83vw,350px);aspect-ratio:1;margin:30px auto 20px;display:grid;place-items:center;position:relative}.orb:before,.orb:after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(transparent,#bc60ff,transparent,#53d7ff,transparent);animation:spin 6s linear infinite;filter:drop-shadow(0 0 13px #9b40ff)}.orb:after{inset:13px;animation-direction:reverse;animation-duration:4s;filter:blur(8px)}.center{position:relative;z-index:1;width:calc(100% - 48px);height:calc(100% - 48px);border-radius:50%;background:radial-gradient(circle,#261340,#0c091a 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #6e3b9c;box-shadow:inset 0 0 26px #4d2775}.tiny{font-size:11px;color:#c8a6f0;letter-spacing:1px}.clock{font-size:clamp(30px,9vw,43px);font-weight:800;font-variant-numeric:tabular-nums;margin:10px 0}.target{font-size:25px;font-weight:800;color:#cb8fff}.window{font-size:13px;color:#d5c6e8;margin-top:9px}#outcome{font-size:17px;line-height:1.6}#details{font-size:12px;color:#b7a5cd;margin-top:10px}footer{font-size:11px;color:#81778d;margin:22px auto;max-width:500px}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><main><h1>GOD PREDITOR</h1><div id="status">Подключение к Supabase…</div><div class="rounds" id="rounds"></div><div class="orb"><div class="center"><div class="tiny">ОКНО ПРОГНОЗА · КИЕВ</div><div class="clock" id="clock">--:--:--</div><div class="target" id="target">ОЖИДАНИЕ</div><div class="window" id="window">Ожидаем историю</div></div></div><div id="outcome">⏳ Подключение…</div><div id="details"></div><footer>Прогноз основан на статистике истории; подтверждённой предсказательной точности нет.</footer></main><script src="../luckyjet-supabase.js"></script><script>(()=>{'use strict';const $=id=>document.getElementById(id),fmt=t=>new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Kyiv',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(t)),med=a=>{if(!a.length)return null;let x=[...a].sort((a,b)=>a-b),n=x.length;return n%2?x[(n-1)/2]:(x[n/2-1]+x[n/2])/2},clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const KEY='god-circle-v5-verified';let rows=[],online=false,loaded=0,signal=null,previous=null;try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o?.signal)signal=o.signal;if(o?.previous)previous=o.previous}catch{}function save(){try{localStorage.setItem(KEY,JSON.stringify({signal,previous}))}catch{}}function clean(arr){const ids=new Set();return(arr||[]).map(r=>({id:String(r.id),coefficient:Number(r.coefficient),timestamp:Number(r.timestamp)||Date.parse(r.round_timestamp||r.time),estimated:r.estimated===true})).filter(r=>r.id&&Number.isFinite(r.coefficient)&&r.coefficient>=1&&Number.isFinite(r.timestamp)&&!ids.has(r.id)&&(ids.add(r.id),true)).sort((a,b)=>a.timestamp-b.timestamp)}function renderRows(){const nodes=rows.slice(-20).reverse().map(r=>{let d=document.createElement('div');d.className='round'+(r.coefficient>=10?' hot':'');let b=document.createElement('b'),s=document.createElement('small');b.textContent=r.coefficient.toFixed(2)+'×';s.textContent=fmt(r.timestamp);d.append(b,s);return d});$('rounds').replaceChildren(...nodes)}function evaluate(now){if(!signal)return;const hit=rows.filter(r=>!r.estimated&&r.timestamp>=signal.start&&r.timestamp<=signal.end&&r.timestamp>signal.issuedAt&&r.coefficient>=signal.target)[0];if(now<=signal.end)return;const inside=rows.filter(r=>!r.estimated&&r.timestamp>=signal.start&&r.timestamp<=signal.end);const left=rows.filter(r=>!r.estimated&&r.timestamp<=signal.start).at(-1),right=rows.find(r=>!r.estimated&&r.timestamp>=signal.end);let result='UNVERIFIED';if(hit)result='WIN';else if(left&&right&&inside.length){const seq=[left,...inside,right];if(seq.every((r,i)=>!i||r.timestamp-seq[i-1].timestamp<=180000))result='LOSE'}if(result==='UNVERIFIED')return;previous={...signal,result,actual:hit?.coefficient||null,actualAt:hit?.timestamp||null,closedAt:now};signal=null;save()}function propose(now){if(signal||!online||rows.length<200||!rows.length||now-rows.at(-1).timestamp>180000)return;const valid=rows.filter(r=>!r.estimated&&r.timestamp<=now);if(valid.length<200)return;const gaps=valid.slice(-1000).map((r,i,a)=>i?r.timestamp-a[i-1].timestamp:0).filter(x=>x>0&&x<=300000),pace=med(gaps);if(!pace||!Number.isFinite(pace))return;const targets=[10,40,200,500];let target=10;for(const t of targets){if(valid.filter(r=>r.coefficient>=t).length>=8)target=t}const start=now+clamp(Math.round(pace),10000,120000);signal={id:'bayes-frequency:'+valid.at(-1).id+':'+now,target,start,end:start+180000,issuedAt:now,model:'bayesian-frequency-baseline',sampleSize:valid.length};save()}function render(){const now=Date.now();$('clock').textContent=fmt(now);evaluate(now);if(!signal&&(!previous||now-previous.closedAt>12000))propose(now);if(signal){$('target').textContent='ЦЕЛЬ '+signal.target+'×';$('window').textContent=fmt(signal.start)+' — '+fmt(signal.end);$('outcome').textContent=now<signal.start?'⏳ ОЖИДАНИЕ НАЧАЛА':now<=signal.end?'⏳ ОКНО АКТИВНО':'⏳ ПРОВЕРКА РАУНДОВ';$('details').textContent='Сигнал зафиксирован '+fmt(signal.issuedAt)+' · '+signal.sampleSize+' раундов'}else if(previous&&now-previous.closedAt<=12000){$('target').textContent='ЦЕЛЬ '+previous.target+'×';$('window').textContent=fmt(previous.start)+' — '+fmt(previous.end);$('outcome').textContent=previous.result==='WIN'?'✅ ЗАШЛО · '+previous.actual.toFixed(2)+'× · '+fmt(previous.actualAt):'❌ НЕ ЗАШЛО';$('details').textContent='Результат зафиксирован'}else{$('target').textContent='ОЖИДАНИЕ';$('window').textContent='Нет подтверждённого окна';$('outcome').textContent=online?'⏳ Недостаточно точной истории':'⚠️ Нет свежего Supabase';$('details').textContent=''}if(signal&&now>signal.end&&(!online||!rows.length||rows.at(-1).timestamp<signal.end))$('outcome').textContent='⚠️ НЕДОСТАТОЧНО ДАННЫХ ДЛЯ ПРОВЕРКИ'}async function load(){const api=window.LuckyJetSupabase;if(!api){$('status').textContent='Модуль Supabase не найден';return}try{const r=await api.history(1000,0,true);rows=clean(r.rows);online=true;loaded=Date.now();$('status').textContent='● SUPABASE LIVE · '+rows.length+' раундов';renderRows()}catch(e){online=false;loaded=Date.now();$('status').textContent='● SUPABASE OFFLINE · '+(e?.message||'ошибка')}render()}window.addEventListener('luckyjetSupabaseRound',e=>{rows=clean([...rows,e.detail]).slice(-1000);online=true;renderRows();render()});setInterval(()=>{render();if(Date.now()-loaded>15000)load()},1000);load()})();</script></body></html>
