<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090612">
<title>V0xFF3 · NATIVE LIVE + SQLite FIX</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090612}
#v0{display:block;width:100%;height:100dvh;border:0;background:#090612}
</style>
<script src="app-config.js?v=20260823-2"></script><script src="i18n-runtime.js?v=20260823-2"></script><script src="language-onboarding.js?v=20260823-2"></script><script src="license-client.js?v=20260823-2"></script><script src="access.js?v=20260823-2"></script><script src="analytics-client.js?v=20260823-2"></script><script src="app-center.js?v=20260823-2"></script></head>
<body>
<iframe id="v0" src="./v0xff3.html?v=20260825-6" allow="autoplay; fullscreen; screen-wake-lock"></iframe>
<script>
(()=>{
  'use strict';
  const STORE='v0xff3_browser_engine_v1';
  const frame=document.getElementById('v0');
  let lastFingerprint='';

  function readState(){
    try{
      const s=JSON.parse(localStorage.getItem(STORE)||'null');
      if(!s||typeof s!=='object')return null;
      s.rounds=(Array.isArray(s.rounds)?s.rounds:[])
        .filter(r=>r&&Number.isFinite(Number(r.coefficient)))
        .sort((a,b)=>Number(a.ts||0)-Number(b.ts||0));
      s.signals=Array.isArray(s.signals)?s.signals:[];
      return s;
    }catch(_){return null}
  }

  function latestOpenSignal(s){
    if(!s||!Array.isArray(s.signals))return null;
    for(let i=s.signals.length-1;i>=0;i--)if(s.signals[i]&&!s.signals[i].result)return s.signals[i];
    return null;
  }

  function roundProgress(s){
    const sig=latestOpenSignal(s);
    if(!sig)return 0;
    const start=Number(sig.primaryStart||sig.createdAt||Date.now());
    return Math.min(3,s.rounds.filter(r=>Number(r.ts||0)>=start).length);
  }

  function installCss(d){
    if(!d||d.getElementById('v0-native-fix-css'))return;
    const style=d.createElement('style');
    style.id='v0-native-fix-css';
    style.textContent=`
      @media(max-width:600px) and (max-height:900px){
        html,body{overflow-y:auto!important;overflow-x:hidden!important}
        .app{height:auto!important;min-height:100dvh!important;overflow:visible!important;padding-bottom:calc(8px + env(safe-area-inset-bottom))!important}
        .signal-card.show{position:static!important;z-index:1!important;left:auto!important;right:auto!important;bottom:auto!important;width:auto!important;margin:0!important;padding:8px 10px!important;border-radius:13px!important;box-shadow:none!important;flex:0 0 auto!important;max-height:none!important;overflow:visible!important}
        .signal-card h2{font-size:12px!important;margin:0 0 5px!important}
        .signal-grid{grid-template-columns:repeat(4,1fr)!important;gap:4px!important}
        .signal-grid div{padding:4px!important}
        .signal-grid span{font-size:6px!important}
        .signal-grid b{font-size:9px!important;margin-top:1px!important}
        .basis{font-size:6px!important;margin-top:4px!important;line-height:1.2!important}
        .section{position:relative!important;z-index:2!important}
        .actions{position:relative!important;z-index:2!important}
      }
    `;
    d.head.appendChild(style);
  }

  function installFetch(w){
    if(!w||w.__V0_NATIVE_FETCH_FIX__)return;
    const original=w.fetch.bind(w);
    w.__V0_NATIVE_FETCH_FIX__=true;
    w.fetch=async function(input,init){
      const url=String(input&&input.url||input||'');
      if(url.includes('crash-gateway-grm-cr.100hp.app/history')){
        const s=readState();
        if(s&&s.rounds.length){
          const newest=s.rounds.slice(-120).reverse().map(r=>({id:String(r.id),topCoefficient:Number(r.coefficient),timestamp:Number(r.ts||Date.now())}));
          return new w.Response(JSON.stringify({history:newest}),{status:200,headers:{'Content-Type':'application/json','X-V0xFF3-Source':'NATIVE-SQLITE'}});
        }
      }
      return original(input,init);
    };
  }

  function paint(){
    let d,w;
    try{d=frame.contentDocument;w=frame.contentWindow}catch(_){return}
    if(!d||!w)return;
    installCss(d);
    installFetch(w);
    const s=readState();
    if(!s||!s.rounds.length)return;

    const rows=s.rounds;
    const last=rows[rows.length-1];
    const fp=String(last.id)+'|'+Number(last.coefficient).toFixed(4)+'|'+rows.length;
    lastFingerprint=fp;

    const coef=d.getElementById('lastCoef');
    if(coef)coef.textContent=Number(last.coefficient).toFixed(2)+'X';

    const conn=d.getElementById('connection');
    if(conn){conn.className='connection ok';conn.textContent='● NATIVE LIVE + SQLite · '+rows.length+' в базе · LIVE '+Number(last.coefficient).toFixed(2)+'X'}

    const count=d.getElementById('roundCount');
    if(count)count.textContent=rows.length+' раундов · SQLite';

    const roundValue=d.getElementById('roundsAfter');
    if(roundValue){
      const box=roundValue.closest('.stat');
      const label=box&&box.querySelector('span');
      if(label)label.textContent='РАУНД';
      roundValue.textContent=roundProgress(s)+'/3';
    }

    const chart=d.getElementById('chart');
    if(chart){
      const tail=rows.slice(-8);
      chart.innerHTML=tail.map(r=>{
        const c=Number(r.coefficient);
        const h=Math.max(5,Math.min(100,Math.log10(Math.max(1.01,c))*58+7));
        const cls=c>=30?'x30':c>=10?'x10':c>=2?'x2':'';
        return '<div class="bar-wrap"><div class="bar '+cls+'" style="height:'+h+'%"></div><div class="bar-value">'+c.toFixed(1)+'</div></div>';
      }).join('');
    }
  }

  // Native WKWebView calls this after every SQLite write.
  window.V0N=paint;
  window.V0FF3_NATIVE_REFRESH=paint;

  frame.addEventListener('load',()=>{
    try{installFetch(frame.contentWindow);installCss(frame.contentDocument)}catch(_){}
    paint();setTimeout(paint,80);setTimeout(paint,400);setTimeout(paint,1200);
  });
  window.addEventListener('storage',paint);
  setInterval(paint,120);
})();
</script>
</body>
</html>
