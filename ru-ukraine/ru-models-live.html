<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>LuckyJet RU — Models</title>
<style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#061A40}iframe{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="app" src="./index.html" title="LuckyJet RU"></iframe>
<script>
(function(){
  const frame=document.getElementById('app');
  frame.addEventListener('load',function(){
    try{
      const doc=frame.contentDocument;
      if(!doc||doc.getElementById('ru-model-script')) return;
      const s=doc.createElement('script');
      s.id='ru-model-script';
      s.src='https://raw.githubusercontent.com/MiuiProKing/luckyjet-telegram-mini-app/feature/ru-models-when-to-bet/ru-ukraine/ru-models.js?v=1';
      doc.body.appendChild(s);
    }catch(e){console.error('RU models loader:',e)}
  });
})();
</script>
</body>
</html>
