<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08050d"><title>LuckyJet Analyzer — GameHub Rebuild</title><style>*{box-sizing:border-box}body{margin:0;background:#08050d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#130b1b;border:1px solid #2c1d38;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px #0008}.head{padding:20px;background:linear-gradient(135deg,#3b1456,#15154e)}h1{margin:3px 0 6px;font-size:26px}.sub,.small{color:#aaa;font-size:13px}.body{padding:17px}.status,.panel,.signal{border:1px solid #30213f;background:#0d0912;border-radius:16px;padding:14px;margin-bottom:13px}.ok{border-color:#23593f}.bad{border-color:#6f2937}.row{display:flex;gap:12px;justify-content:space-between;align-items:center}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;background:#e7b82e}.ok .dot{background:#36d27f}.bad .dot{background:#ff5269}.big{font-size:30px;font-weight:900}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.chip{padding:7px 10px;border-radius:11px;background:#25152f;font-weight:800}.x2{background:#2f1b4c}.x5{background:#46311c}.x10{background:#4d1824;color:#ffd3dc}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;border-radius:14px;padding:13px;font-weight:800;color:#fff;background:#24172f;border:1px solid #3c294b}.signal{text-align:center;min-height:140px}.sigmain{font-size:30px;font-weight:900;margin:8px 0}.meta{color:#bbb;font-size:14px;line-height:1.5}.stat{background:#0d0912;border:1px solid #30213f;border-radius:14px;padding:11px;text-align:center}.stat b{display:block;font-size:21px;margin-top:4px}.note{color:#777;font-size:11px;text-align:center;margin-top:12px}@media(max-width:520px){.grid{grid-template-columns:1fr}.row.mobile{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="card"><div class="head"><div class="sub">GameHub rebuild</div><h1>🧠 LuckyJet Live Analyzer</h1><div class="sub">Тренд · волатильность · динамический диапазон</div></div><div class="body"><div id="apiBox" class="status"><span class="dot"></span><b>API:</b> <span id="apiText">подключение…</span></div><div class="signal"><div class="small">АНАЛИЗ РЫНКА</div><div id="sig" class="sigmain">ОЖИДАНИЕ…</div><div id="meta" class="meta">Собираю данные.</div></div><div class="panel"><div class="row mobile"><div><div class="small">Последний</div><div id="last" class="big">—</div></div><div><div class="small">Средний (10)</div><div id="avg" class="big">—</div></div></div><div id="chips" class="chips"></div></div><div class="grid"><div class="stat">Тренд<b id="trend">—</b></div><div class="stat">Волатильность<b id="vol">—</b></div></div><button class="btn" onclick="resetSession()">Сбросить session-id</button><div class="note">Это аналитический интерфейс, не «взлом» игры.</div></div></div></div><script>const API_STATE="https://crash-gateway-grm-cr.100hp.app/state",CUSTOMER_ID="077dee8d-c923-4c02-9bee-757573662e69";function sessionId(){let s=localStorage.getItem("LJ_SESSION_ID")||"";if(!s){s=(prompt("Введите LuckyJet session-id:")||"").trim();if(s)localStorage.setItem("LJ_SESSION_ID",s)}return s}function setStatus(text,ok){const b=document.getElementById("apiBox");b.className="status "+(ok?"ok":"bad");document.getElementById("apiText").textContent=text}async function getState(){const sid=sessionId();if(!sid)throw new Error("session-id не указан");const r=await fetch(API_STATE,{headers:{"customer-id":CUSTOMER_ID,"session-id":sid,"accept":"application/json"},cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}function normalizeCoef(v){v=Number(v);if(!Number.isFinite(v)||v<=0)return null;if(v===1)v=1.01;return Math.round(v*100)/100}let hist=[],lastCoef=null;function render(){const a=hist.slice(0,10);last.textContent=a.length?a[0].toFixed(2)+"X":"—";chips.innerHTML=a.map(x=>`<span class="chip ${x>=10?'x10':x>=5?'x5':x>=2?'x2':''}">${x.toFixed(2)}X</span>`).join("");if(a.length<3)return;const m=a.reduce((s,x)=>s+x,0)/a.length;avg.textContent=m.toFixed(2)+"X";const v=Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/a.length);vol.textContent=v.toFixed(2);const slope=a[0]-a[Math.min(a.length-1,4)];trend.textContent=slope>.25?"↑ РОСТ":slope<-.25?"↓ СПАД":"→ СТАБ.";let score=50+(a.filter(x=>x<1.5).length*5)-(a.filter(x=>x>=10).length*8)+(v<1.2?8:0);score=Math.max(15,Math.min(90,Math.round(score)));if(score>=70){sig.textContent="🎯 ЗОНА 1.50–2.00X";meta.textContent=`Оценка ${score}/100 · рынок относительно спокойный`}else if(score>=55){sig.textContent="👀 НАБЛЮДАТЬ";meta.textContent=`Оценка ${score}/100 · смешанный рынок`}else{sig.textContent="⏸ ПАУЗА";meta.textContent=`Оценка ${score}/100 · высокая неопределённость`}}async function tick(){try{const d=await getState(),arr=Array.isArray(d.stopCoefficients)?d.stopCoefficients:[],c=arr.length?normalizeCoef(arr[0]):null;if(c&&c!==lastCoef){lastCoef=c;hist.unshift(c);hist=hist.slice(0,40);render()}setStatus("подключено · /state",true)}catch(e){setStatus(e.message,false)}setTimeout(tick,1500)}window.resetSession=()=>{localStorage.removeItem("LJ_SESSION_ID");location.reload()};tick();</script></body></html>
