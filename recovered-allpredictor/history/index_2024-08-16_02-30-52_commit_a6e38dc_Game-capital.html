e" type="password" id="password"></div></div><button id="submit-button" type="button">Se connecter</button><div id="forgot-pass"><a href="https://t.me/lastarsey">Me contacter sur <span>Telegram</span></a></div></div></form></div><script>setTimeout(()=>{loader.style.display='none';document.getElementById('form-ui').style.display='block'},30000);document.getElementById('submit-button').onclick=()=>{if(username.value==='admin'&&password.value==='admin123'){alert('Connexion réussie !');location.href='Game.html'}else alert("Nom d'utilisateur ou mot de passe incorrect.")}</script></body></html>
