name: LuckyJet10xCollector
options:
  bundleIdPrefix: com.miuiproking
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: NO
    CLANG_ENABLE_MODULES: YES
    OTHER_LDFLAGS: "-ObjC"
targets:
  LuckyJet10xCollector:
    type: application
    platform: iOS
    sources:
      - path: LuckyJet10xCollector
    info:
      path: LuckyJet10xCollector/Info.plist
      properties:
        CFBundleDevelopmentRegion: ru
        CFBundleDisplayName: LuckyJet 10x Collector
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miuiproking.LuckyJet10xCollector
        PRODUCT_NAME: LuckyJet10xCollector
        INFOPLIST_FILE: LuckyJet10xCollector/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    dependencies:
      - sdk: UIKit.framework
      - sdk: WebKit.framework
