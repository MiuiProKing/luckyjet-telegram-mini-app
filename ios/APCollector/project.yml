name: APCollector
options:
  bundleIdPrefix: com.miuiproking
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: NO
    CLANG_ENABLE_MODULES: YES
    OTHER_LDFLAGS: "-ObjC"
targets:
  APCollector:
    type: application
    platform: iOS
    sources:
      - path: APCollector
    info:
      path: APCollector/Info.plist
      properties:
        CFBundleDevelopmentRegion: ru
        CFBundleDisplayName: AP Collector
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        NSScreenCaptureUsageDescription: "Захват экрана включается только после вашего разрешения и используется для распознавания видимых коэффициентов и адресов страниц."
        UIBackgroundModes:
          - screen-capture
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miuiproking.APCollector
        PRODUCT_NAME: APCollector
        INFOPLIST_FILE: APCollector/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SWIFT_VERSION: "5.0"
    dependencies:
      - sdk: UIKit.framework
      - sdk: Vision.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: CoreImage.framework
      - sdk: QuartzCore.framework
