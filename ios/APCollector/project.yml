name: APCollector
options:
  bundleIdPrefix: com.miuiproking
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: NO
    CLANG_ENABLE_MODULES: YES
    OTHER_LDFLAGS: "-ObjC"
targets:
  APCollector:
    type: application
    platform: iOS
    sources:
      - path: APCollector
    info:
      path: APCollector/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miuiproking.APCollector
        PRODUCT_NAME: APCollector
        INFOPLIST_FILE: APCollector/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SWIFT_VERSION: "5.0"
    dependencies:
      - framework: UIKit.framework
      - framework: Vision.framework
      - framework: CoreMedia.framework
      - framework: CoreVideo.framework
      - framework: CoreImage.framework
