<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070812">
<title>GOD PREDITOR 2X</title>
<style>
:root{--blue:#079df7;--violet:#8b5cf6;--green:#10b981;--red:#ef4444;--panel:#12131c;--border:rgba(255,255,255,.14)}*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:#070812;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:max(12px,env(safe-area-inset-top)) 12px max(22px,env(safe-area-inset-bottom));display:flex;justify-content:center}.wrap{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:11px}.topbar{width:100%;position:relative;display:flex;align-items:center;justify-content:center;height:44px}h1{font-size:22px;letter-spacing:1.5px}h1 span{color:#09aaf8;text-shadow:0 0 16px #09aaf899}.icon-btn{position:absolute;top:1px;width:42px;height:42px;border:1px solid var(--border);border-radius:13px;background:#11121b;color:#fff;font-size:19px;display:grid;place-items:center;box-shadow:none}.icon-btn:first-child{left:0}.icon-btn:last-child{right:0}.mode-badge{padding:7px 15px;border:1px solid #09aaf8;border-radius:999px;background:#09aaf811;color:#8dd8ff;font-size:12px;font-weight:800;letter-spacing:.8px}.circle{width:170px;height:170px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#131b32,#070812 72%);overflow:hidden;box-shadow:0 0 32px #09aaf855,inset 0 0 30px #09aaf833}.ring{position:absolute;inset:9px;border:3px solid #09aaf8;border-radius:50%}.ring-spin{position:absolute;inset:-2px;border-radius:50%;background:conic-gradient(transparent,#09aaf8,transparent 38%);-webkit-mask:radial-gradient(farthest-side,transparent calc(50% - 5px),#000 calc(50% - 4px));mask:radial-gradient(farthest-side,transparent calc(50% - 5px),#000 calc(50% - 4px));animation:spin 5s linear infinite}.orb{display:none}@keyframes spin{to{transform:rotate(360deg)}}#multiplier{position:relative;z-index:1;text-align:center;font-size:30px;font-weight:900;color:#fff;text-shadow:0 0 15px #09aaf8}#multiplier small{font-size:16px;color:#8dd8ff}.meta{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.cell{min-height:61px;border:1px solid var(--border);border-radius:14px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.title{font-size:10px;color:#969bad;text-transform:uppercase;letter-spacing:.7px}.value{font-size:18px;font-weight:900}button{width:100%;height:48px;border:0;border-radius:13px;background:linear-gradient(135deg,#09aaf8,#1760e8);color:#fff;font-weight:900;letter-spacing:.8px;cursor:pointer}#autoButton{background:linear-gradient(135deg,#ef4444,#991b1b)}#autoButton.on{background:linear-gradient(135deg,#10b981,#047857)}.status{width:100%;min-height:18px;text-align:center;font-size:12px;line-height:1.4}.status.ok,.ok{color:var(--green)}.status.ko,.ko{color:var(--red)}.analysis-window{width:100%;border:1px solid var(--border);border-radius:15px;background:var(--panel);padding:11px;display:flex;flex-direction:column;gap:6px}.analysis-title{font-size:11px;font-weight:900;color:#8dd8ff;letter-spacing:1px}.analysis-reason{font-size:13px;font-weight:800;line-height:1.4}.analysis-stats{font-size:11px;color:#a7aabd;line-height:1.45}.panel{position:fixed;z-index:50;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));max-width:600px;margin:auto;max-height:86vh;overflow:auto;background:#11121b;border:1px solid var(--border);border-radius:18px;box-shadow:0 18px 60px #000;opacity:0;pointer-events:none;transform:translateY(-18px);transition:.2s}.panel.open{opacity:1;pointer-events:auto;transform:none}.panel-header{display:flex;align-items:center;padding:14px;font-weight:900}.panel-close{margin-left:auto;width:35px;height:35px;border-radius:10px;background:#272938;display:grid;place-items:center;cursor:pointer}.panel-close:after{content:"×";font-size:24px}.panel-body{padding:0 14px 15px}.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.chip{padding:10px;text-align:center;border-radius:12px;background:#292b3a}.chip.ok{background:#064e3b;color:#fff}.chip.ko{background:#4c1420;color:#fff}.chip small{display:block;margin-top:3px;font-size:10px}.actions{display:flex;flex-direction:column;gap:8px}.btn-secondary{background:#292b3a}.danger{background:#4c1420}.hint{font-size:12px;color:#a7aabd;margin:6px 0 12px}@media(max-height:760px){.wrap{gap:8px}.circle{width:145px;height:145px}.cell{min-height:52px}.analysis-window{padding:9px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="topbar"><button class="icon-btn" id="openSettings" aria-label="Настройки">☰</button><h1>GOD <span>2X</span></h1><button class="icon-btn" id="openHistory" aria-label="История">◷</button></header>
  <div class="mode-badge">ТОЛЬКО ЦЕЛЬ 2.00X · SQLITE 24/7</div>
  <div class="circle" id="circle"><div class="ring-spin" id="spin"></div><div class="ring"></div><div id="multiplier">2.00X<br><small>АНАЛИЗ</small></div></div>
  <section class="meta"><div class="cell"><div class="title">Время входа</div><div id="betTime" class="value">--:--:--</div></div><div class="cell"><div class="title">Проверка</div><div class="value"><span id="roundStatus">0</span>/3</div></div><div class="cell"><div class="title">Последний</div><div id="lastCoef" class="value">—</div></div></section>
  <section class="meta"><div class="cell"><div class="title">WIN ✅</div><div id="countOk" class="value">0</div></div><div class="cell"><div class="title">LOSE ❌</div><div id="countKo" class="value">0</div></div><div class="cell"><div class="title">Всего</div><div id="countTotal" class="value">0</div></div></section>
  <button id="generateButton">ПОЛУЧИТЬ СИГНАЛ 2X</button><button id="autoButton">АВТО 2X: ВЫКЛ</button>
  <div id="verifyStatus" class="status">Подключение к серверной SQLite…</div>
  <section class="analysis-window"><div class="analysis-title">АНАЛИЗ 2X</div><div id="analysisReason" class="analysis-reason">Загрузка коэффициентов…</div><div id="analysisStats" class="analysis-stats"></div></section>
</main>
<section class="panel" id="historyPanel"><div class="panel-header">ИСТОРИЯ 2X<div class="panel-close" id="closeHistory"></div></div><div class="panel-body"><div class="chips" id="chipsContainer"></div></div></section>
<section class="panel" id="settingsPanel"><div class="panel-header">НАСТРОЙКИ<div class="panel-close" id="closeSettings"></div></div><div class="panel-body"><div class="hint">Цель всегда фиксирована: 2.00x. Сигнал проверяется по следующим трём новым раундам.</div><div class="actions"><button class="btn-secondary danger" id="resetStats">Очистить статистику</button><button class="btn-secondary danger" id="resetHistory">Очистить историю</button></div><div id="settingsMsg" class="hint"></div></div></section>
<script>window.GOD_CONFIG={storagePrefix:'god_2x_exact_v1',variant:'x2',mode:'x2',minTarget:2,maxTarget:2,pollMs:5000};</script>
<script src="god-preditor-engine.js?v=20260830-6"></script>
</body></html>
