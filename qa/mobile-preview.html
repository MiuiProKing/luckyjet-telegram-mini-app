<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AllPredictor — проверка узкого экрана</title><style>
*{box-sizing:border-box}body{margin:0;background:#20222b;color:#eff2fa;font:14px system-ui}main{padding:16px;max-width:960px;margin:auto}h1{font-size:20px}label{display:inline-flex;gap:8px;align-items:center;margin:6px}button,select{font:inherit;padding:8px;background:#343846;color:inherit;border:1px solid #777;border-radius:6px}button[aria-pressed=true]{background:#256342}#screen{width:390px;max-width:100%;margin:16px auto;border:1px solid #9297a6;background:#111}iframe{display:block;width:100%;height:844px;border:0}output{display:block;white-space:pre-wrap;overflow-wrap:anywhere;background:#12151c;padding:12px;line-height:1.6}.note{color:#b9becc;font-size:12px}
</style></head><body><main><h1>Проверка мобильной вёрстки</h1><p class="note">Служебный просмотр. Ширина внутреннего окна соответствует телефону; расчёты и игровые кнопки не запускаются этим просмотрщиком.</p><div><label>Страница <select id="page"><option value="../design/#/">Главная</option><option value="../design/#/catalogue">Каталог</option><option value="../design/#/history">История</option><option value="../design/#/settings">Настройки</option><option value="../index.html?qa=mobile2#luckyjet">Classic</option><option value="../pro-luckyjet.html?qa=mobile2">PRO</option></select></label><span id="widths"><button type="button" data-width="320">320 px</button><button type="button" data-width="360">360 px</button><button type="button" data-width="390" aria-pressed="true">390 px</button><button type="button" data-width="430">430 px</button></span></div><output id="report">Загрузка…</output><div id="screen"><iframe id="preview" title="Мобильный экран" src="../design/#/"></iframe></div><button id="inspect" type="button">Обновить проверку</button></main><script>
const frame=document.getElementById('preview'),report=document.getElementById('report');
document.getElementById('page').onchange=e=>{frame.src=e.target.value;report.textContent='Загрузка…'};
document.getElementById('widths').onclick=e=>{if(!e.target.dataset.width)return;document.getElementById('screen').style.width=e.target.dataset.width+'px';for(const b of document.querySelectorAll('[data-width]'))b.setAttribute('aria-pressed',String(b===e.target));setTimeout(inspect,300)};
function inspect(){try{const d=frame.contentDocument,w=d.documentElement.clientWidth,sw=Math.max(d.documentElement.scrollWidth,d.body.scrollWidth);const toolbar=d.getElementById('appResponsiveToolbar');const bad=toolbar?[...toolbar.querySelectorAll('button,a')].filter(el=>{const r=el.getBoundingClientRect();return r.width&& (r.left<-.5||r.right>w+.5)}).map(el=>el.id||el.textContent.trim()):[];const wrap=d.querySelector('.wrap'),r=wrap?.getBoundingClientRect();report.textContent=JSON.stringify({viewport:w,documentWidth:sw,horizontalOverflow:sw>w+1,toolbarButtonsOutside:bad,mainBounds:r?{left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width)}:null,source:d.getElementById('luckyjetSupabaseStatus')?.textContent?.trim().slice(0,200)||null,pinVisible:!!d.querySelector('#access-pin,#ap-pin-input')},null,2)}catch(e){report.textContent='Ожидание страницы: '+e.message}}
frame.addEventListener('load',()=>setTimeout(inspect,2000));document.getElementById('inspect').onclick=inspect;setInterval(inspect,3000);
</script></body></html>
